# Workspace-policy checks that no single crate owns: the directory/naming/publish
# grammar every official package must obey, plus a handful of hygiene guards that
# assert facts about the workspace as a whole.
#
# This crate has no command, and is deliberately not called `xtask`: that name
# promises a `cargo xtask` command runner. What is left is a library that
# exists to be a test target, so `cargo test --workspace` enforces the policy.
[package]
name = "workspace-policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
cargo_metadata = "0.23.1"
serde = { workspace = true }
serde_json = { workspace = true }
toml_edit = "0.25.12"

[dev-dependencies]
phoxal = { workspace = true }
phoxal-manifest = { workspace = true }
tempfile = { workspace = true }
# Reads the built-artifact linker section back out for
# `participant_metadata_section_survives_the_linker` - the one honest way to
# prove the ELF `--gc-sections` defeat (`phoxal-macros`'
# `link_section_attrs`/`Participant::__retain_embedded_metadata`) actually
# holds through a real link, not just at the source level. Version pinned to
# match `phoxal-cli`'s own object-file reader
# (`crates/core/src/check/participant_metadata.rs`), the only other place in
# either repo that parses this section.
object = "0.36"

[lints]
workspace = true
