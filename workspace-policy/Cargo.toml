# Workspace-policy checks that no single crate owns: the directory/naming/publish
# grammar every official package must obey, plus a handful of hygiene guards that
# assert facts about the workspace as a whole.
#
# This crate has no command, and is deliberately not called `xtask`: that name
# promises a `cargo xtask` command runner, and the last verb went with the
# API-coherence gate (organization#957) after the release verbs went with the
# archive release model (organization#951). What is left is a library that
# exists to be a test target, so `cargo test --workspace` enforces the policy.
[package]
name = "workspace-policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
cargo_metadata = "0.23.1"
serde = { workspace = true }
serde_json = { workspace = true }
toml_edit = "0.25.12"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
