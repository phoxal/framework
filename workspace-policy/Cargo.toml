# Workspace-policy checks that no single crate owns: the directory/naming/publish
# grammar every official package must obey, plus a handful of hygiene guards that
# assert facts about the workspace as a whole.
#
# This crate has no command: the `cargo xtask` command runner lives in `xtask/`,
# and this is a library that exists to be a test target, so `cargo test
# --workspace` enforces the policy.
[package]
name = "workspace-policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
cargo_metadata = "0.23.1"

[dev-dependencies]
phoxal = { workspace = true }
phoxal-manifest = { workspace = true }
# The producer/consumer boundary `tests/facade_agreement.rs` pins is the model
# crate's own asset-id rule, and the record `tests/participant_metadata.rs`
# reads back out of a linked binary is the runtime contract's own document, so
# both are named at their canonical paths rather than through `phoxal`.
phoxal-model = { workspace = true }
phoxal-runtime-contract = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
toml_edit = "0.25.12"
# Reads the built-artifact linker section back out in
# `tests/participant_metadata.rs` - the one honest way to prove the ELF
# `--gc-sections` defeat (`phoxal-macros`'
# `link_section_attrs`/`Participant::__retain_embedded_metadata`) actually
# holds through a real link, not just at the source level. Version pinned to
# match `phoxal-cli`'s own object-file reader
# (`crates/core/src/check/participant_metadata.rs`), the only other place in
# either repo that parses this section.
object = "0.36"

[lints]
workspace = true
