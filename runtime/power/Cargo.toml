[package]
name = "phoxal-runtime-power"
version = "0.19.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Phoxal official runtime: power - host lifecycle commands via Balena supervisor."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "phoxal-runtime-power"
path = "src/main.rs"

[dependencies]
phoxal = { workspace = true }
phoxal-api = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net"] }

[lints]
workspace = true

# Image-matrix params for the release-plz pipeline. The release-plz.yml
# `parse-runtimes` job reads `[package.metadata.phoxal].api` to scope each
# runtime's GHCR image tag (`runtime-<svc>:<api>-v<version>`), instead of a
# hand-maintained matrix in the workflow.
[package.metadata.phoxal]
api = "y2026_1"
