[package]
name = "phoxal-runtime-battery"
version = "0.19.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Phoxal official runtime: battery — simulated battery-state monitor (y2026_1)."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "phoxal-runtime-battery"
path = "src/main.rs"

[dependencies]
phoxal = { workspace = true }
phoxal-api = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true

# Image-matrix params for the release-plz pipeline. The release-plz.yml
# `parse-runtimes` job reads `[package.metadata.phoxal].api` to scope each
# runtime's GHCR image tag (`runtime-<svc>:<api>-v<version>`), instead of a
# hand-maintained matrix in the workflow.
[package.metadata.phoxal]
api = "y2026_1"
