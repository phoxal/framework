[package]
name = "phoxal-simulator-webots-robot-controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["phoxal"]
description = "Phoxal Webots per-robot typed component controller."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "phoxal-simulator-webots-robot-controller"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
phoxal = { workspace = true, features = ["simulator"] }
phoxal-simulator-webots-host = { path = "../host", version = "=0.67.1", registry = "phoxal" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
webots-rs = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
