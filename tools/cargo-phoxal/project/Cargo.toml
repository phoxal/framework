[package]
name = "phoxal-project"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["phoxal"]
description = "Project discovery, composition validation, and Cargo orchestration for Phoxal."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[package.metadata.phoxal]
kind = "library"

[dependencies]
base64 = { workspace = true }
cargo_metadata = { workspace = true }
flate2 = { workspace = true }
fs4 = { workspace = true }
jsonschema = { workspace = true }
keyring = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true }
object = { workspace = true }
prost-reflect = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }

# Shared serialized artifact format. Owns the inert record family
# (RuntimeRecord, BundleManifest, NativeBodySample, etc.) that the tool
# layer emits and that the supervisor, SDK, and simulator consume. The
# tool layer re-exports these types so internal call sites continue to
# use `crate::simulation::NativeBodySample` etc.
phoxal-artifact-format = { workspace = true }

# The tool owns the project preparation, simulator/simulator provisioning,
# supervisor lifecycle, and case-host orchestration. The tool also
# generates the harness `main.rs` (under
# `<robot>/.phoxal/generated/scenarios/main.rs`) which depends on the
# SDK only. The SDK supplies `scenario::__harness` for the harness side
# of the case-host protocol. The compile-and-list integration test
# exercises the generated scenario harness through that surface.
phoxal = { workspace = true, features = ["scenario"] }

[dev-dependencies]
object = { workspace = true, features = ["write"] }
tempfile = { workspace = true }

[lints]
workspace = true
