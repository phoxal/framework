# The workspace's command runner, reached as `cargo xtask <verb>` through the
# alias in `.cargo/config.toml`.
#
# It carries a binary and no library, so it sits outside the library-crate
# grammar `cargo xtask policy` enforces, and it is absent from
# `release-plz.toml`: this package is private and has its own tooling version.
#
# It depends on no framework crate on purpose. The policy gate reads `cargo
# metadata`, the filesystem, and Git without building the runtime stack it
# judges, so it stays cheap on a bare development machine.
[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
# The policy gate's whole view of the workspace: which packages it declares,
# where their manifests sit, and what each depends on.
cargo_metadata = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
syn = { workspace = true }
# The policy gate reads manifest tables Cargo does not model - the workspace
# zenoh feature list, the release-plz package configuration - so it reads them
# from the document itself.
toml_edit = "0.25.12"

[dev-dependencies]
# Manifest fixtures for the toolchain-floor reader, written and thrown away.
tempfile = { workspace = true }

[lints]
workspace = true
