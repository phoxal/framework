# Workspace-policy checks that no single crate owns: the directory/naming/publish
# grammar every official package must obey, plus a handful of hygiene guards that
# assert facts about the workspace as a whole.
#
# This crate has no command. It was `cargo xtask`'s home until the API-coherence
# gate - its last remaining verb - was deleted with the rest of that machinery
# (organization#957); the release verbs had already gone with the archive release
# model (organization#951). What is left is a library that exists to be a test
# target, so `cargo test --workspace` keeps enforcing the policy.
[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
cargo_metadata = "0.23.1"
glob = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml_edit = "0.25.12"

[lints]
workspace = true
