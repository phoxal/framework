[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
cargo_metadata = "0.23.1"
clap = { workspace = true }
glob = { workspace = true }
hex = "0.4.3"
object = "0.36"
# The `#[derive(phoxal::Api)]` metadata section JSON shape (version/contract/
# role/external) is deserialized via the shared `phoxal::participant::metadata`
# type, not a local re-definition - this crate only owns the object-file
# section-BYTES extraction (`xtask/src/release/metadata.rs`).
phoxal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = "0.4.46"
toml_edit = "0.25.12"
zstd = "0.13.3"

[dev-dependencies]
# Cross-format extraction proof (xtask/src/release/metadata.rs tests): the
# `write` feature synthesizes a foreign-arch object file at test time so the
# reader is exercised against an architecture other than the host's. Feature
# unification enables it only for the test build; the shipped xtask binary
# keeps `object`'s default (read-only) feature set.
object = { version = "0.36", features = ["write"] }
tempfile = { workspace = true }

[lints]
workspace = true
