[package]
name = "phoxal-simulator-webots-controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Phoxal official simulator: Webots per-robot component-capability controller."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[package.metadata.phoxal]
unsupported-targets = ["*-musl", "aarch64-unknown-linux-gnu"]

[[bin]]
name = "phoxal-simulator-webots-controller"
path = "src/main.rs"

[dependencies]
phoxal = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_yaml = { workspace = true }
tracing = { workspace = true }
webots-rs = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
