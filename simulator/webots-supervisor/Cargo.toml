[package]
name = "phoxal-simulator-webots-supervisor"
version = "0.1.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Phoxal official simulator: Webots world/session supervisor authority."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[package.metadata.phoxal]
unsupported-targets = ["*-musl", "aarch64-unknown-linux-gnu"]

[[bin]]
name = "phoxal-simulator-webots-supervisor"
path = "src/main.rs"

[dependencies]
phoxal = { workspace = true }
phoxal-api = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_yaml = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
webots-rs = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
