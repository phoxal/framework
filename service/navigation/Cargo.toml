[package]
name = "phoxal-service-navigation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["phoxal"]
description = "Phoxal official service: lifecycle-aware planning, following, and exploration."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "phoxal-service-navigation"
path = "src/main.rs"

[dependencies]
phoxal = { workspace = true }
phoxal-bus = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
# The lifecycle test drives the participant over a real bus with a `TestClock`
# injected through `run_with_bus_clock`. Neither is production authoring API, so
# both sit behind `test-harness` and are pulled in for tests only.
phoxal = { workspace = true, features = ["test-harness"] }
tokio = { workspace = true }

[lints]
workspace = true
