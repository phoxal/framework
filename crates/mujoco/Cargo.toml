[package]
name = "phoxal-mujoco"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["phoxal"]
description = "Native MuJoCo model, workspace, and fixed-step execution primitives for Phoxal."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[package.metadata.phoxal]
kind = "library"

[features]
default = []
# The native feature is intentionally opt-in so hardware projects and the generic
# framework can compile without a MuJoCo installation or rendering stack.
native = ["dep:mujoco-rs"]

[dependencies]
phoxal-port = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
# `mujoco-rs` 6.0.1 is the binding release for MuJoCo 3.12.0.
# Cargo ignores build metadata in version requirements, so the native engine
# pin is documented and enforced by the binding release plus CI's download URL.
mujoco-rs = { version = "=6.0.1", optional = true, default-features = false }

[dev-dependencies]
phoxal-component-bno085 = { path = "../../components/bno085" }
phoxal-component-ddsm115 = { path = "../../components/ddsm115" }
phoxal-component-oak_d_lite = { path = "../../components/oak_d_lite" }
phoxal-component-vl53l1x = { path = "../../components/vl53l1x" }
phoxal-component-zed_f9p = { path = "../../components/zed_f9p" }
phoxal-motion = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
