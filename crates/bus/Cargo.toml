[package]
name = "phoxal-bus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
description = "Phoxal bus ABI floor: the Zenoh-native contract bus client and the API-version / contract-body primitive traits."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
name = "phoxal_bus"
path = "src/lib.rs"

[dependencies]
getrandom = { workspace = true }
libc = { workspace = true }
phoxal-macros = { workspace = true }
phoxal-runtime-contract = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
tracing = { workspace = true }
zenoh = { workspace = true }

[features]
test-harness = []
# The supervisor's embedded Zenoh router. Off by default so
# participants - which reach this crate through the `phoxal` facade - never see
# a router in their API surface; only the framework-owned `phoxal-supervisor`
# executable enables it.
#
# It carries `zenoh/unstable`, which the router needs for two APIs with no
# stable equivalent: `Session::info().locators()` to report the endpoints it
# actually bound (an ephemeral `:0` is otherwise unknowable), and
# `link_events_listener()` to observe links coming and going. Pulling
# `unstable` in *here* rather than on the workspace dependency keeps that
# surface out of every participant build - only the supervisor gets it.
router = ["zenoh/unstable"]

[dev-dependencies]
# `tests/frozen_wire_protocol.rs` reads the resolved `zenoh-protocol` out of the
# graph Cargo actually compiles, which is the only place the version this crate
# freezes can be compared against the one the transport speaks.
anyhow = { workspace = true }
cargo_metadata = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
