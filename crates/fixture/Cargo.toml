[package]
# The authored documents this stages are not here: they are at `fixture/` in
# the workspace root, where the tests that need documents rather than a bundle
# read them by path. Splitting the two is what lets this crate obey the
# library rule like any other - `phoxal-fixture` at `crates/fixture` - instead
# of being the one member `cargo xtask policy` had to exempt.
name = "phoxal-fixture"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
description = "Staging for the workspace fixture robot, used by other crates' tests."
# Never published. It exists only so the workspace's own tests share one answer
# to what the fixture robot is, and its assets are meaningless outside this
# repository.
publish = false

[dependencies]
# The authored documents this crate stages are compiled by `phoxal::authoring`
# and land as `phoxal::model`'s canonical types, so it needs the framework's one
# library with the authored-source layer enabled.
phoxal = { workspace = true, features = ["authoring"] }
tempfile = { workspace = true }

[lints]
workspace = true
