[package]
# The authored documents this stages are not here: they are at `fixture/` in
# the workspace root, where the tests that need documents rather than a bundle
# read them by path. Splitting the two is what lets this crate obey the
# library rule like any other - `phoxal-fixture` at `crates/fixture` - instead
# of being the one member `cargo xtask policy` had to exempt.
name = "phoxal-fixture"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
description = "Staging for the workspace fixture robot, used by other crates' tests."
# Never published. It exists only so the workspace's own tests share one answer
# to what the fixture robot is, and its assets are meaningless outside this
# repository.
publish = false

[dependencies]
# The authored documents this crate stages are compiled by the manifest crate
# and land as the model crate's canonical types. It deliberately does not depend
# on `phoxal`: staging test assets is not participant-engine behavior, and
# keeping the engine out means enabling this crate cannot pull a runtime into a
# test build.
phoxal-manifest = { workspace = true }
phoxal-bundle = { workspace = true }
phoxal-model = { workspace = true }
phoxal-runtime-contract = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
