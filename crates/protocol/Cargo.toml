[package]
name = "phoxal-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
description = "Phoxal's wire-protocol contract families and typed endpoint builders over the phoxal-bus ABI floor."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
name = "phoxal_protocol"
path = "src/lib.rs"

[dependencies]
phoxal-bus = { workspace = true }
phoxal-macros = { workspace = true }
phoxal-model = { workspace = true }
phoxal-runtime-contract = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_bytes = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
rmp-serde = { workspace = true }
serde_json = { workspace = true }

# `serde_bytes` is referenced by `#[serde(with = "serde_bytes")]`; cargo-machete
# cannot see dependencies named only inside attributes.
[package.metadata.cargo-machete]
ignored = ["serde_bytes"]

[lints]
workspace = true
