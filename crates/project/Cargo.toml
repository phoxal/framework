[package]
name = "phoxal-project"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["phoxal"]
description = "Project discovery, composition validation, and Cargo orchestration for Phoxal."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[package.metadata.phoxal]
kind = "library"

[dependencies]
base64 = { workspace = true }
cargo_metadata = { workspace = true }
flate2 = { workspace = true }
fs4 = { workspace = true }
jsonschema = { workspace = true }
keyring = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true }
object = { workspace = true }
prost-reflect = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }

# Shared serialized artifact format. Owns the inert record family
# (RuntimeRecord, BundleManifest, NativeBodySample, etc.) that the tool
# layer emits and that the supervisor, SDK, and simulator consume. The
# tool layer re-exports these types so internal call sites continue to
# use `crate::simulation::NativeBodySample` etc.
phoxal-artifact-format = { workspace = true }

# The case-host driver in `scenario::case_host` constructs SDK
# scenario types (`ScenarioRun`, `TerminalEvidence`, `Program`,
# `EvidenceCollector`, `Quantum`) to translate the supervised
# `SimulationRunReport` into lifecycle-owned terminal evidence on
# the planned scenario's program. The compile-and-list integration
# test also exercises the generated scenario harness.
phoxal = { workspace = true, features = ["scenario"] }

[dev-dependencies]
object = { workspace = true, features = ["write"] }
tempfile = { workspace = true }

[lints]
workspace = true
