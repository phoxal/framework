[package]
name = "phoxal-project"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["phoxal"]
description = "Project discovery, composition validation, and Cargo orchestration for Phoxal."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[package.metadata.phoxal]
kind = "library"

[dependencies]
base64 = { workspace = true }
cargo_metadata = { workspace = true }
flate2 = { workspace = true }
fs4 = { workspace = true }
jsonschema = { workspace = true }
keyring = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true }
object = { workspace = true }
prost-reflect = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }

[dev-dependencies]
object = { workspace = true, features = ["write"] }
tempfile = { workspace = true }

# The compile-and-list integration test compiles the generated scenario
# harness with `rustc --extern phoxal=...`; declaring `phoxal` here with
# the `scenario` feature ensures `cargo test` builds a matching rlib in
# `target/debug/deps` deterministically.
phoxal = { workspace = true, features = ["scenario"] }

[lints]
workspace = true
