[package]
name = "example-simulation-rover"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "AGPL-3.0-only"
description = "A path-based native-motion qualification robot for the Phoxal workspace."

[workspace]
resolver = "3"

[workspace.dependencies]
anyhow = "1"
phoxal = { path = "../../../../phoxal", version = "=0.0.0-dev.1" }
phoxal-supervisor = { path = "../../../../supervisor", version = "=0.0.0-dev.1" }
ddsm115 = { package = "phoxal-component-ddsm115", path = "../../../../components/ddsm115", version = "=0.0.0-dev.1" }
vl53l1x = { package = "phoxal-component-vl53l1x", path = "../../../../components/vl53l1x", version = "=0.0.0-dev.1" }
kinematics = { package = "phoxal-service-kinematics", path = "../../../../services/kinematics", version = "=0.0.0-dev.1" }
world = { package = "phoxal-service-world", path = "../../../../services/world", version = "=0.0.0-dev.1" }
safety = { package = "phoxal-service-safety", path = "../../../../services/safety", version = "=0.0.0-dev.1" }
motion = { package = "phoxal-service-motion", path = "../../../../services/motion", version = "=0.0.0-dev.1" }
prost = "0.14.4"
serde_json = "1"

[dependencies]
anyhow.workspace = true
phoxal.workspace = true
phoxal-supervisor.workspace = true
ddsm115.workspace = true
vl53l1x.workspace = true
kinematics.workspace = true
world.workspace = true
safety.workspace = true
motion.workspace = true
prost.workspace = true
serde_json.workspace = true

[profile.dev.package.sha2]
opt-level = 3

[[test]]
name = "phoxal-scenarios"
path = ".phoxal/generated/scenarios/main.rs"
harness = false
test = false

[dev-dependencies]
clap = { version = "4.6.1", features = ["derive"] }
phoxal = { path = "../../../../phoxal", version = "=0.0.0-dev.1", features = ["scenario", "port"] }
