# $schema: ../../.phoxal/schemas/component.schema.json
schema: component/v0
capabilities:
  motor:
    kind: motor
    command: velocity
    max_torque_nm: 1.0
    max_velocity_radps: 20.0
    gear_ratio: 1.0
    target:
      kind: joint
      id: motor_joint
  encoder:
    kind: encoder
    publish_rate_hz: 50.0
    gear_ratio: 1.0
    encoder_type: incremental
    counts_per_revolution: 2048
    target:
      kind: joint
      id: motor_joint
