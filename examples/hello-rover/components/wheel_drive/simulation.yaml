# $schema: ../../.phoxal/schemas/simulation.schema.json
schema: phoxal/simulation/v0
capabilities:
  motor:
    kind: motor
    actuator_type: velocity
  encoder:
    kind: encoder
    # The world advances every 16 ms (62.5 Hz). Keep the device on that
    # cadence; the authored component still publishes at 50 Hz and the
    # logical-time schedule supplies its honest long-run phase.
    sampling_period_hz: 62.5
    resolution: 0.003067962
links:
  wheel:
    contact_material: rubber_wheel
