[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = false
description = "Phoxal hello-rover - a minimal differential-drive example robot."

[workspace]
resolver = "3"
members = ["."]

[workspace.dependencies]
phoxal = "0.42.3"

[workspace.lints.rust]
unused = "warn"

# Profiles are Cargo's stock `dev` and `release`, unmodified (organization#951).
# A `[profile]` table here would apply only to workspace builds - `cargo install`
# builds each registry package as its own root and never reads it - so tuning it
# would silently split the bundle between tuned project runtimes and stock
# official ones.

[package]
name = "hello-rover"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Hello-rover Cargo train anchor."

[dependencies]
phoxal = { workspace = true }

[lints]
workspace = true
