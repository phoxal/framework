[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
publish = false
description = "Phoxal framework — engine + complete platform runtime set."
documentation = "https://github.com/phoxal/framework#readme"
homepage = "https://github.com/phoxal/framework"
repository = "https://github.com/phoxal/framework"

[workspace]
resolver = "3"
members = [
    "phoxal",
    "runtime/asset",
    "runtime/drive",
    "runtime/explore",
    "runtime/follow",
    "runtime/frame",
    "runtime/joint",
    "runtime/localize",
    "runtime/localize/orb-slam3-sys",
    "runtime/map",
    "runtime/mission",
    "runtime/motion",
    "runtime/odometry",
    "runtime/perception",
    "runtime/plan",
    "runtime/power",
    "runtime/presence",
    "runtime/safety",
    "runtime/video",
]

[workspace.dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
clap = { version = "4.6.1", features = ["derive"] }
const_format = "0.2"
derive-new = "0.7.0"
derive_setters = "0.1.9"
dotenvy = "0.15.7"
nalgebra = { version = "0.34.2", features = ["serde-serialize"] }
openh264 = { version = "0.9.3", default-features = false, features = ["source"] }
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }
rmp-serde = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.149"
serde_yaml = "0.9"
serial_test = "3"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "signal", "sync", "fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
trybuild = "1"
urdf-rs = "0.9.0"
zenoh = { version = "1.9.0" }
phoxal                                  = { path = "phoxal" }
phoxal-runtime-localize-orb-slam3-sys  = { path = "runtime/localize/orb-slam3-sys" }

[workspace.lints.rust]
unused = "warn"

[profile.release]
lto = false
codegen-units = 16
