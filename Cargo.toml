[workspace]
resolver = "3"
# SDK libraries and small SDK-owned compile/runtime fixtures.
members = [
    "phoxal-build",
    "tests/contracts/client",
    "tests/contracts/client/provider",
    "tests/contracts/foreign-reading",
    "tests/contracts/identity-owner-a",
    "tests/contracts/identity-owner-b",
    "tests/contracts/schema-proof",
    "tests/contracts/standard-plus-custom",
    "tests/hardware/driver",
    "tests/runtime-authoring/multistage",
    "tests/runtime-authoring/procedure",
    "phoxal",
    "phoxal-macros",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = false
description = "Phoxal SDK, shared contracts, and runtime/session primitives."
documentation = "https://github.com/phoxal/framework#readme"
homepage = "https://github.com/phoxal/framework"
repository = "https://github.com/phoxal/framework"

[workspace.dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive", "env"] }
fs4 = "1.1.0"
getrandom = "0.3.4"
heck = "0.5.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
prost = "0.14.4"
prost-reflect = "0.16.5"
prost-types = "0.14.4"
prettyplease = "0.2.37"
object = "0.36.7"
quote = "1.0"
schemars = "1.2.1"
sha2 = "0.10.9"
jsonschema = { version = "0.46.6", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_derive_internals = "0.29.1"
serde_bytes = "0.11.19"
serde_json = "1.0.149"
semver = "1.0"
serde_yaml = "0.9"
serial_test = "3"
syn = { version = "2.0", features = ["full", "extra-traits"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "signal", "sync", "fs", "process"] }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
trybuild = "1"
# Default features minus transport_compression: Phoxal never enables zenoh
# compression at runtime, so the feature only pulls lz4_flex into shipped
# binaries. Re-enable defaults if a Phoxal transport ever compresses.
# Pinned exactly, not caret: `unstable` gates APIs Zenoh may change in any
# release, so the bump must be a deliberate act that fails to compile rather
# than something `cargo update` performs silently.
zenoh = { version = "=1.9.0", default-features = false, features = [
    "auth_pubkey",
    "auth_usrpwd",
    "transport_multilink",
    "transport_quic",
    "transport_quic_datagram",
    "transport_tcp",
    "transport_tls",
    "transport_udp",
    "transport_unixsock-stream",
    "transport_ws",
] }
# Carry a version (not just a path) on every internal dep: cargo strips the path
# on publish/package and resolves the dep by version from the index. Without it,
# `cargo package` fails ("all dependencies must have a version requirement") - this
# also preserves ordinary standalone package verification.
# `default-features = false`: `phoxal` carries one consumer profile per
# supported role, and a member that inherits a default profile never says which
# role it is. Every member below names its own.
phoxal = { path = "phoxal", version = "=0.0.0-dev.8", registry = "phoxal", default-features = false }
phoxal-macros = { path = "phoxal-macros", version = "=0.0.0-dev.8", registry = "phoxal" }
phoxal-build = { path = "phoxal-build", version = "=0.0.0-dev.8", registry = "phoxal" }

[workspace.lints.rust]
unused = "warn"

# The panic and stub rules, enforced rather than reviewed.
#
# A Runtime process is long-lived and may supervise hardware: a panic takes the
# whole robot process down, so a failure that a caller could act on must be a
# typed error and not a `.unwrap()`. Denied at the workspace root rather than
# per crate so a new member inherits the gate by writing `[lints] workspace =
# true`, which every member already does.
#
# Where a type-level or bootstrap invariant genuinely proves a call cannot fail,
# the exception is a localized `#[expect(clippy::expect_used, reason = "...")]`
# on the item that carries the invariant. A crate-level `allow` is not an
# acceptable form of it: it removes the gate for every future line of that crate
# too.
#
# Tests are exempt through `clippy.toml`, which is where clippy takes that
# switch; a test that cannot get its temporary inputs has nothing to report but
# a panic.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"

# Profiles are Cargo's stock `dev` and `release`, unmodified.
# A `[profile]` table here would apply only to workspace builds - `cargo install`
# builds each registry package as its own root and never reads it - so tuning it
# would silently split the bundle between tuned project runtimes and stock
# official ones.

# Source and executable integrity checks must remain practical in debug builds.
[profile.dev.package.sha2]
opt-level = 3
