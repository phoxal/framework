[workspace.package]
version = "0.11.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
publish = false
description = "Phoxal framework — engine + complete platform runtime set."
documentation = "https://github.com/phoxal/framework#readme"
homepage = "https://github.com/phoxal/framework"
repository = "https://github.com/phoxal/framework"

[workspace]
resolver = "3"
# Greenfield rewrite (tmp/framework-rewrite): the engine crate + its proc-macros.
# The official runtime/simulator/tool crates are re-ported onto the new authoring
# surface in a later phase and are intentionally out of the workspace for now.
members = [
    "phoxal",
    "phoxal-macros",
]

[workspace.dependencies]
anyhow = "1.0.102"
arc-swap = "1.9.1"
async-trait = "0.1.89"
clap = { version = "4.6.1", features = ["derive", "env"] }
const_format = "0.2"
derive-new = "0.7.0"
derive_setters = "0.1.9"
dotenvy = "0.15.7"
heck = "0.5.0"
nalgebra = { version = "0.34.2", features = ["serde-serialize"] }
proc-macro2 = "1.0"
quote = "1.0"
rmp-serde = "1.3.1"
schemars = "0.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.149"
serde_yaml = "0.9"
serial_test = "3"
syn = { version = "2.0", features = ["full", "extra-traits"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "signal", "sync", "fs", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
trybuild = "1"
urdf-rs = "0.9.0"
zenoh = { version = "1.9.0" }
phoxal-macros = { path = "phoxal-macros" }

[workspace.lints.rust]
unused = "warn"

[profile.release]
lto = false
codegen-units = 16
