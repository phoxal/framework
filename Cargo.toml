[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = false
description = "Phoxal framework - engine + complete platform service set."
documentation = "https://github.com/phoxal/framework#readme"
homepage = "https://github.com/phoxal/framework"
repository = "https://github.com/phoxal/framework"

[workspace]
resolver = "3"
# The engine crate and its proc-macros, plus the official services and suite
# component crates on the current authoring
# surface (components/<name> also carries the component definition: component.yaml,
# structure.urdf, simulation.yaml).
members = [
    "crates/fixture",
    "crates/build",
    "crates/port",
    "crates/robotics",
    "crates/project",
    "crates/installation",
    "crates/mujoco",
    "contracts/motion",
    "contracts/navigation",
    "contracts/kinematics",
    "contracts/world",
    "contracts/safety",
    "crates/contract-owner-fixture",
    "crates/contract-consumer-fixture",
    "crates/port-consumer-fixture",
    "phoxal",
    "crates/macros",
    "supervisor",
    "components/bno085",
    "components/ddsm115",
    "components/oak_d_lite",
    "components/vl53l1x",
    "components/zed_f9p",
    "services/kinematics",
    "services/motion",
    "services/navigation",
    "services/safety",
    "services/world",
    "simulators/webots/host",
    "simulators/webots/shared",
    "simulators/webots/world-controller",
    "simulators/webots/robot-controller",
    "xtask",
    "tools/cargo-phoxal",
]
# Keep the workspace's command runner out of plain root cargo builds: `xtask`
# is the runner a maintainer invokes by name (`cargo xtask <verb>`), not part of
# what this workspace produces. It is still built and tested by the
# `--workspace` commands CI runs.
# Invariant: default-members must contain every workspace member except xtask.
# When adding a workspace member, add it to both members and default-members;
# otherwise plain cargo build/test silently skips it.
default-members = [
    "crates/fixture",
    "crates/build",
    "crates/port",
    "crates/robotics",
    "crates/project",
    "crates/installation",
    "crates/mujoco",
    "contracts/motion",
    "contracts/navigation",
    "contracts/kinematics",
    "contracts/world",
    "contracts/safety",
    "crates/contract-owner-fixture",
    "crates/contract-consumer-fixture",
    "crates/port-consumer-fixture",
    "phoxal",
    "crates/macros",
    "supervisor",
    "components/bno085",
    "components/ddsm115",
    "components/oak_d_lite",
    "components/vl53l1x",
    "components/zed_f9p",
    "services/kinematics",
    "services/motion",
    "services/navigation",
    "services/safety",
    "services/world",
    "simulators/webots/host",
    "simulators/webots/shared",
    "simulators/webots/world-controller",
    "simulators/webots/robot-controller",
    "tools/cargo-phoxal",
]

[workspace.dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
base64 = "0.22.1"
# The workspace's own manifest reader, shared by the `cargo xtask policy` gate
# and by the two crates whose tests read the workspace the same way.
cargo_metadata = "0.23.1"
clap = { version = "4.6.1", features = ["derive", "env"] }
const_format = "0.2"
ctrlc = { version = "3.5.2", features = ["termination"] }
derive_setters = "0.1.9"
flate2 = "1.1.10"
gilrs = "0.11.2"
getrandom = "0.3.4"
heck = "0.5.0"
json5 = "0.4.1"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }
libc = "0.2.180"
nalgebra = { version = "0.34.2", features = ["serde-serialize"] }
proc-macro2 = "1.0"
prost = "0.14.4"
prost-build = "0.14.4"
prost-reflect = "0.16.5"
prost-types = "0.14.4"
protoc-bin-vendored = "3.2.0"
object = "0.36.7"
quote = "1.0"
rmp-serde = "1.3.1"
schemars = "1.2.1"
sha2 = "0.10.9"
jsonschema = { version = "0.46.6", default-features = false }
keyring = "3.6.3"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_derive_internals = "0.29.1"
serde_bytes = "0.11.19"
serde_json = "1.0.149"
serde_yaml = "0.9"
serial_test = "3"
system_shutdown = "4.1.0"
tar = "0.4.46"
syn = { version = "2.0", features = ["full", "extra-traits"] }
# `system` and `disk` are the minimal features for host/process CPU and memory
# sampling plus mounted-filesystem capacity. Default features additionally pull
# network/component/user bindings this workspace never reads. Pinned to 0.36
# (not the newest 0.39.x) because newer releases raise their MSRV past this
# workspace's `rust-version`.
sysinfo = { version = "0.36", default-features = false, features = ["disk", "system"] }
tempfile = "3.27.0"
tobj = { version = "4.0.4", default-features = false, features = ["use_f64"] }
thiserror = "2.0.18"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "signal", "sync", "fs", "process"] }
tokio-util = { version = "0.7", default-features = false }
toml = "1"
toml_edit = "0.25.12"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
trybuild = "1"
urdf-rs = "0.9.0"
webots-proto-ast = "0.2.0"
webots-rs = "0.2"
# Default features minus transport_compression: Phoxal never enables zenoh
# compression at runtime, so the feature only pulls lz4_flex into shipped
# binaries. Re-enable defaults if a Phoxal transport ever compresses.
# Pinned exactly, not caret: `unstable` gates APIs Zenoh may change in any
# release, so the bump must be a deliberate act that fails to compile rather
# than something `cargo update` performs silently.
zenoh = { version = "=1.9.0", default-features = false, features = [
    "auth_pubkey",
    "auth_usrpwd",
    "transport_multilink",
    "transport_quic",
    "transport_quic_datagram",
    "transport_tcp",
    "transport_tls",
    "transport_udp",
    "transport_unixsock-stream",
    "transport_ws",
] }
# Carry a version (not just a path) on every internal dep: cargo strips the path
# on publish/package and resolves the dep by version from the index. Without it,
# `cargo package` fails ("all dependencies must have a version requirement") - this
# also covers the service and component crates' dependency on `phoxal`.
# `default-features = false`: `phoxal` carries one consumer profile per
# supported role, and a member that inherits a default profile never says which
# role it is. Every member below names its own.
phoxal = { path = "phoxal", version = "=0.68.0", registry = "phoxal", default-features = false }
phoxal-macros = { path = "crates/macros", version = "=0.68.0", registry = "phoxal" }
phoxal-build = { path = "crates/build", version = "0.1.0", registry = "phoxal" }
phoxal-port = { path = "crates/port", version = "0.1.0", registry = "phoxal" }
phoxal-robotics = { path = "crates/robotics", version = "0.1.0", registry = "phoxal" }
phoxal-motion = { path = "contracts/motion", version = "0.1.0", registry = "phoxal" }
phoxal-navigation = { path = "contracts/navigation", version = "0.1.0", registry = "phoxal" }
phoxal-kinematics = { path = "contracts/kinematics", version = "0.1.0", registry = "phoxal" }
phoxal-world = { path = "contracts/world", version = "0.1.0", registry = "phoxal" }
phoxal-safety = { path = "contracts/safety", version = "0.1.0", registry = "phoxal" }
phoxal-project = { path = "crates/project", version = "0.1.0", registry = "phoxal" }
phoxal-installation = { path = "crates/installation", version = "0.1.0", registry = "phoxal" }
# Test-support only, and never published. Deliberately carries no version: a
# dev-dependency without one is stripped from the manifest on publish, so the
# participant crates that use it in tests stay publishable.
phoxal-fixture = { path = "crates/fixture" }

[workspace.lints.rust]
unused = "warn"

# The panic and stub rules, enforced rather than reviewed.
#
# A participant is a long-lived process supervising hardware: a panic takes the
# whole robot process down, so a failure that a caller could act on must be a
# typed error and not a `.unwrap()`. Denied at the workspace root rather than
# per crate so a new member inherits the gate by writing `[lints] workspace =
# true`, which every member already does.
#
# Where a type-level or bootstrap invariant genuinely proves a call cannot fail,
# the exception is a localized `#[expect(clippy::expect_used, reason = "...")]`
# on the item that carries the invariant. A crate-level `allow` is not an
# acceptable form of it: it removes the gate for every future line of that crate
# too.
#
# Tests are exempt through `clippy.toml`, which is where clippy takes that
# switch; a test that cannot get its fixture has nothing to report but a panic.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"

# Profiles are Cargo's stock `dev` and `release`, unmodified.
# A `[profile]` table here would apply only to workspace builds - `cargo install`
# builds each registry package as its own root and never reads it - so tuning it
# would silently split the bundle between tuned project runtimes and stock
# official ones.
