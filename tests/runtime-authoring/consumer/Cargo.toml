[package]
name = "phoxal-countdown-brain-fixture"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Authored brain consumer receiving countdown finished events through the graph."

[[bin]]
name = "countdown-brain-fixture"
path = "src/main.rs"

[dependencies]
phoxal = { workspace = true, default-features = false, features = ["runtime"] }

[build-dependencies]
phoxal = { workspace = true, default-features = false, features = ["build"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
