[package]
name = "phoxal-scenario-fixture"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "SDK-only scenario fixture. Constructs planned scenarios and validates them against non-rover quanta without depending on the project compiler, the simulator, or any service package. Used to prove the phoxal::scenario authoring surface remains self-sufficient after the SDK ownership migration."

[lib]
name = "phoxal_scenario_fixture"
path = "src/lib.rs"

[dependencies]
phoxal = { workspace = true, features = ["scenario"] }

[lints]
workspace = true
