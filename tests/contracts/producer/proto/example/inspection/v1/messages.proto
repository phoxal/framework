syntax = "proto3";

package example.inspection.v1;

message InspectionState {
  uint64 count = 1;
  bool active = 2;
}

message InspectionSample {
  uint64 sequence = 1;
}

message InspectionEvent {
  string kind = 1;
}

message InspectionStream {
  uint64 sequence = 1;
}

message InspectionSetpoint {
  double target = 1;
}

message InspectionReadRequest {
  string key = 1;
}

message InspectionReadResponse {
  InspectionState state = 1;
}

message InspectionCommandRequest {
  string command = 1;
}

message InspectionCommandResponse {
  bool accepted = 1;
}
