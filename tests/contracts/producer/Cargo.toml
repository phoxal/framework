[package]
name = "phoxal-contract-owner-fixture"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Independent service-owned Protobuf contract fixture."
include = ["api/**", "build.rs", "src/**", "Cargo.toml"]

[[bin]]
name = "phoxal-contract-owner-fixture"
path = "src/main.rs"

[features]
default = []

[dependencies]
phoxal = { workspace = true, default-features = false, features = ["contract"] }

[build-dependencies]
phoxal = { workspace = true, default-features = false, features = ["build"] }

[lints]
workspace = true
