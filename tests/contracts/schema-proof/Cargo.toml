[package]
name = "phoxal-schema-proof-fixture"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Wire and descriptor interop proof for Rust-authored Phoxal messages."

[lib]
name = "phoxal_schema_proof_fixture"

[[bin]]
name = "phoxal-schema-proof-fixture"
path = "src/bin/proof.rs"

[dependencies]
phoxal = { path = "../../../phoxal", default-features = false }
prost = { workspace = true }

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"

[dev-dependencies]
phoxal-build = { path = "../../../phoxal-build" }
object = { workspace = true }
prost-reflect = { workspace = true }
prost-types = { workspace = true }

[lints]
workspace = true

# These are used directly by the independent protoc reference build script.
[package.metadata.cargo-machete]
ignored = ["prost-build", "protoc-bin-vendored"]
