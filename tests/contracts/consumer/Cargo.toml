[package]
name = "phoxal-contract-consumer-fixture"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Manifest-authored consumer of the standard encoder contract."
include = ["api/**", "service.yaml", "build.rs", "src/**", "Cargo.toml", "Cargo.lock"]

[[bin]]
name = "phoxal-contract-consumer-fixture"
path = "src/main.rs"

[dependencies]
phoxal = { workspace = true, default-features = false, features = ["contract", "runtime", "robotics"] }
serde = { workspace = true }

[build-dependencies]
phoxal = { workspace = true, default-features = false, features = ["build"] }

[lints]
workspace = true
