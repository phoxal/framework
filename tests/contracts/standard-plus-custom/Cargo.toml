[package]
name = "standard-plus-custom"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "standard-plus-custom"
path = "src/main.rs"

[features]
# Integration lane: the warm-edit regression spawns Cargo on a scratch package.
e2e = []

[build-dependencies]
phoxal = { workspace = true, default-features = false, features = ["build"] }

[dependencies]
phoxal = { workspace = true, default-features = false, features = ["runtime"] }
