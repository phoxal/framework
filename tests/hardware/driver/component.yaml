schema: phoxal/component/v0
model:
  file: model.xml
  root_body: mount
capabilities:
  observation:
    kind: encoder
    publish_rate_hz: 50.0
    target:
      kind: joint
      id: fixture_joint
  actuator:
    kind: motor
    command: velocity
    max_torque_nm: 2.0
    max_velocity_radps: 10.0
    target:
      kind: actuator
      id: fixture_motor
    joint: fixture_joint

inputs:
  acquired:
    delivery: queue
    max_bytes: 4096
    max_items: 16
    required: true
    type: phoxal.fixture.hardware.v1.FixtureObservation
  actuator:
    delivery: latest
    lease:
      valid_for_ms: 100
    max_bytes: 1024
    required: true
    type: phoxal.fixture.hardware.v1.FixtureSetpoint

outputs:
  observations:
    delivery: queue
    max_bytes: 4096
    max_items: 16
    type: phoxal.fixture.hardware.v1.FixtureObservation
