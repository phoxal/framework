[package]
name = "phoxal-hardware-driver-fixture"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Production-shaped Runtime fixture for hardware driver acceptance."
include = ["src/**", "build.rs", "Cargo.toml", "model.xml", "component.yaml", "LICENSE", "README.md"]

[[bin]]
name = "phoxal-hardware-driver-fixture"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
phoxal = { workspace = true, default-features = false, features = ["runtime"] }
serde.workspace = true

[build-dependencies]
phoxal = { workspace = true, default-features = false, features = ["build"] }

[lints]
workspace = true
