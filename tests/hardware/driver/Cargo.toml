[package]
name = "phoxal-hardware-driver-fixture"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Production-shaped Runtime fixture for hardware driver acceptance."
include = [
    "src/**",
    "api/**",
    "build.rs",
    "Cargo.toml",
    "component.yaml",
    "model.xml",
]

[[bin]]
name = "phoxal-hardware-driver-fixture"
path = "src/main.rs"

[features]
default = ["runtime"]
runtime = ["phoxal/runtime", "dep:anyhow", "dep:serde"]

[dependencies]
anyhow = { workspace = true, optional = true }
phoxal = { workspace = true, default-features = false, features = ["contract"] }
serde = { workspace = true, optional = true }


[build-dependencies]
phoxal = { workspace = true, default-features = false, features = ["build"] }

[lints]
workspace = true
