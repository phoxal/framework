[package]
name = "phoxal-hardware-driver-fixture"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Production-shaped Runtime fixture for hardware driver acceptance."
include = [
    "generated/**",
    "src/**",
    "proto/**",
    "Cargo.toml",
    "component.yaml",
    "model.xml",
]

[lib]
name = "phoxal_hardware_driver_fixture"
path = "generated/lib.rs"

[[bin]]
name = "phoxal-hardware-driver-fixture"
path = "src/main.rs"
required-features = ["runtime"]

[features]
default = []
runtime = ["phoxal/runtime", "dep:anyhow", "dep:serde"]

[dependencies]
anyhow = { workspace = true, optional = true }
phoxal = { workspace = true, default-features = false, features = ["contract"] }
prost = { workspace = true }
serde = { workspace = true, optional = true }

[package.metadata.phoxal.contract]
protos = ["proto/phoxal/fixture/hardware/v1/hardware.proto"]
includes = ["proto"]
generated = "generated"

[lints]
workspace = true
