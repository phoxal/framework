syntax = "proto3";

package phoxal.test_controller.v1;

import "google/protobuf/empty.proto";
import "phoxal/api.proto";
import "phoxal/motion/v1/motion.proto";

service Controller {
  rpc Actuators(google.protobuf.Empty) returns (stream phoxal.motion.v1.ActuatorSetpoint) {
    option (phoxal.api.lease) = { valid_for_ms: 100 };
  }

  rpc Manual(phoxal.motion.v1.MotionIntent) returns (google.protobuf.Empty) {
    option (phoxal.api.lease) = { valid_for_ms: 100 };
  }
}
