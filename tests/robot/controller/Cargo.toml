[package]
name = "phoxal-test-controller"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Robot-local controller for the internal four-wheel qualification fixture."
include = ["src/**", "Cargo.toml", "Cargo.lock"]

[[bin]]
name = "phoxal-test-controller"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
phoxal = { workspace = true, default-features = false, features = ["runtime"] }

[lints]
workspace = true
