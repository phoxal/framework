[package]
name = "phoxal-test-controller"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Robot-local controller for the internal four-wheel qualification fixture."
include = ["api/**", "build.rs", "src/**", "Cargo.toml", "Cargo.lock"]

[[bin]]
name = "phoxal-test-controller"
path = "src/main.rs"
required-features = ["runtime"]

[features]
default = ["runtime"]
runtime = ["phoxal/runtime", "phoxal/robotics", "dep:anyhow"]

[dependencies]
anyhow = { workspace = true, optional = true }
phoxal = { workspace = true, default-features = false, features = ["contract"] }

[build-dependencies]
phoxal = { workspace = true, default-features = false, features = ["build"] }

[lints]
workspace = true
