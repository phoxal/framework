[package]
name = "phoxal-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
description = "Phoxal's train-selected API contract tree and typed topic builders, generated by phoxal_api_tree! over the phoxal-bus ABI floor."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
name = "phoxal_api"
path = "src/lib.rs"

[dependencies]
phoxal-bus = { workspace = true }
phoxal-macros = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_bytes = { workspace = true }

[dev-dependencies]
phoxal-runtime-contract = { workspace = true }
rmp-serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
