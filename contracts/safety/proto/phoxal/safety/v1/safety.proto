syntax = "proto3";

package phoxal.safety.v1;

import "google/protobuf/empty.proto";
import "phoxal/motion/v1/motion.proto";
import "phoxal/port.proto";
import "phoxal/world/v1/world.proto";

message RangeObservation {
  string sensor_id = 1;
  double distance_m = 2;
  bool valid = 3;
}

enum ConstraintReason {
  CONSTRAINT_REASON_UNSPECIFIED = 0;
  CONSTRAINT_REASON_WORLD_UNAVAILABLE = 1;
  CONSTRAINT_REASON_LOCALIZATION_UNCERTAIN = 2;
  CONSTRAINT_REASON_MAP_UNAVAILABLE = 3;
  CONSTRAINT_REASON_MAP_BLOCKED = 4;
  CONSTRAINT_REASON_RANGE_UNAVAILABLE = 5;
  CONSTRAINT_REASON_RANGE_FAULT = 6;
  CONSTRAINT_REASON_OBSTACLE_PROXIMITY = 7;
  CONSTRAINT_REASON_MOTION_UNAVAILABLE = 8;
  CONSTRAINT_REASON_MOTION_FAULT = 9;
}

message Constraint {
  ConstraintReason reason = 1;
  optional double max_linear_speed_mps = 2;
  optional double max_angular_speed_radps = 3;
  optional double observed_value = 4;
}

enum Permission {
  PERMISSION_UNSPECIFIED = 0;
  PERMISSION_CLEAR = 1;
  PERMISSION_LIMITED = 2;
  PERMISSION_STOPPED = 3;
}

message MotionConstraints {
  uint64 sequence = 1;
  Permission permission = 2;
  repeated Constraint constraints = 3;
  uint64 valid_from_nanos = 4;
  uint64 expires_at_nanos = 5;
}

message SafetyStatus {
  bool protective_state_clear = 1;
  uint64 sequence = 2;
  repeated ConstraintReason reasons = 3;
}

service Safety {
  rpc World(google.protobuf.Empty) returns (stream phoxal.world.v1.WorldBelief) {
    option (phoxal.port.kind) = STATE;
  }

  rpc WorldRevision(google.protobuf.Empty) returns (stream phoxal.world.v1.WorldRevision) {
    option (phoxal.port.kind) = STATE;
  }

  rpc Ranges(google.protobuf.Empty) returns (stream RangeObservation) {
    option (phoxal.port.kind) = SAMPLE;
  }

  rpc Motion(google.protobuf.Empty) returns (stream phoxal.motion.v1.MotionStatus) {
    option (phoxal.port.kind) = STATE;
  }

  rpc Constraints(google.protobuf.Empty) returns (stream MotionConstraints) {
    option (phoxal.port.kind) = STATE;
  }

  rpc Status(google.protobuf.Empty) returns (stream SafetyStatus) {
    option (phoxal.port.kind) = STATE;
  }
}
