syntax = "proto3";

package phoxal.kinematics.v1;

import "google/protobuf/empty.proto";
import "phoxal/port.proto";

message EncoderMeasurement {
  string encoder_id = 1;
  double position_rad = 2;
  double velocity_radps = 3;
  optional double effort_nm = 4;
}

message JointState {
  string joint_id = 1;
  double position_rad = 2;
  double velocity_radps = 3;
  optional double effort_nm = 4;
}

message OdometryState {
  double x_m = 1;
  double y_m = 2;
  double yaw_rad = 3;
  double linear_x_mps = 4;
  double angular_z_radps = 5;
  uint64 revision = 6;
  bool available = 7;
}

message FrameTransform {
  string parent_frame_id = 1;
  string child_frame_id = 2;
  double x_m = 3;
  double y_m = 4;
  double yaw_rad = 5;
}

message FrameTree {
  repeated FrameTransform transforms = 1;
  uint64 revision = 2;
}

enum UnavailableReason {
  UNAVAILABLE_REASON_UNSPECIFIED = 0;
  UNAVAILABLE_REASON_ENCODER = 1;
  UNAVAILABLE_REASON_INVALID_MEASUREMENT = 2;
  UNAVAILABLE_REASON_CONFIGURATION = 3;
}

message KinematicsStatus {
  bool available = 1;
  repeated UnavailableReason unavailable_reasons = 2;
  uint64 revision = 3;
}

message LookupFrameRequest {
  string parent_frame_id = 1;
  string child_frame_id = 2;
  uint64 revision = 3;
}

message LookupFrameResponse {
  optional FrameTransform transform = 1;
  uint64 revision = 2;
}

service Kinematics {
  rpc EncoderMeasurements(google.protobuf.Empty) returns (stream EncoderMeasurement) {
    option (phoxal.port.kind) = SAMPLE;
  }

  rpc Joints(google.protobuf.Empty) returns (stream JointState) {
    option (phoxal.port.kind) = SAMPLE;
  }

  rpc Odometry(google.protobuf.Empty) returns (stream OdometryState) {
    option (phoxal.port.kind) = STATE;
  }

  rpc Frames(google.protobuf.Empty) returns (stream FrameTree) {
    option (phoxal.port.kind) = STATE;
  }

  rpc Status(google.protobuf.Empty) returns (stream KinematicsStatus) {
    option (phoxal.port.kind) = STATE;
  }

  rpc LookupFrame(LookupFrameRequest) returns (LookupFrameResponse) {
    option (phoxal.port.kind) = READ;
  }
}
