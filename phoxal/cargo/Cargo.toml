[package]
name = "cargo-phoxal"
version = "0.0.0-dev.3"
workspace = "../.."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["phoxal"]
description = "The Phoxal project compiler and Cargo source-development command."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "cargo-phoxal"
path = "src/main.rs"

[dependencies]
# Public CLI surface.
clap = { workspace = true }
serde_json = { workspace = true }

# Project compiler implementation (private module).
base64 = { workspace = true }
cargo_metadata = { workspace = true }
flate2 = { workspace = true }
fs4 = { workspace = true }
jsonschema = { workspace = true }
keyring = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true }
object = { workspace = true, features = ["write_core", "read_core", "elf", "pe"] }
prost-reflect = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }

# The case host drives the supervised lifecycle from the harness. The
# harness binary itself depends only on the SDK, but the case-host
# protocol in `scenario::__harness` requires the scenario feature.
phoxal = { path = "..", version = "=0.0.0-dev.1", registry = "phoxal", default-features = false, features = ["scenario"] }

[lints]
workspace = true
