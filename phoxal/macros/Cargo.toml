[package]
name = "phoxal-macros"
version = "0.0.0-dev.1"
# The framework workspace root lives at `../..` from this crate, but cargo's
# default workspace walk-up passes through `phoxal/Cargo.toml` (the facade
# package) first and fails to parse it because the facade inherits from the
# workspace it sits inside. Pinning the parent workspace explicitly short-
# circuits that search.
workspace = "../.."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["phoxal"]
description = "Proc-macros for the Phoxal Runtime API and typed application definitions."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[package.metadata.phoxal]
kind = "proc-macro"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
serde_derive_internals = { workspace = true }
syn = { workspace = true }
heck = { workspace = true }

[dev-dependencies]
trybuild = { workspace = true }

[lints]
workspace = true
