syntax = "proto3";

package phoxal.simulation.v1;

message AcquireAuthorityRequest {
  string execution_id = 1;
  string model_identity = 2;
  uint64 quantum_ns = 3;
  repeated ProviderRequirement providers = 4;
  bytes session_id = 5;
  bytes correlation_id = 6;
  uint64 max_product_bytes = 7;
  uint64 max_cut_bytes = 8;
  uint64 receipt_byte_cap = 9;
}

message ProviderRequirement {
  string service_instance = 1;
  string port = 2;
  string payload_fqn = 3;
  // Numeric phoxal.session.v1.MethodShape value.
  int32 shape = 4;
  string input_fqn = 5;
  // Immutable source cadence in millionths of one hertz.
  uint64 rate_microhertz = 6;
}

message AcquireAuthorityResponse {
  bytes authority_grant = 1;
  string timeline_id = 2;
  uint64 boundary = 3;
  uint32 lease_ms = 4;
  bytes session_id = 5;
  string execution_id = 6;
  string model_identity = 7;
  uint64 quantum_ns = 8;
  bytes correlation_id = 9;
  uint64 max_product_bytes = 10;
  uint64 max_cut_bytes = 11;
  uint64 receipt_byte_cap = 12;
}

message TransitionKey {
  bytes session_id = 1;
  string execution_id = 2;
  string timeline_id = 3;
  bytes authority_grant = 4;
  uint64 boundary = 5;
  uint64 operation_sequence = 6;
}

enum ProductDisposition {
  PRODUCT_DISPOSITION_UNSPECIFIED = 0;
  PRODUCT_DISPOSITION_PRESENT = 1;
  PRODUCT_DISPOSITION_EMPTY = 2;
  PRODUCT_DISPOSITION_NOT_DUE = 3;
}

message ProductMembership {
  string producer = 1;
  string port = 2;
  bytes producer_incarnation = 3;
  uint64 sequence = 4;
  uint64 capture_boundary = 5;
  uint64 capture_time_ns = 6;
  ProductDisposition disposition = 7;
  uint64 item_count = 8;
  uint64 encoded_bytes = 9;
  bytes payload_digest = 10;
}

message Observation {
  ProductMembership membership = 1;
  bytes payload = 2;
}

message Actuation {
  ProductMembership membership = 1;
  bytes payload = 2;
  uint64 valid_until_ns = 3;
}

message ProductReceipt {
  ProductMembership membership = 1;
}

enum PhaseStatus {
  PHASE_STATUS_UNSPECIFIED = 0;
  PHASE_STATUS_INITIAL_ADMITTED = 1;
  PHASE_STATUS_PREPARED = 2;
  PHASE_STATUS_OBSERVATIONS_ADMITTED = 3;
  PHASE_STATUS_UNKNOWN = 4;
  PHASE_STATUS_STALE = 5;
  PHASE_STATUS_FAILED = 6;
}

message CutReceipt {
  TransitionKey transition_key = 1;
  bytes correlation_id = 2;
  bytes request_digest = 3;
  bytes membership_digest = 4;
  repeated ProductMembership products = 5;
  uint64 prepared_boundary = 6;
  uint64 admitted_observation_boundary = 7;
  PhaseStatus status = 8;
}

message AdmitInitialObservationsRequest {
  TransitionKey transition_key = 1;
  repeated Observation observations = 2;
  bytes membership_digest = 3;
  bytes correlation_id = 4;
}

message AdmitInitialObservationsResponse {
  CutReceipt receipt = 1;
}

message PrepareBoundaryRequest {
  TransitionKey transition_key = 1;
  bytes correlation_id = 2;
}

message PrepareBoundaryResponse {
  CutReceipt receipt = 1;
  repeated Actuation actuation = 2;
}

message AdmitObservationsRequest {
  TransitionKey transition_key = 1;
  repeated Observation observations = 2;
  bytes membership_digest = 3;
  bytes correlation_id = 4;
}

message AdmitObservationsResponse {
  CutReceipt receipt = 1;
}

message ResetRequest {
  bytes authority_grant = 1;
  string execution_id = 2;
  string timeline_id = 3;
  uint64 completed_boundary = 4;
  bytes session_id = 5;
  bytes correlation_id = 6;
}

message ResetResponse {
  string next_timeline_id = 1;
  uint64 boundary = 2;
  bytes session_id = 3;
  string execution_id = 4;
  bytes authority_grant = 5;
  bytes correlation_id = 6;
  string previous_timeline_id = 7;
  uint64 requested_boundary = 8;
}

message ReleaseAuthorityRequest {
  bytes authority_grant = 1;
  bytes session_id = 2;
  bytes correlation_id = 3;
}

message ReleaseAuthorityResponse {
  bytes session_id = 1;
  bytes authority_grant = 2;
  bytes correlation_id = 3;
  string execution_id = 4;
  string timeline_id = 5;
  uint64 completed_boundary = 6;
}

message ProgressRequest {
  bytes authority_grant = 1;
  bytes session_id = 2;
  bytes correlation_id = 3;
  TransitionKey transition_key = 4;
  PhaseStatus phase = 5;
}

message ProgressResponse {
  string execution_id = 1;
  string timeline_id = 2;
  uint64 completed_boundary = 3;
  bool failed = 4;
  optional string detail = 5;
  bytes session_id = 6;
  bytes authority_grant = 7;
  bytes correlation_id = 8;
  PhaseStatus phase_status = 9;
  uint64 prepared_boundary = 10;
  uint64 admitted_observation_boundary = 11;
  uint64 accepted_sequence_watermark = 12;
  bytes request_digest = 13;
  bytes membership_digest = 14;
}
