syntax = "proto3";

package phoxal.execution.v1;

message ContractRequirement {
  string protocol = 1;
  repeated string capabilities = 2;
}

// The supervisor selects one scheduling owner for the complete execution.
// Hardware runtimes retain their host-monotonic cadence; controlled runtimes
// wait for an explicit Invocation at each due boundary.
enum ExecutionMode {
  EXECUTION_MODE_UNSPECIFIED = 0;
  EXECUTION_MODE_HARDWARE = 1;
  EXECUTION_MODE_CONTROLLED = 2;
}

message AdmitExecutionRequest {
  string execution_id = 1;
  string timeline_id = 2;
  bytes artifact_digest = 3;
  repeated ContractRequirement required_contracts = 4;
  ExecutionMode mode = 5;
  uint64 quantum_ns = 6;
}

message AdmitExecutionResponse {
  bool admitted = 1;
  repeated string unsupported_contracts = 2;
  optional string detail = 3;
}

message Ready {
  string execution_id = 1;
  string timeline_id = 2;
  string runtime_instance = 3;
}

// Publish initialized State only after every controlled receiver is ready.
// This phase does not invoke Runtime::step or advance an invocation counter.
message InitializeStateRequest {
  string execution_id = 1;
  string timeline_id = 2;
}

message InitializeStateResponse {
  string execution_id = 1;
  string timeline_id = 2;
  string runtime_instance = 3;
  repeated ProductReceipt required_products = 4;
  repeated DeliveryReceipt required_deliveries = 5;
}

// Capture the accepted Read views before any runtime invokes this boundary.
message PinReadViewsRequest {
  string execution_id = 1;
  string timeline_id = 2;
  uint64 boundary = 3;
}

message PinReadViewsResponse {
  string execution_id = 1;
  string timeline_id = 2;
  uint64 boundary = 3;
  string runtime_instance = 4;
  bool admitted = 5;
  optional string detail = 6;
}

message Invocation {
  string execution_id = 1;
  string timeline_id = 2;
  string runtime_instance = 3;
  uint64 boundary = 4;
  uint64 logical_time_ns = 5;
}

message InvocationAccepted {
  string execution_id = 1;
  string timeline_id = 2;
  string runtime_instance = 3;
  uint64 boundary = 4;
  repeated ProductReceipt required_products = 5;
  repeated InputReceipt required_inputs = 6;
  repeated Actuation actuations = 7;
  // Exact graph records emitted by this accepted invocation.  ProductReceipt
  // remains the compact per-port summary used by the supervisor; these
  // records let it wait for every receiver admission without guessing item
  // identity from an aggregate count.
  repeated DeliveryReceipt required_deliveries = 8;
}

message ProductReceipt {
  string port = 1;
  uint64 sequence = 2;
  uint32 items = 3;
  uint64 bytes = 4;
}

message InputReceipt {
  // Consumer field and producer port are distinct graph identities.
  string input = 6;
  string source = 1;
  string port = 2;
  uint64 sequence = 3;
  uint32 items = 4;
  uint64 bytes = 5;
}

message Actuation {
  string port = 1;
  bytes payload = 2;
  uint64 valid_until_ns = 3;
}

// One output record that must be admitted by a graph receiver.  The target is
// optional for ordinary publications: the supervisor expands that record over
// the immutable graph fan-out.  Requests carry their exact target because the
// generated activation already resolved it before publication. Reply targets
// name the exact caller instance and input field; request targets name the
// server instance, whose public port resolves to one admitted handler field.
message DeliveryReceipt {
  string port = 1;
  string direction = 2;
  string target = 3;
  uint64 sequence = 4;
  uint32 item = 5;
  uint64 bytes = 6;
}

// Receiver-owned acknowledgement for one exact graph record.  This message
// is carried on a private execution leg and is never part of a public port
// or session contract.
message DeliveryAck {
  string execution_id = 1;
  string timeline_id = 2;
  uint64 boundary = 3;
  string source = 4;
  // Exact receiving instance and private field, separated by a dot.
  string target = 5;
  string port = 6;
  string direction = 7;
  uint64 sequence = 8;
  uint32 item = 9;
  uint64 bytes = 10;
  bool admitted = 11;
  optional string detail = 12;
}

message ResetExecutionRequest {
  string execution_id = 1;
  string retired_timeline_id = 2;
  string next_timeline_id = 3;
  uint64 completed_boundary = 4;
}

message ResetExecutionResponse {
  bool accepted = 1;
  optional string detail = 2;
}

message RuntimeFailure {
  string execution_id = 1;
  string timeline_id = 2;
  string runtime_instance = 3;
  uint64 boundary = 4;
  string reason = 5;
}
