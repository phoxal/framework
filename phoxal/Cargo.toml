[package]
name = "phoxal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
description = "Phoxal - production-oriented autonomous robot framework: the runtime engine and model (the api contract tree lives in phoxal-protocol, the typed bus in phoxal-bus)."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["robotics", "robot", "autonomy", "zenoh", "simulation"]
categories = ["science::robotics", "simulation"]

[lib]
name = "phoxal"
path = "src/lib.rs"

[features]
# Off in every shipped participant binary. It exposes the explicit in-process
# harness, deterministic `TestClock`, and clock-injection seam, which exist only
# so tests can drive a participant on a caller-owned bus. A downstream crate
# enables it as a **dev**-dependency feature, because a participant crate's
# tests are a separate compilation unit that cannot enable this crate's
# `cfg(test)`.
test-harness = ["phoxal-bus/test-harness"]

[dependencies]
phoxal-protocol = { workspace = true }
phoxal-bus = { workspace = true }
phoxal-bundle = { workspace = true }
phoxal-macros = { workspace = true }
phoxal-model = { workspace = true }
phoxal-runtime-contract = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
const_format = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "signal", "sync", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# The tests load the workspace fixture robot as a finalized bundle. Staging it
# is a crate rather than a test helper because both a unit test in `src/` and
# an integration test in `tests/` need it, and a dev-dependency is the only
# thing both can reach; a versionless one is stripped on publish.
phoxal-fixture = { workspace = true }
phoxal-bundle = { workspace = true }
# Enables only the bus's hidden worker-failure injection while this crate's
# unit tests prove Ready revocation and teardown. Production dependencies keep
# the feature off.
phoxal-bus = { workspace = true, features = ["test-harness"] }
jsonschema = { workspace = true }
# Test-only: raising SIGINT/SIGTERM at the test process is the only honest way to
# prove the runner's shutdown trigger covers the signal a supervisor stops with.
libc = { workspace = true }
schemars = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
trybuild = { workspace = true }
# `test-util` (paused/mocked virtual time) is additive to the `[dependencies]`
# `tokio` features above and only applies to test/bench/example builds, never
# the published lib artifact - the step-scheduler tests use it to prove
# deterministic tick order/collapse without any real sleeping.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[[test]]
name = "runtime_serialized_smoke"
path = "tests/runtime_serialized_smoke.rs"
required-features = ["test-harness"]

[[example]]
name = "runtime_control_loop"
path = "examples/runtime_control_loop.rs"

[[example]]
name = "runtime_query_server"
path = "examples/runtime_query_server.rs"

[[example]]
name = "runtime_serialized_queries"
path = "examples/runtime_serialized_queries.rs"

[[example]]
name = "runtime_async_entrypoint"
path = "examples/runtime_async_entrypoint.rs"
