[package]
name = "phoxal"
version = "0.0.0-dev.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false
publish = ["phoxal"]
description = "Phoxal - the framework runtime, protocol contracts, typed ports, and public sessions."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["robotics", "robot", "autonomy", "zenoh", "simulation"]
categories = ["science::robotics", "simulation"]
exclude = ["cargo"]

[lib]
name = "phoxal"
path = "src/lib.rs"

# The consumer profiles. A profile is one supported consumer role: it decides
# which modules `src/lib.rs` declares as `pub`, and - for the two host roles
# that need crates a robot binary has no business linking - which optional
# dependencies compile. It is never an authority boundary: Cargo unifies
# features, and who may do what at runtime remains process ownership and the
# constructible API.
#
# Every profile compiles the same source; features select optional dependencies
# and `pub` declarations, not parallel code paths. The one place a feature may
# be named in this crate's source is `src/lib.rs`, and `cargo xtask policy`
# rejects it anywhere else.
[features]
default = ["runtime"]

# The contract descriptor family is deliberately available without selecting a
# runner, transport, or host profile.
port = []

# Framework-owned shared robotics vocabulary: generated Protobuf messages and
# their domain validation. Independent of `protocol` so consumers that need
# only the inert port surface do not pay for the robotics codegen.
robotics = [
    "dep:prost",
    "dep:thiserror",
]

# Authoring helper for Protobuf build scripts. The `phoxal::build` module
# re-exports `compile_protos` and `compile_protos_with_dependencies` over the
# internal `phoxal-build` implementation helper. Pulls in no
# runtime/transport/session/supervisor/native simulation dependencies; this
# feature exists so service contract owners can declare `phoxal` as their
# `build-dependencies` entry instead of naming `phoxal-build` directly.
# Phoxal's own `build.rs` keeps a direct `phoxal-build` dependency identified
# by reason because it cannot depend on its own not-yet-built library to
# generate its own protocols.
build = ["dep:phoxal-build"]

# Framework-owned public protocol messages and pure admission state.
# This layer has no scheduler, transport, simulator, or project dependency.
protocol = [
    "port",
    "dep:getrandom",
    "dep:prost",
    "dep:serde",
    "dep:serde_bytes",
    "dep:thiserror",
]

# Synchronous Runtime definitions, typed input/output forms, and bounded managed
# operations.
runtime = [
    "artifact",
    "protocol",
    "dep:clap",
    "dep:phoxal-macros",
    "dep:getrandom",
    "dep:serde_json",
    "dep:sha2",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tracing",
    "dep:zenoh",
]

# Scenario authoring surface: trait, descriptors, inventory registration,
# case-host protocol skeleton. Independent of `runtime` so consumer crates
# that only want to define scenarios do not pull Zenoh, Tokio, or Clap.
scenario = [
    "artifact",
    "protocol",
    "port",
    "dep:phoxal-macros",
    "dep:base64",
    "dep:inventory",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:tempfile",
    "dep:thiserror",
]

# Serialized project, bundle, and simulation contracts shared with framework
# tools and independent applications. This surface is inert: it owns records,
# schema identities, validation, and deterministic digests, but no authored
# file parsing, filesystem discovery, process control, or transport.
artifact = [
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:thiserror",
]

# The CLI, Operator, and any other application attaching to a running
# execution. The public session owns its Protobuf-over-Zenoh transport and typed
# client only; it does not pull in the participant runner or its internal bus.
session = [
    "port",
    "protocol",
    "dep:serde_json",
    "dep:sha2",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tracing",
    "dep:zenoh",
]

[dependencies]
phoxal-macros = { workspace = true, optional = true }
anyhow = { workspace = true }
base64 = { workspace = true, optional = true }
clap = { workspace = true, features = ["derive"], optional = true }
# `termination`: SIGTERM and SIGHUP alongside SIGINT, so every "stop" signal
# reaches the supervisor's one orderly shutdown path.
getrandom = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_bytes = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
# The supervisor asks its own host to reboot or power off.
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "signal", "sync", "fs", "io-util", "net"], optional = true }
# `rt`: the supervisor's one shutdown token, cancelled from the signal handler
# and awaited by everything it owns.
tokio-util = { workspace = true, features = ["rt"], optional = true }
tempfile = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
zenoh = { workspace = true, optional = true }

phoxal-build = { workspace = true, optional = true }
prost = { workspace = true, optional = true }

# Scenario surface deps. `inventory` is the link-time registration mechanism
# for the #[phoxal::scenario] attribute; `anyhow`/`serde`/`serde_json`/`thiserror`
# back the trait and result types.
inventory = { workspace = true, optional = true }

[build-dependencies]
phoxal-build.workspace = true

# `serde_bytes` is referenced by `#[serde(with = "serde_bytes")]`; cargo-machete
# cannot see dependencies named only inside attributes.
[package.metadata.cargo-machete]
ignored = ["serde_bytes"]

# docs.rs builds every profile, so every host item carries an "available on
# crate feature …" badge.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
tempfile.workspace = true

# The Config derive test compares the emitted schema with the independent
# schemars oracle without making schemars a runtime dependency.
schemars = { workspace = true }
jsonschema = { workspace = true }
serial_test = { workspace = true }
serde_yaml.workspace = true
sha2 = { workspace = true }
trybuild = { workspace = true }
# `test-util` (paused/mocked virtual time) is additive to the `[dependencies]`
# `tokio` features above and only applies to test/bench/example builds, never
# the published lib artifact - the step-scheduler tests use it to prove
# deterministic tick order/collapse without any real sleeping.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

# An integration test is an external crate, so it sees exactly one profile's
# public surface. The ones below name a host family or the explicit harness and
# therefore declare the profile that publishes it; `cargo test -p phoxal
# --all-features` is what runs the whole set.
[[test]]
name = "feature_codegen"
path = "tests/feature_codegen.rs"

[[test]]
name = "consumer_policy"
path = "tests/consumer_policy.rs"
required-features = ["port"]

[[test]]
name = "config_derive"
path = "tests/config_derive.rs"
required-features = ["runtime"]

[[test]]
name = "runtime_authoring"
path = "tests/runtime_authoring.rs"
required-features = ["runtime"]

[[test]]
name = "runtime_forms"
path = "tests/runtime_forms.rs"
required-features = ["runtime"]

[[test]]
name = "runtime_reference_examples"
path = "tests/runtime_reference_examples.rs"
required-features = ["runtime"]

[[test]]
name = "trybuild"
path = "tests/trybuild.rs"
required-features = ["runtime"]
