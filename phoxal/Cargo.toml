[package]
name = "phoxal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
description = "Phoxal - production-oriented autonomous robot framework: the one framework library, holding the runtime engine, the api contract tree, the typed bus, the canonical model, and the bundle."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["robotics", "robot", "autonomy", "zenoh", "simulation"]
categories = ["science::robotics", "simulation"]

[lib]
name = "phoxal"
path = "src/lib.rs"

# The consumer profiles. A profile is one supported consumer role: it decides
# which modules `src/lib.rs` declares as `pub`, and - for the two host roles
# that need crates a robot binary has no business linking - which optional
# dependencies compile. It is never an authority boundary: Cargo unifies
# features, and who may do what at runtime remains process ownership and the
# constructible API.
#
# Every profile compiles the same code. The one place a feature may be named in
# this crate's source is `src/lib.rs`, and `cargo xtask policy` rejects it
# anywhere else.
[features]
default = ["participant"]

# The contract descriptor family is deliberately available without selecting a
# runner, transport, host, or authoring profile.
port = ["dep:phoxal-port"]

# Framework-owned public protocol messages and pure admission state.
# This layer has no scheduler, transport, simulator, or project dependency.
protocol = ["port", "dep:prost", "dep:thiserror"]

# The pre-rewrite implementation remains one coherent private compilation
# boundary while the new contract surface is introduced. Every existing
# profile enables it, so this feature only changes dependency isolation for
# `port`-only consumers and does not change legacy profile behavior.
legacy-runtime = [
    "port",
    "dep:phoxal-macros",
    "dep:clap",
    "dep:const_format",
    "dep:ctrlc",
    "dep:getrandom",
    "dep:libc",
    "dep:rmp-serde",
    "dep:schemars",
    "dep:serde",
    "dep:serde_bytes",
    "dep:serde_json",
    "dep:sha2",
    "dep:serde_yaml",
    "dep:system_shutdown",
    "dep:thiserror",
    "dep:tempfile",
    "dep:tokio",
    "dep:tokio-util",
    "dep:toml",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:urdf-rs",
    "dep:zenoh",
]

# Ordinary robot services, drivers, and the root brain: the robot `api`, the
# role attributes, the runner, the prelude, and the typed handles they build.
participant = ["legacy-runtime"]

# The CLI, Operator, and any other application attaching to a running
# execution: `phoxal::session`, the runtime and supervisor contract families,
# the participant launch encoder, and the embedded participant metadata reader.
# Visibility only - a session build compiles nothing a participant build lacks.
session = ["legacy-runtime", "protocol"]

# Webots, Isaac Sim, or another external world adapter: `phoxal::simulator`,
# the runtime contract family, the bundle reader, and `model::simulation`.
# Visibility only, for the same reason as `session`.
simulator = ["legacy-runtime", "protocol"]

# The exact-train `phoxal-supervisor` executable, and nothing else: it compiles
# `phoxal::supervisor::host`, the whole supervisor implementation, plus the
# embedded Zenoh router the graph meets on.
#
# `zenoh/unstable` is the router's: `link_events_listener()` observes links
# coming and going and has no stable equivalent. Pulling it in *here* rather
# than on the workspace dependency keeps that surface out of every participant
# build. `libc` is deliberately absent from this list - `bus::time` and
# `supervisor::rendezvous` need it in every profile, so it is a plain
# dependency rather than one this profile turns on.
supervisor = ["legacy-runtime", "protocol", "zenoh/unstable"]

# The authored-source layer: `robot.yaml`, `component.yaml`, `simulation.yaml`,
# URDF, their JSON Schemas, and the project compiler. Off by default: a launched
# participant reads the compiled `manifest.json` and never an authored document,
# so its readers - and the YAML/TOML/URDF parsers under them - have no place in
# a robot binary.
authoring = ["legacy-runtime"]

# Explicit participant test support: the in-process harness, the deterministic
# `TestClock`, and the clock-injection seam, which exist only so tests can drive
# a participant on a caller-owned bus. Off in every shipped participant binary.
# A downstream crate enables it as a **dev**-dependency feature, because a
# participant crate's tests are a separate compilation unit that cannot enable
# this crate's `cfg(test)`.
test-harness = ["participant"]

[dependencies]
phoxal-macros = { workspace = true, optional = true }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"], optional = true }
const_format = { workspace = true, optional = true }
# `termination`: SIGTERM and SIGHUP alongside SIGINT, so every "stop" signal
# reaches the supervisor's one orderly shutdown path.
ctrlc = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
rmp-serde = { workspace = true, optional = true }
# Not optional, and not a `cfg_attr` gate inside the model: a feature that
# changes what a canonical type derives is a second shape of the same type, and
# the authored-source layer points editor schemas at the one canonical
# definition. The weight is a derive, and the alternative is `cfg(feature = …)`
# inside a domain module.
schemars = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_bytes = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }
# The supervisor asks its own host to reboot or power off.
system_shutdown = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "signal", "sync", "fs", "io-util", "net"], optional = true }
# `rt`: the supervisor's one shutdown token, cancelled from the signal handler
# and awaited by everything it owns.
tokio-util = { workspace = true, features = ["rt"], optional = true }
toml = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
urdf-rs = { workspace = true, optional = true }
zenoh = { workspace = true, optional = true }

phoxal-port = { workspace = true, optional = true }
prost = { workspace = true, optional = true }

[build-dependencies]
phoxal-build.workspace = true

# `serde_bytes` is referenced by `#[serde(with = "serde_bytes")]`; cargo-machete
# cannot see dependencies named only inside attributes.
[package.metadata.cargo-machete]
ignored = ["serde_bytes"]

# docs.rs builds every profile, so `phoxal::session`, `phoxal::simulator` and
# `phoxal::authoring` have published documentation and every host item carries
# an "available on crate feature …" badge. The crate root still reads
# participant-first: ordering, not omission, is what makes the default consumer
# the first one a reader meets.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
# The tests load the workspace fixture robot as a finalized bundle. Staging it
# is a crate rather than a test helper because both a unit test in `src/` and
# an integration test in `tests/` need it, and a dev-dependency is the only
# thing both can reach; a versionless one is stripped on publish. It depends on
# this crate in turn, which is a dev-dependency cycle Cargo permits.
phoxal-fixture = { workspace = true }
# `tests/bus_frozen_wire_protocol.rs` reads the resolved `zenoh-protocol` out of
# the graph Cargo actually compiles, and
# `tests/authoring_workspace_build_requirements.rs` reads every workspace
# manifest through this crate's own build-requirement reader.
cargo_metadata = { workspace = true }
jsonschema = { workspace = true }
# Reads the built-artifact linker section back out in
# `tests/participant_metadata.rs` - the one honest way to prove the ELF
# `--gc-sections` defeat (`phoxal-macros`' `link_section_attrs`/
# `Participant::__retain_embedded_metadata`) actually holds through a real link,
# not just at the source level. Version pinned to match `phoxal-cli`'s own
# object-file reader (`crates/core/src/check/participant_metadata.rs`), the only
# other place in either repository that parses this section.
object = "0.36"
serial_test = { workspace = true }
trybuild = { workspace = true }
# `test-util` (paused/mocked virtual time) is additive to the `[dependencies]`
# `tokio` features above and only applies to test/bench/example builds, never
# the published lib artifact - the step-scheduler tests use it to prove
# deterministic tick order/collapse without any real sleeping.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

# An integration test is an external crate, so it sees exactly one profile's
# public surface. The ones below name a host family or the explicit harness and
# therefore declare the profile that publishes it; `cargo test -p phoxal
# --all-features` is what runs the whole set.
[[test]]
name = "runtime_serialized_smoke"
path = "tests/runtime_serialized_smoke.rs"
required-features = ["test-harness", "session"]

[[test]]
name = "api"
path = "tests/api.rs"
required-features = ["session"]

[[test]]
name = "bus_bindings"
path = "tests/bus_bindings.rs"
required-features = ["session"]

[[test]]
name = "wire_key_composition"
path = "tests/wire_key_composition.rs"
required-features = ["test-harness", "session"]

# The one test that runs two host profiles against each other: the supervisor
# implementation and the attachment SDK, over a real execution.
[[test]]
name = "session_attaches_to_the_supervisor"
path = "tests/session_attaches_to_the_supervisor.rs"
required-features = ["session", "supervisor", "authoring"]

[[test]]
name = "authoring_compile"
path = "tests/authoring_compile.rs"
required-features = ["authoring"]

[[test]]
name = "authoring_schema"
path = "tests/authoring_schema.rs"
required-features = ["authoring"]

[[test]]
name = "authoring_source_boundary"
path = "tests/authoring_source_boundary.rs"
required-features = ["authoring"]

[[test]]
name = "authoring_workspace_build_requirements"
path = "tests/authoring_workspace_build_requirements.rs"
required-features = ["authoring"]

[[example]]
name = "runtime_control_loop"
path = "examples/runtime_control_loop.rs"
required-features = ["participant"]

[[example]]
name = "runtime_query_server"
path = "examples/runtime_query_server.rs"
required-features = ["participant"]

[[example]]
name = "runtime_serialized_queries"
path = "examples/runtime_serialized_queries.rs"
required-features = ["participant"]

[[example]]
name = "runtime_async_entrypoint"
path = "examples/runtime_async_entrypoint.rs"
required-features = ["participant"]
