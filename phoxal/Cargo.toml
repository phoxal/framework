[package]
name = "phoxal"
version = "0.0.0-dev.8"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false
publish = ["phoxal"]
description = "Phoxal - the framework runtime, protocol contracts, typed ports, and public sessions."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["robot", "autonomy", "zenoh", "simulation"]
categories = ["science::robotics", "simulation"]
exclude = ["cargo"]

[lib]
name = "phoxal"
path = "src/lib.rs"

# The base SDK contains inert contracts, schemas, and protocol/artifact records.
# Features add executable roles, never alternate contract definitions.
[features]
default = ["runtime"]

# Synchronous participant authoring and its runner/transport.
runtime = [
    "dep:anyhow", "dep:clap", "dep:prost-reflect", "dep:serde_yaml",
    "dep:tokio", "dep:tokio-util", "dep:tracing", "dep:zenoh",
]

# Scenario authoring without the participant runner or transport.
scenario = ["dep:anyhow", "dep:base64", "dep:tempfile"]

# Applications attaching to an execution through the public session protocol.
session = ["dep:tokio", "dep:tokio-util", "dep:tracing", "dep:zenoh"]

# Local prepared-product generation, selected only in build-dependencies.
build = ["dep:phoxal-build"]

[dependencies]
phoxal-macros = { workspace = true }
anyhow = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
clap = { workspace = true, features = ["derive"], optional = true }
getrandom = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true, optional = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "signal", "sync", "fs", "io-util", "net"], optional = true }
# `rt`: the supervisor's one shutdown token, cancelled from the signal handler
# and awaited by everything it owns.
tokio-util = { workspace = true, features = ["rt"], optional = true }
tempfile = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
zenoh = { workspace = true, optional = true }

phoxal-build = { workspace = true, optional = true }
prost = { workspace = true }
prost-reflect = { workspace = true, optional = true }
prost-types = { workspace = true }

[build-dependencies]
phoxal-build.workspace = true

# `serde_bytes` is referenced by `#[serde(with = "serde_bytes")]`; cargo-machete
# cannot see dependencies named only inside attributes.
[package.metadata.cargo-machete]
ignored = ["serde_bytes"]

# docs.rs builds every profile, so every host item carries an "available on
# crate feature …" badge.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
tempfile.workspace = true
# The accepted-behavior diary test captures the real `phoxal::boundary`
# trace output through a scoped subscriber.
tracing-subscriber = { workspace = true }
# Descriptor construction for receiver-side projection unit tests.
prost-types = { workspace = true }

# The Config derive test compares the emitted schema with the independent
# schemars oracle without making schemars a runtime dependency.
schemars = { workspace = true }
jsonschema = { workspace = true }
serial_test = { workspace = true }
serde_yaml.workspace = true
sha2 = { workspace = true }
trybuild = { workspace = true }
# `test-util` (paused/mocked virtual time) is additive to the `[dependencies]`
# `tokio` features above and only applies to test/bench/example builds, never
# the published lib artifact - the step-scheduler tests use it to prove
# deterministic tick order/collapse without any real sleeping.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

# An integration test is an external crate, so it sees exactly one profile's
# public surface. The ones below name a host family or the explicit harness and
# therefore declare the profile that publishes it; `cargo test -p phoxal
# --all-features` is what runs the whole set.

# Deterministic public-API tests, one executable with modules inside.
[[test]]
name = "unit"
path = "tests/unit/main.rs"
required-features = ["runtime"]

# Delivery-observing diagnostics tests live in their own process: ordinary
# `tracing` emission consults a process-wide call-site interest cache, so
# subscriber delivery assertions are only deterministic without unrelated
# parallel tests in the same process.
[[test]]
name = "runtime_behavior_observers"
path = "tests/runtime_behavior_observers.rs"
required-features = ["runtime"]

# Compiler contracts: macro compile-fail cases and the consumer feature
# profiles' compilation checks.
[[test]]
name = "compile"
path = "tests/compile/main.rs"
required-features = ["runtime"]
