[package]
name = "phoxal-bus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
description = "Phoxal bus ABI floor: the Zenoh-native contract bus client and the API-version / contract-body primitive traits."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
name = "phoxal_bus"
path = "src/lib.rs"

[dependencies]
libc = { workspace = true }
phoxal-runtime-contract = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
tracing = { workspace = true }
zenoh = { workspace = true }

[features]
# The supervisor's embedded Zenoh router (organization#978). Off by default so
# participants - which reach this crate through the `phoxal` facade - never see
# a router in their API surface; only `phoxal-cli`'s supervisor enables it.
router = []

[dev-dependencies]
serial_test = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
