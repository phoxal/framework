[package]
name = "phoxal-tool-router"
version = "0.1.12"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Phoxal official tool: router - site-local Zenoh router artifact."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "phoxal-tool-router"
path = "src/main.rs"

[dependencies]
phoxal = { workspace = true, features = ["preview-v2"] }
phoxal-api = { workspace = true, features = ["preview-v2"] }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# This private alias keeps unstable link introspection on the reviewed Zenoh
# minor line without narrowing the published crates' stable requirement.
zenoh-router = { workspace = true }

[lints]
workspace = true
