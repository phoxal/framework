license.workspace = true
publish = false
description = "Phoxal official tool: bus - per-robot bus observation artifact."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "phoxal-tool-bus"
path = "src/main.rs"

[dependencies]
phoxal = { workspace = true, features = ["preview-v2"] }
phoxal-api = { workspace = true, features = ["preview-v2"] }
