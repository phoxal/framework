# release-plz owns only the four crates.io library crates. Official artifact
# crates set `publish = false` in their Cargo.toml, so release-plz drops them
# before applying this configuration: there is no `git_only` artifact package
# list and no artifact packaging/version analysis in the release-plz job.
#
# Artifact versions and tags are owned by xtask instead. The release-PR job runs
# `cargo xtask release bump --changed`, which compares each artifact's own crate
# directory with its `{package}-v{version}` tag. The release job runs `release
# cut` to create missing current-version tags and hand its JSON output to
# `release plan`.
[workspace]
release_always = true
dependencies_update = false
git_tag_name = "{{ package }}-v{{ version }}"
pr_name = "chore(release): release"
semver_check = false
# no version_group (it reintroduces a shared version axis)

# Libraries are crates.io-only. crates.io and `.cargo_vcs_info.json` are their
# version/frozen-version baseline; no library git tag or GitHub release.

[[package]]
name = "phoxal"
git_tag_enable = false
git_release_enable = false

[[package]]
name = "phoxal-api"
git_tag_enable = false
git_release_enable = false

[[package]]
name = "phoxal-bus"
git_tag_enable = false
git_release_enable = false

[[package]]
name = "phoxal-macros"
git_tag_enable = false
git_release_enable = false
