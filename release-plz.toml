# Per-artifact release configuration (plan #01-B).
#
# Each crate carries its own version (plan #01-A); release-plz cuts one release
# PR that bumps only the crates whose commits changed, then on merge releases
# each bumped crate independently:
#   - the 4 library crates (phoxal, phoxal-api, phoxal-bus, phoxal-macros)
#     publish to crates.io (default behaviour, so they need no [[package]] block);
#   - the 18 runtime crates are publish = false (deployables, not libraries), so
#     release-plz would skip them entirely without an explicit entry. Each gets a
#     git_only release: a per-package git tag + GitHub release, no crates.io push.
#     The release-plz.yml `parse-runtimes` job reads the released runtime tags and
#     drives the GHCR image matrix off them.
[workspace]
release_always = false          # release ONLY for commits from a release-plz PR (not every main push)
dependencies_update = false
git_tag_name = "{{ package }}-v{{ version }}"
git_release_name = "{{ package }} v{{ version }}"
pr_name = "chore(release): release"
# no version_group (it reintroduces a shared version axis)

# The 18 official runtime crates. They are publish = false, so they release via
# a git tag + GitHub release only (git_only); crates.io is never touched for them.
[[package]]
name = "phoxal-runtime-asset"
release = true
git_only = true
publish = false

[[package]]
name = "phoxal-runtime-battery"
release = true
