# Release-plz prepares independent package versions and a reviewable release
# pull request.
#
# Publication is intentionally disabled here. The `phoxal` registry is a
# static sparse registry with an admission review path, not a Cargo upload
# endpoint that release-plz can publish to. The owner workflow packages and
# verifies the exact changed archives, while registry admission remains a
# separate reviewed publication step.
[workspace]
# Only packages whose own commits require a release are included. A service
# change therefore does not create unrelated SDK, tool, or simulator releases.
release_always = false
dependencies_update = false
# Changelogs are repository-generated release output. Release-plz still
# updates package versions and prepares its PR, but this workspace does not
# ask it to edit CHANGELOG.md files as part of that operation.
changelog_update = false
# No release-plz Cargo publication exists for the alternate registry. Keep
# package processing enabled so release-plz still plans independent versions.
publish = false
git_tag_enable = false
git_release_enable = false
semver_check = true
pr_name = "chore(release): update package versions"
