# release-plz owns the one inherited workspace train version.
#
# Two publication channels share that version:
#   * the library crates go to crates.io, published by release-plz itself;
#   * every executable package goes to the static `phoxal` registry, published
#     by the release workflow with `cargo package` + `margo add`.
#
# Both are listed here. Executables are listed **so their changes cut trains**:
# a package release-plz cannot see cannot bump the version, so a commit touching
# only `simulators/webots-controller` would otherwise produce no release PR at
# all.
[workspace]
release_always = true
dependencies_update = false
pr_name = "chore(release): release v{{ version }}"

# cargo-semver-checks compares each library against its own published version
# and, when it finds a break, forces the release PR to a breaking bump whatever
# the commit types said - so a Rust API break can no longer be released as a
# patch because nobody wrote `!`. It is the Rust-API half of the promise; the
# wire half is `cargo xtask compatibility check-release`.
#
# No per-package override is needed: release-plz only runs the check on packages
# that contain a library, and every executable published to the `phoxal`
# registry is bin-only, so all 17 are skipped on their own.
semver_check = true

# --- crates.io libraries ----------------------------------------------------
#
# crates.io and `.cargo_vcs_info.json` are their version/current-contract
# baseline. `phoxal` owns the single `v<train>` git tag: this is a virtual
# workspace, so there is no root package to inherit it, and the tag is the only
# marker of what a train contained now that there is no GitHub release.

[[package]]
name = "phoxal"
version_group = "framework-train"
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = false

[[package]]
name = "phoxal-protocol"
version_group = "framework-train"
git_tag_enable = false
git_release_enable = false

[[package]]
name = "phoxal-bus"
version_group = "framework-train"
git_tag_enable = false
git_release_enable = false

[[package]]
name = "phoxal-macros"
version_group = "framework-train"
git_tag_enable = false
git_release_enable = false

[[package]]
name = "phoxal-model"
version_group = "framework-train"
git_tag_enable = false
git_release_enable = false

[[package]]
name = "phoxal-manifest"
version_group = "framework-train"
git_tag_enable = false
git_release_enable = false

[[package]]
name = "phoxal-bundle"
version_group = "framework-train"
git_tag_enable = false
git_release_enable = false

[[package]]
name = "phoxal-runtime-contract"
version_group = "framework-train"
git_tag_enable = false
git_release_enable = false

# --- executables, published to the `phoxal` registry ------------------------
#
# `publish = false` here suppresses only release-plz's `cargo publish` step; the
# package still participates in change detection, version bumping, and the
# version group. Do NOT use `release = false` - that drops the package from
# processing entirely and silently restores the "executable changes cut no
# train" defect.
#
# `changelog_update = false` because the train's library-side changelog already
# records what shipped; 26 per-package changelogs would be noise.
#
# Cargo-side `publish = ["phoxal"]` in each manifest is the second, independent
# guard: an ordinary `cargo publish` cannot reach crates.io by accident.

[[package]]
name = "phoxal-component-bno085"
version_group = "framework-train"
publish = false
changelog_update = false
git_tag_enable = false
git_release_enable = false

[[package]]
name = "phoxal-component-ddsm115"
version_group = "framework-train"
publish = false
changelog_update = false
