# release-plz changes the one inherited workspace train version and publishes
# the four crates.io libraries. Official artifact crates are publish=false and
# are staged together in the matching GitHub train release by xtask.
[workspace]
release_always = true
dependencies_update = false
pr_name = "chore(release): release"
semver_check = false
# One train version is inherited by every workspace member. release-plz changes
# the root version once and rewrites exact internal dependency pins together.

# Libraries are crates.io-only. crates.io and `.cargo_vcs_info.json` are their
# version/current-contract baseline; no library git tag or GitHub release.

[[package]]
name = "phoxal"
version_group = "framework-train"
git_tag_enable = false
git_release_enable = false

[[package]]
name = "phoxal-api"
version_group = "framework-train"
git_tag_enable = false
git_release_enable = false

[[package]]
name = "phoxal-bus"
version_group = "framework-train"
git_tag_enable = false
git_release_enable = false

[[package]]
name = "phoxal-macros"
version_group = "framework-train"
git_tag_enable = false
git_release_enable = false
