# Per-artifact release configuration (plan #01).
#
# release-plz publishes the LIBRARY crates only. Each carries its own version
# (plan #01-A); release-plz cuts one release PR that bumps only the crates whose
# commits changed, then on merge publishes each bumped crate independently:
#   - the 4 library crates (phoxal, phoxal-api, phoxal-bus, phoxal-macros) publish
#     to crates.io (default behaviour, so they need no [[package]] block);
#   - the 18 service crates are publish = false; release-plz skips publish = false
#     crates by default, so they are intentionally left out of release scope.
#     (Service distribution is being reworked; it is not a crate release.)
[workspace]
release_always = false          # release ONLY for commits from a release-plz PR (not every main push)
dependencies_update = false
git_tag_name = "{{ package }}-v{{ version }}"
git_release_name = "{{ package }} v{{ version }}"
pr_name = "chore(release): release"
# no version_group (it reintroduces a shared version axis)
