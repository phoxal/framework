# Library release configuration (plan #01, revised).
#
# release-plz owns per-package versions, changelogs, tags, and GitHub releases
# for the 4 library crates only (phoxal, phoxal-api, phoxal-bus, phoxal-macros),
# which inherit the workspace defaults below and publish to crates.io.
#
# Official artifact crates (services/drivers/tools/simulator) are NOT release-plz
# packages: their Cargo.toml sets `publish = false` (enforced by
# `validate_artifact_publish` in xtask/src/workspace.rs), and release-plz drops
# cargo-unpublishable packages before its own config ever applies - so they never
# reach release-plz's update engine, cheaply and for free. Artifact tags, draft
# GitHub releases, and version bumps are owned by xtask instead: see
# `cargo xtask release cut` and `cargo xtask release bump --changed`.
[workspace]
release_always = true
dependencies_update = false
git_tag_name = "{{ package }}-v{{ version }}"
git_release_name = "{{ package }} v{{ version }}"
pr_name = "chore(release): release"
semver_check = true              # cargo-semver-checks decides breaking bump severity
# no version_group (it reintroduces a shared version axis)
