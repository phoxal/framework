# Per-artifact release configuration (plan #01).
#
# release-plz owns per-package versions, changelogs, tags, and GitHub releases:
#   - the 4 library crates (phoxal, phoxal-api, phoxal-bus, phoxal-macros) inherit
#     the workspace defaults and publish to crates.io;
#   - official artifact crates are generated [[package]] entries below with
#     release = true + git_only = true, so they are versioned and tagged without
#     crates.io publication.
[workspace]
release_always = true           # reconcile tags-vs-versions on every main push: git_only artifact
                                # versions only move via merged PRs, so this is idempotent and
                                # self-heals pending (bumped-but-untagged) releases - the
                                # release-PR-merge-only mode stranded exactly that state once
dependencies_update = false
git_tag_name = "{{ package }}-v{{ version }}"
git_release_name = "{{ package }} v{{ version }}"
pr_name = "chore(release): release"
semver_check = true             # library crates: cargo-semver-checks decides breaking bump severity
# no version_group (it reintroduces a shared version axis)

# @generated begin phoxal artifact release-plz packages
