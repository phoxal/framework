schema: phoxal/service/v0

inputs:
  encoders:
    type: phoxal.robotics.v1.EncoderSample
    delivery: queue
    required: true
    max_items: 32
    max_bytes: 262144

outputs:
  joints:
    type: phoxal.kinematics.v1.JointState
    delivery: queue
    max_items: 32
    max_bytes: 16384
  odometry:
    type: phoxal.kinematics.v1.OdometryState
    delivery: latest
    projection: state
    bootstrap: true
    on_change: true
    max_bytes: 512
  frames:
    type: phoxal.kinematics.v1.FrameTree
    delivery: latest
    projection: state
    bootstrap: true
    on_change: true
    max_bytes: 4096
  status:
    type: phoxal.kinematics.v1.KinematicsStatus
    delivery: latest
    projection: state
    bootstrap: true
    on_change: true
    max_bytes: 512

operations:
  lookup_frame:
    contract: phoxal.kinematics.v1.LookupFrame
    request: phoxal.kinematics.v1.LookupFrameRequest
    response: phoxal.kinematics.v1.LookupFrameResponse
    max_items: 32
    max_bytes: 16384
