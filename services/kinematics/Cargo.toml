[package]
name = "phoxal-service-kinematics"
version = "0.0.0-dev.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["phoxal"]
description = "Public kinematics contract and private kinematics service executable for Phoxal."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
include = ["generated/**", "src/**", "proto/**", "Cargo.toml", "Cargo.lock", "README.md"]

[lib]
path = "generated/lib.rs"

[[bin]]
name = "phoxal-service-kinematics"
path = "src/main.rs"
required-features = ["runtime"]

[features]
default = []
runtime = ["phoxal/runtime", "dep:anyhow", "dep:serde", "dep:thiserror"]

[dependencies]
phoxal = { workspace = true, default-features = false, features = ["contract", "robotics"] }
prost = { workspace = true }
thiserror = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[package.metadata.phoxal.contract]
protos = ["proto/phoxal/kinematics/v1/kinematics.proto"]
includes = ["proto"]
generated = "generated"
dependencies = [
    { dependency = "phoxal", proto_package = ".phoxal.robotics.v1", rust_path = "::phoxal::robotics" },
]

[lints]
workspace = true
