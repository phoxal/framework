[package]
name = "phoxal-service-motion"
version = "0.0.0-dev.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["phoxal"]
description = "Motion service executable for Phoxal."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
include = ["api/**", "build.rs", "src/**", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md"]

[[bin]]
name = "phoxal-service-motion"
path = "src/main.rs"
required-features = ["runtime"]

[features]
default = ["runtime"]
runtime = ["phoxal/runtime", "dep:anyhow", "dep:serde", "dep:thiserror"]

[dependencies]
phoxal = { workspace = true, default-features = false, features = ["contract"] }
thiserror = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[build-dependencies]
phoxal = { workspace = true, default-features = false, features = ["build"] }

[lints]
workspace = true
