[package]
name = "phoxal-motion"
version = "0.68.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["phoxal"]
description = "Public motion contract and private motion service executable for Phoxal."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
include = ["build.rs", "lib.rs", "validation.rs", "src/**", "proto/**", "Cargo.toml", "README.md"]

[package.metadata.phoxal]
kind = "service"

[lib]
path = "lib.rs"

[[bin]]
name = "phoxal-service-motion"
path = "src/main.rs"
required-features = ["runtime"]

[features]
default = []
runtime = ["phoxal/runtime", "dep:anyhow", "dep:serde", "dep:phoxal-service-kinematics"]

[dependencies]
phoxal = { workspace = true, default-features = false, features = ["port"] }
phoxal-service-kinematics = { workspace = true, optional = true }
prost = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[build-dependencies]
phoxal = { workspace = true, default-features = false, features = ["build"] }

[lints]
workspace = true