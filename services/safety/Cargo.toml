[package]
name = "phoxal-service-safety"
version = "0.0.0-dev.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["phoxal"]
description = "Public safety assessment contract and private safety service executable for Phoxal."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
include = ["generated/**", "src/**", "proto/**", "Cargo.toml", "Cargo.lock", "README.md"]

[lib]
path = "generated/lib.rs"

[[bin]]
name = "phoxal-service-safety"
path = "src/main.rs"
required-features = ["runtime"]

[features]
default = []
runtime = ["phoxal/runtime", "phoxal/robotics", "dep:anyhow", "dep:serde", "dep:thiserror", "dep:phoxal-service-world"]

[dependencies]
phoxal = { workspace = true, default-features = false, features = ["contract"] }
phoxal-service-motion = { workspace = true }
phoxal-service-world = { workspace = true, optional = true }
prost = { workspace = true }
thiserror = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[package.metadata.phoxal.contract]
protos = ["proto/phoxal/safety/v1/safety.proto"]
includes = ["proto"]
generated = "generated"
dependencies = [
    { dependency = "phoxal-service-motion", proto_package = ".phoxal.motion.v1", rust_path = "::phoxal_service_motion" },
]

[lints]
workspace = true
