[package]
name = "phoxal-service-safety"
version = "0.68.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["phoxal"]
description = "Phoxal official service: bounded measured/world safety assessment."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[package.metadata.phoxal]
kind = "service"

[lib]
name = "phoxal_service_safety"
path = "src/lib.rs"

[[bin]]
name = "phoxal-service-safety"
path = "src/main.rs"

[dependencies]
phoxal = { workspace = true, features = ["runtime"] }
phoxal-motion = { workspace = true }
phoxal-safety = { workspace = true }
phoxal-world = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }

[lints]
workspace = true
