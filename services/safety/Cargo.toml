[package]
name = "phoxal-service-safety"
version = "0.0.0-dev.8"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["phoxal"]
description = "Public safety assessment contract and private safety service executable for Phoxal."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[[bin]]
name = "phoxal-service-safety"
path = "src/main.rs"

[dependencies]
phoxal = { workspace = true, default-features = false, features = ["runtime"] }
thiserror.workspace = true
anyhow.workspace = true
serde.workspace = true

[lints]
workspace = true
