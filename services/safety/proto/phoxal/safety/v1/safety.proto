syntax = "proto3";

package phoxal.safety.v1;

import "google/protobuf/empty.proto";
import "phoxal/motion/v1/constraints.proto";
import "phoxal/motion/v1/motion.proto";
import "phoxal/port.proto";
import "phoxal/robotics/v1/robotics.proto";
import "phoxal/world/v1/world.proto";

// SafetyStatus now references the canonical Motion-owned `ConstraintReason`
// from `phoxal.motion.v1.constraints` after the protective-constraint payload
// ownership move. The `SafetyStatus` message itself remains Safety-owned.
message SafetyStatus {
  bool protective_state_clear = 1;
  uint64 sequence = 2;
  repeated phoxal.motion.v1.ConstraintReason reasons = 3;
}

service Safety {
  rpc World(google.protobuf.Empty) returns (stream phoxal.world.v1.WorldBelief) {
    option (phoxal.port.kind) = STATE;
  }

  rpc WorldRevision(google.protobuf.Empty) returns (stream phoxal.world.v1.WorldRevision) {
    option (phoxal.port.kind) = STATE;
  }

  rpc Ranges(google.protobuf.Empty) returns (stream phoxal.robotics.v1.RangeSample) {
    option (phoxal.port.kind) = SAMPLE;
  }

  rpc Motion(google.protobuf.Empty) returns (stream phoxal.motion.v1.MotionStatus) {
    option (phoxal.port.kind) = STATE;
  }

  // The Constraints endpoint publishes the canonical Motion-owned
  // `MotionConstraints` payload after the protective-constraint ownership move.
  rpc Constraints(google.protobuf.Empty) returns (stream phoxal.motion.v1.MotionConstraints) {
    option (phoxal.port.kind) = STATE;
  }

  rpc Status(google.protobuf.Empty) returns (stream SafetyStatus) {
    option (phoxal.port.kind) = STATE;
  }
}
