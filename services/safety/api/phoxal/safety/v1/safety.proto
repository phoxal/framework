syntax = "proto3";

package phoxal.safety.v1;

import "google/protobuf/empty.proto";
import "phoxal/motion/v1/constraints.proto";

// SafetyStatus now references the canonical Motion-owned `ConstraintReason`
// from `phoxal.motion.v1.constraints` after the protective-constraint payload
// ownership move. The `SafetyStatus` message itself remains Safety-owned.
message SafetyStatus {
  bool protective_state_clear = 1;
  uint64 sequence = 2;
  repeated phoxal.motion.v1.ConstraintReason reasons = 3;
}
