[package]
name = "phoxal-service-navigation"
version = "0.0.0-dev.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["phoxal"]
description = "Public navigation contract and private navigation service executable for Phoxal."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
include = ["build.rs", "lib.rs", "validation.rs", "src/**", "proto/**", "Cargo.toml", "README.md"]

[lib]
path = "lib.rs"

[[bin]]
name = "phoxal-service-navigation"
path = "src/main.rs"
required-features = ["runtime"]

[features]
default = []
runtime = ["phoxal/runtime", "dep:anyhow", "dep:serde", "dep:phoxal-service-kinematics", "dep:phoxal-service-world"]

[dependencies]
phoxal = { workspace = true, default-features = false, features = ["port"] }
phoxal-service-kinematics = { workspace = true, optional = true }
phoxal-service-world = { workspace = true, optional = true }
prost = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[build-dependencies]
phoxal = { workspace = true, default-features = false, features = ["build"] }
phoxal-service-kinematics = { workspace = true }
phoxal-service-world = { workspace = true }

[lints]
workspace = true
