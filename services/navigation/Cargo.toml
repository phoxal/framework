[package]
name = "phoxal-service-navigation"
version = "0.68.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["phoxal"]
description = "Phoxal official service: lifecycle-aware planning, following, and exploration."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[package.metadata.phoxal]
kind = "service"

[[bin]]
name = "phoxal-service-navigation"
path = "src/main.rs"

[dependencies]
phoxal = { workspace = true, features = ["runtime"] }
phoxal-kinematics = { workspace = true }
phoxal-navigation = { workspace = true }
phoxal-world = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }

[lints]
workspace = true
