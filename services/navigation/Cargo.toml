[package]
name = "phoxal-service-navigation"
version = "0.0.0-dev.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["phoxal"]
description = "Phoxal navigation service executable and packaged API."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
include = ["src/**", "api/**", "build.rs", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md"]

[[bin]]
name = "phoxal-service-navigation"
path = "src/main.rs"

[features]
default = ["runtime"]
runtime = ["phoxal/runtime", "dep:anyhow", "dep:serde", "dep:thiserror"]

[dependencies]
phoxal = { workspace = true, default-features = false, features = ["contract"] }
thiserror = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[build-dependencies]
phoxal = { workspace = true, default-features = false, features = ["build"] }

[lints]
workspace = true
