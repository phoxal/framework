[package]
name = "phoxal-service-world"
version = "0.0.0-dev.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["phoxal"]
description = "Public world estimation contract and private world service executable for Phoxal."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
include = ["build.rs", "lib.rs", "validation.rs", "src/**", "proto/**", "Cargo.toml", "README.md"]

[lib]
path = "lib.rs"

[[bin]]
name = "phoxal-service-world"
path = "src/main.rs"
required-features = ["runtime"]

[features]
default = []
runtime = ["phoxal/runtime", "dep:anyhow", "dep:serde"]

[dependencies]
phoxal = { workspace = true, default-features = false, features = ["port"] }
phoxal-service-kinematics = { workspace = true }
prost = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[build-dependencies]
phoxal = { workspace = true, default-features = false, features = ["build"] }
phoxal-service-kinematics = { workspace = true }

[lints]
workspace = true
