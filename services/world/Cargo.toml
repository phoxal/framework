[package]
name = "phoxal-service-world"
version = "0.0.0-dev.8"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["phoxal"]
description = "Phoxal world estimation service executable and packaged API."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[[bin]]
name = "phoxal-service-world"
path = "src/main.rs"

[build-dependencies]
phoxal = { workspace = true, default-features = false, features = ["build"] }

[dependencies]
phoxal = { workspace = true, default-features = false, features = ["runtime"] }
thiserror.workspace = true
anyhow.workspace = true
serde.workspace = true

[dev-dependencies]
prost = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
zenoh = { workspace = true }

[lints]
workspace = true
