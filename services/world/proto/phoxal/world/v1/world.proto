syntax = "proto3";

package phoxal.world.v1;

import "google/protobuf/empty.proto";
import "phoxal/kinematics/v1/kinematics.proto";
import "phoxal/port.proto";

message WorldBelief {
  string frame_id = 1;
  double x_m = 2;
  double y_m = 3;
  double yaw_rad = 4;
  float confidence = 5;
  uint64 revision = 6;
  bool available = 7;
  // Oldest source capture supporting this product, in the execution timeline.
  // Republishing or deriving state must preserve this time.
  optional uint64 oldest_capture_time_nanos = 8;
}

message WorldRevision {
  uint64 revision = 1;
  bool available = 2;
  // Oldest source capture supporting this product, in the execution timeline.
  // Republishing or deriving state must preserve this time.
  optional uint64 oldest_capture_time_nanos = 3;
}

message Bounds {
  double min_x_m = 1;
  double min_y_m = 2;
  double max_x_m = 3;
  double max_y_m = 4;
}

enum Occupancy {
  OCCUPANCY_UNSPECIFIED = 0;
  OCCUPANCY_FREE = 1;
  OCCUPANCY_OCCUPIED = 2;
  OCCUPANCY_UNKNOWN = 3;
}

message GridWindow {
  string frame_id = 1;
  double origin_x_m = 2;
  double origin_y_m = 3;
  double resolution_m = 4;
  uint32 width = 5;
  uint32 height = 6;
  repeated Occupancy cells = 7;
  uint64 revision = 8;
  Bounds requested = 9;
  Bounds covered = 10;
}

enum WindowUnavailableReason {
  WINDOW_UNAVAILABLE_REASON_UNSPECIFIED = 0;
  WINDOW_UNAVAILABLE_REASON_WORLD_UNAVAILABLE = 1;
  WINDOW_UNAVAILABLE_REASON_OUT_OF_BOUNDS = 2;
  WINDOW_UNAVAILABLE_REASON_REVISION_NOT_RETAINED = 3;
}

message WindowUnavailable {
  WindowUnavailableReason reason = 1;
  uint64 revision = 2;
}

message WindowRequest {
  Bounds requested = 1;
  uint64 revision = 2;
}

message WindowResponse {
  oneof result {
    GridWindow window = 1;
    WindowUnavailable unavailable = 2;
  }
}

enum UnavailableReason {
  UNAVAILABLE_REASON_UNSPECIFIED = 0;
  UNAVAILABLE_REASON_POSE = 1;
  UNAVAILABLE_REASON_STALE_POSE = 2;
  UNAVAILABLE_REASON_INVALID_POSE = 3;
}

message WorldStatus {
  bool available = 1;
  repeated UnavailableReason unavailable_reasons = 2;
  uint64 revision = 3;
}

service World {
  rpc Pose(google.protobuf.Empty) returns (stream phoxal.kinematics.v1.OdometryState) {
    option (phoxal.port.kind) = SAMPLE;
  }

  rpc Belief(google.protobuf.Empty) returns (stream WorldBelief) {
    option (phoxal.port.kind) = STATE;
  }

  rpc Revision(google.protobuf.Empty) returns (stream WorldRevision) {
    option (phoxal.port.kind) = STATE;
  }

  rpc Window(WindowRequest) returns (WindowResponse) {
    option (phoxal.port.kind) = READ;
  }

  rpc Status(google.protobuf.Empty) returns (stream WorldStatus) {
    option (phoxal.port.kind) = STATE;
  }
}
