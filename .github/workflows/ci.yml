name: ci

on:
  pull_request:
  push:
    branches: [main]
  # The Stable-line rehearsal, and nothing else. Every other job below is
  # conditioned on a pull request or a push, so a scheduled run is one job.
  # GitHub only runs a schedule on the default branch, which is where the
  # rehearsal belongs: it drills the semantics main carries, not a branch's.
  # 04:41 UTC on Mondays, off the hour so it does not queue behind the top of
  # the hour, and off the daily release-plz cron.
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Runnable crates own apt build requirements in package.metadata.phoxal.build;
# phoxal's `authoring_workspace_build_requirements` test keeps that bootstrap
# input synchronized with their declared union.
# The two Webots controller packages link libController even during
# `cargo check`, so the shared workflow installs the one supported native SDK
# before its clippy and test jobs.
jobs:
  ci:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       !startsWith(github.event.head_commit.message, 'chore(release): release v'))
    uses: phoxal/.github/.github/workflows/rust-ci.yml@main
    with:
      webots-version: R2025a
    secrets: inherit

  # The ordinary tests prove deterministic source generation. This launches the
  # supported native runtime and refuses asset-loader warnings, so IndexedFaceSet
  # output cannot regress to a representation R2025a only appears to parse.
  webots-native-renderer:
    name: Webots native renderer
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       !startsWith(github.event.head_commit.message, 'chore(release): release v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install native runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            ffmpeg \
            libavcodec-extra \
            libegl1 \
            libglu1-mesa \
            libxkbcommon-x11-0 \
            libxcb-keysyms1 \
            libxcb-image0 \
            libxcb-icccm4 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcomposite1 \
            libxtst6 \
            libnss3 \
            xvfb

      - name: Cache Webots download
        id: cache-webots-native-renderer
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/webots.tar.bz2
          key: webots-R2025a-${{ runner.os }}-${{ runner.arch }}

      - name: Download Webots
        if: steps.cache-webots-native-renderer.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/cyberbotics/webots/releases/download/R2025a/webots-R2025a-x86-64.tar.bz2" \
            --output "$RUNNER_TEMP/webots.tar.bz2"

      - name: Install Webots
        run: |
          tar -xjf "$RUNNER_TEMP/webots.tar.bz2" -C "$RUNNER_TEMP"
          echo "WEBOTS_HOME=$RUNNER_TEMP/webots" >> "$GITHUB_ENV"

      - name: Prove decoded GLB geometry in R2025a
        run: >-
          xvfb-run --auto-servernum
          cargo test -p phoxal-simulator-webots-host --lib
          installed_webots_loads_native_decoded_geometry_without_asset_warnings
          -- --ignored --nocapture

  # Every consumer profile, built explicitly.
  #
  # The shared `ci` job builds the workspace, and a workspace build unifies
  # `phoxal`'s features across every member - so it compiles one crate with
  # every profile at once and can say nothing about any single profile. These
  # are the builds that can: each is what one supported consumer actually gets.
  #
  # Rustdoc runs per profile too, because the crate root is participant-first
  # and a doc link into a module another profile hides is a break only that
  # profile's build can see.
  consumer-profiles:
    name: consumer profiles
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       !startsWith(github.event.head_commit.message, 'chore(release): release v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build every canonical profile
        shell: bash
        run: |
          set -euo pipefail
          # default: the participant SDK a robot project gets.
          cargo check -p phoxal
          for profile in session simulator supervisor authoring session,authoring; do
            cargo check -p phoxal --no-default-features --features "$profile"
          done
          # Additivity: every profile compiled together must still be one crate.
          cargo check -p phoxal --all-features

      - name: Document every canonical profile
        shell: bash
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          set -euo pipefail
          cargo doc -p phoxal --no-deps
          for profile in session simulator supervisor authoring session,authoring; do
            cargo doc -p phoxal --no-default-features --features "$profile" --no-deps
          done
          cargo doc -p phoxal --all-features --no-deps

      # The shared workspace test unifies the features its members enable.
      # Test all profiles explicitly as well, including integration tests with
      # `required-features`, independently of the current member composition.
      - name: Test every profile together
        run: cargo test -p phoxal --all-features

      # `cargo hack --each-feature` is the guard *beside* the list above, not
      # instead of it: it catches a profile combination nobody thought to name,
      # while the explicit list is what states the supported set.
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Every feature on its own
        run: cargo hack --each-feature -p phoxal check

  # The Rust-API half of the compatibility promise, over the whole surface.
  #
  # release-plz runs `cargo-semver-checks` itself on the release PR, but with
  # default features only, and it exposes no way to pass a feature selection
  # through. A profile-gated API is most of this crate's public surface, so a
  # default-feature run would check the participant profile and silently ignore
  # `session`, `simulator`, `supervisor` and `authoring`. This job runs the same
  # tool over all of them.
  #
  # It reports rather than gates on an ordinary branch, for the same reason the
  # compatibility report does: a branch is not setting a version, so there is no
  # version for a break to be judged against.
  semver-checks:
    name: rust api surface
    if: >-
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: taiki-e/install-action@cargo-semver-checks

      - name: Check the whole public surface against the published train
        shell: bash
        run: |
          set -euo pipefail
          report="$(cargo semver-checks --package phoxal --all-features 2>&1)" || true
          echo "$report"
          {
            echo "## Rust API surface (all profiles)"
            echo
            echo '```'
            echo "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  # The rules no single crate owns: the directory/naming/publish grammar every
  # official package obeys, the direction of the public library graph and the
  # edges no canonical crate may grow, the Zenoh feature profile, the deleted
  # surfaces that may not return, and what a committed comment may name.
  # It builds nothing it judges - every rule reads `cargo metadata`, the
  # filesystem or Git - so it links no framework crate at all.
  # The proofs that need the framework *linked* are ordinary tests in the crates
  # that own them and run in the `ci` job's `cargo test --workspace`.
  policy:
    name: workspace policy
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       !startsWith(github.event.head_commit.message, 'chore(release): release v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Test registry dependency ordering
        run: python3 -m unittest discover -s .github/scripts -p 'test_registry_package_order.py'

      - name: Check the workspace policy
        shell: bash
        run: |
          set -euo pipefail
          # The report goes to the summary whichever way the gate falls: the
          # violations behind a refusal are the reason to read it.
          status=0
          report="$(cargo xtask policy)" || status=$?
          echo "$report"
          {
            echo "## Workspace policy"
            echo
            echo '```'
            echo "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # What this pull request does to the wire contracts, stated where the author
  # can see it. It never fails on the verdict: an ordinary branch is not setting
  # a version, so there is no version for it to be judged against. The release
  # PR is where the same comparison becomes a gate, one job below.
  # The checker compiles the framework library and a probe against its
  # published counterpart.
  compatibility-report:
    name: compatibility report
    if: >-
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Report the contract impact
        shell: bash
        env:
          # Read through the environment: a title is arbitrary text and must
          # never be expanded into the script itself.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          # A Conventional Commit breaking marker is the author declaring a
          # break, so the report is escalated to it. The checker sees structure
          # only; the marker is how a reinterpreted unit or a flipped convention
          # under an unchanged shape reaches the impact.
          #
          # The marker is `!` immediately before the colon, after the type and
          # its optional scope. Held in a variable because a literal `\(` in an
          # inline `=~` pattern is a parse error on older bash.
          marker='^[a-zA-Z]+(\([^)]*\))?!:'
          declared=unchanged
          if [[ "$PR_TITLE" =~ $marker ]]; then
            declared=breaking
          fi
          # Ordinary release-size findings do not fail `report`, while frozen
          # bootstrap drift does. Preserve the complete report in the summary
          # before returning that hard failure.
          status=0
          report="$(cargo xtask compatibility report --declared-impact "$declared")" || status=$?
          echo "$report"
          {
            echo "## Contract compatibility"
            echo
            echo '```'
            echo "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # The release PR carries the candidate train version, which makes it the one
  # branch where the sufficiency of a version can be judged at all. A candidate
  # too small for what its contracts changed fails here and cannot merge, so an
  # under-sized train is refused before it is ever prepared for publication.
  compatibility-release-candidate:
    name: release candidate compatibility
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Check the candidate version against the published train
        shell: bash
        run: |
          set -euo pipefail
          # The report goes to the summary whichever way the gate falls: the
          # records behind a refusal are the reason to read it.
          status=0
          report="$(cargo xtask compatibility check-release)" || status=$?
          echo "$report"
          {
            echo "## Release candidate compatibility"
            echo
            echo '```'
            echo "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # The Stable-line semantics, drilled on a schedule.
  #
  # Every post-1.0 code path - a break needing a major, two versions on one 1.x
  # line interoperating, the frozen bootstrap surviving a major flip - runs only
  # inside `cargo test` while the framework is pre-1.0. This runs the whole
  # matrix as the command a maintainer would run, so a Stable path that stops
  # working is found in the week it breaks and not on flip day.
  #
  # Deliberately not on pull requests: the drill answers a question no branch
  # asks, and the matrix rows are already proved by `cargo test` on every one.
  # It reaches no registry: the drill states its own baselines, and the pinned
  # tests it runs are `phoxal`'s own.
  compatibility-rehearsal:
    name: compatibility rehearsal
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Drill the Stable-line semantics
        shell: bash
        run: |
          set -euo pipefail
          status=0
          report="$(cargo xtask compatibility rehearse-v1)" || status=$?
          echo "$report"
          {
            echo "## v1 rehearsal"
            echo
            echo '```'
            echo "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
