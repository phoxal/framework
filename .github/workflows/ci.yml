name: ci

on:
  pull_request:
  push:
    branches: [main]
  # The Stable-line rehearsal, and nothing else. Every other job below is
  # conditioned on a pull request or a push, so a scheduled run is one job.
  # GitHub only runs a schedule on the default branch, which is where the
  # rehearsal belongs: it drills the semantics main carries, not a branch's.
  # 04:41 UTC on Mondays, off the hour so it does not queue behind the top of
  # the hour, and off the daily release-plz cron.
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The workspace builds on a bare runner by design. Runnable crates own native
# build requirements in package.metadata.phoxal.build; phoxal-manifest's
# `workspace_build_requirements` test keeps this bootstrap input synchronized
# with their declared union.
# webots-rs links libController at build time, so the workspace cannot even be
# cargo checked without a real Webots installation; the reusable workflow
# installs it and exports WEBOTS_HOME before the clippy and test jobs build.
jobs:
  ci:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       !startsWith(github.event.head_commit.message, 'chore(release): release v'))
    uses: phoxal/.github/.github/workflows/rust-ci.yml@main
    with:
      webots-version: R2025a
    secrets: inherit

  # `examples/hello-rover` is a separate Cargo workspace pinned to a *published*
  # framework train, so `cargo check --workspace` never reaches it and it rots
  # silently without a job of its own. It is deliberately not a workspace
  # member - it must prove the authoring surface as an external consumer sees
  # it, resolved from the registry - so this job is the only thing that compiles
  # it. `--locked` makes the committed lockfile part of the proof.
  # It needs no Webots: the example depends on `phoxal` alone.
  hello-rover-example:
    name: examples/hello-rover
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       !startsWith(github.event.head_commit.message, 'chore(release): release v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Check
        working-directory: examples/hello-rover
        run: cargo check --locked

  # The rules no single crate owns: the directory/naming/publish grammar every
  # official package obeys, the direction of the public library graph and the
  # edges no canonical crate may grow, the Zenoh feature profile, the deleted
  # surfaces that may not return, and what a committed comment may name.
  # It builds nothing it judges - every rule reads `cargo metadata`, the
  # filesystem or Git - so it links no framework crate and installs no Webots.
  # The proofs that need the framework *linked* are ordinary tests in the crates
  # that own them and run in the `ci` job's `cargo test --workspace`.
  policy:
    name: workspace policy
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       !startsWith(github.event.head_commit.message, 'chore(release): release v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Check the workspace policy
        shell: bash
        run: |
          set -euo pipefail
          # The report goes to the summary whichever way the gate falls: the
          # violations behind a refusal are the reason to read it.
          status=0
          report="$(cargo xtask policy)" || status=$?
          echo "$report"
          {
            echo "## Workspace policy"
            echo
            echo '```'
            echo "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # What this pull request does to the wire contracts, stated where the author
  # can see it. It never fails on the verdict: an ordinary branch is not setting
  # a version, so there is no version for it to be judged against. The release
  # PR is where the same comparison becomes a gate, one job below.
  # The checker compiles the five contract crates and a probe against their
  # published counterparts; that closure has no native build requirements, so
  # these two jobs deliberately install no Webots.
  compatibility-report:
    name: compatibility report
    if: >-
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Report the contract impact
        shell: bash
        env:
          # Read through the environment: a title is arbitrary text and must
          # never be expanded into the script itself.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          # A Conventional Commit breaking marker is the author declaring a
          # break, so the report is escalated to it. The checker sees structure
          # only; the marker is how a reinterpreted unit or a flipped convention
          # under an unchanged shape reaches the impact.
          #
          # The marker is `!` immediately before the colon, after the type and
          # its optional scope. Held in a variable because a literal `\(` in an
          # inline `=~` pattern is a parse error on older bash.
          marker='^[a-zA-Z]+(\([^)]*\))?!:'
          declared=unchanged
          if [[ "$PR_TITLE" =~ $marker ]]; then
            declared=breaking
          fi
          # Ordinary release-size findings do not fail `report`, while frozen
          # bootstrap drift does. Preserve the complete report in the summary
          # before returning that hard failure.
          status=0
          report="$(cargo xtask compatibility report --declared-impact "$declared")" || status=$?
          echo "$report"
          {
            echo "## Contract compatibility"
            echo
            echo '```'
            echo "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # The release PR carries the candidate train version, which makes it the one
  # branch where the sufficiency of a version can be judged at all. A candidate
  # too small for what its contracts changed fails here and cannot merge, so an
  # under-sized train is refused before it is ever prepared for publication.
  compatibility-release-candidate:
    name: release candidate compatibility
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Check the candidate version against the published train
        shell: bash
        run: |
          set -euo pipefail
          # The report goes to the summary whichever way the gate falls: the
          # records behind a refusal are the reason to read it.
          status=0
          report="$(cargo xtask compatibility check-release)" || status=$?
          echo "$report"
          {
            echo "## Release candidate compatibility"
            echo
            echo '```'
            echo "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # The Stable-line semantics, drilled on a schedule.
  #
  # Every post-1.0 code path - a break needing a major, two versions on one 1.x
  # line interoperating, the frozen bootstrap surviving a major flip - runs only
  # inside `cargo test` while the framework is pre-1.0. This runs the whole
  # matrix as the command a maintainer would run, so a Stable path that stops
  # working is found in the week it breaks and not on flip day.
  #
  # Deliberately not on pull requests: the drill answers a question no branch
  # asks, and the matrix rows are already proved by `cargo test` on every one.
  # It reaches no registry and installs no Webots: the drill states its own
  # baselines, and the pinned tests it runs are in `phoxal-runtime-contract` and
  # `phoxal-protocol`, neither of which links libController.
  compatibility-rehearsal:
    name: compatibility rehearsal
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Drill the Stable-line semantics
        shell: bash
        run: |
          set -euo pipefail
          status=0
          report="$(cargo xtask compatibility rehearse-v1)" || status=$?
          echo "$report"
          {
            echo "## v1 rehearsal"
            echo
            echo '```'
            echo "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
