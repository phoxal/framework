name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Runnable crates own apt build requirements in package.metadata.phoxal.build.
jobs:
  contracts:
    name: Protobuf contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The first contract PR has no Protobuf files on its base branch. Buf
      # cannot compare against an empty module, so establish that first
      # baseline with build, format, and lint only. Every later PR must also
      # pass the breaking-change check.
      - name: Detect Protobuf baseline
        id: protobuf-baseline
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_files="$(git ls-tree -r --name-only "${{ github.event.pull_request.base.sha }}")"
          if grep -qE '\.proto$' <<< "$base_files"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No Protobuf contract baseline exists on the base revision."
          fi

      - uses: bufbuild/buf-action@v1
        with:
          version: "1.73.0"
          lint: true
          format: true
          breaking: ${{ steps.protobuf-baseline.outputs.available == 'true' }}
          push: false
          archive: false
          pr_comment: false

  ci:
    uses: phoxal/.github/.github/workflows/rust-ci.yml@main
    secrets: inherit

  examples:
    name: maintained examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Test the example workspace
        run: cargo test --manifest-path examples/runtime-rewrite/Cargo.toml --workspace --all-targets

      - name: Check the maintained example robots with cargo-phoxal
        shell: bash
        run: |
          set -euo pipefail
          for robot in \
            examples/runtime-rewrite/robots/robot-alpha \
            examples/runtime-rewrite/robots/robot-beta \
            examples/runtime-rewrite/robots/workspace-robot \
            examples/runtime-rewrite/robots/simulation-rover; do
            (
              cd "$robot"
              cargo run --manifest-path ../../../../phoxal/cargo/Cargo.toml -- check --locked
            )
          done

      - name: Check the MuJoCo authoring fixture shape
        run: cargo test --manifest-path examples/runtime-rewrite/Cargo.toml --package example-mujoco-fixture-check

      - name: Validate the local passive component
        run: >-
          cargo run --manifest-path tools/cargo-phoxal/Cargo.toml --
          publish component example-passive-caster
          --path examples/runtime-rewrite/components/passive-caster
          --dry-run

  # Every consumer profile, built explicitly.
  #
  # The shared `ci` job builds the workspace, and a workspace build unifies
  # `phoxal`'s features across every member - so it compiles one crate with
  # every profile at once and can say nothing about any single profile. These
  # are the builds that can: each is what one supported consumer actually gets.
  #
  # Rustdoc runs per profile too, because the crate root is Runtime-first
  # and a doc link into a module another profile hides is a break only that
  # profile's build can see.
  consumer-profiles:
    name: consumer profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build every canonical profile
        shell: bash
        run: |
          set -euo pipefail
          # default: the Runtime SDK a robot project gets.
          cargo check -p phoxal
          for profile in port protocol runtime session; do
            cargo check -p phoxal --no-default-features --features "$profile"
          done
          # Additivity: every profile compiled together must still be one crate.
          cargo check -p phoxal --all-features

      - name: Document every canonical profile
        shell: bash
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          set -euo pipefail
          cargo doc -p phoxal --no-deps
          for profile in port protocol runtime session; do
            cargo doc -p phoxal --no-default-features --features "$profile" --no-deps
          done
          cargo doc -p phoxal --all-features --no-deps

      # The shared workspace test unifies the features its members enable.
      # Test all profiles explicitly as well, including integration tests with
      # `required-features`, independently of the current member composition.
      - name: Test every profile together
        run: cargo test -p phoxal --all-features

      # `cargo hack --each-feature` is the guard *beside* the list above, not
      # instead of it: it catches a profile combination nobody thought to name,
      # while the explicit list is what states the supported set.
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Every feature on its own
        run: cargo hack --each-feature -p phoxal check

  # The rules no single crate owns: the directory/naming/publish grammar every
  # official package obeys, the direction of the public library graph and the
  # edges no canonical crate may grow, the Zenoh feature profile, the deleted
  # surfaces that may not return, and what a committed comment may name.
  # It builds nothing it judges - every rule reads `cargo metadata`, the
  # filesystem or Git - so it links no framework crate at all.
  # The proofs that need the framework *linked* are ordinary tests in the crates
  # that own them and run in the `ci` job's `cargo test --workspace`.
  policy:
    name: workspace policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Check the workspace policy
        shell: bash
        run: |
          set -euo pipefail
          # The report goes to the summary whichever way the gate falls: the
          # violations behind a refusal are the reason to read it.
          status=0
          report="$(cargo xtask policy)" || status=$?
          echo "$report"
          {
            echo "## Workspace policy"
            echo
            echo '```'
            echo "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
