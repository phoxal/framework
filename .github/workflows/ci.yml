name: ci

on:
  pull_request:
  push:
    branches: [main]

# The workspace builds on a bare runner by design; a system package appears
# here only together with the crate that needs it, so a service/driver growing
# a native (-sys/C++) dependency stays visible. Current set:
#   libudev-dev - tool-joypad's gilrs gamepad backend (libudev-sys) on Linux.
jobs:
  ci:
    uses: phoxal/.github/.github/workflows/rust-ci.yml@main
    with:
      system-packages: libudev-dev
    secrets: inherit

  # Tier-2 musl targets are not covered by upstream guarantees. Keep this
  # focused on the four library crates so the guard stays cheap and does not
  # become the native-asset build matrix from the next slice.
  musl-library:
    name: musl library guard (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Install musl toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build library crates for musl
        run: >
          cargo build
          --target ${{ matrix.target }}
          -p phoxal-bus
          -p phoxal-api
          -p phoxal-macros
          -p phoxal
          --lib

      - name: Test library crates for musl
        run: >
          cargo test
          --target ${{ matrix.target }}
          -p phoxal-bus
          -p phoxal-api
          -p phoxal-macros
          -p phoxal
          --lib

  # Living authoring entry point: proves
  # `examples/hello-rover` is not just checked-in text but a robot.yaml +
  # user service that actually compiles and passes `phoxal-cli check`, and
  # that `examples/robot.schema.json` has not drifted from the `Robot` model.
  # `ci`/`rust-ci.yml` above already builds/tests/lints `hello-rover-cruise`
  # as an ordinary workspace default-member; this job adds the two checks
  # that need a sibling `phoxal-cli` checkout: the schema drift guard and a
  # real `phoxal-cli check` run against the example robot graph.
  examples:
    name: hello-rover example (schema guard + phoxal-cli check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: phoxal/phoxal-cli
          path: .phoxal-cli-checkout

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Compile the hello-rover example user service
        run: cargo build -p hello-rover-cruise

      - name: Run the robot.yaml schema drift guard
        run: cargo test -p phoxal --lib schema_guard

      - name: Build phoxal-cli
        working-directory: .phoxal-cli-checkout
        run: >
          cargo build -p phoxal-cli
          --config 'patch."https://github.com/phoxal/framework".phoxal.path="${{ github.workspace }}/phoxal"'
          --config 'patch."https://github.com/phoxal/framework".phoxal-api.path="${{ github.workspace }}/phoxal-api"'

      - name: Check the hello-rover example robot graph with local component assets
        working-directory: examples/hello-rover
        run: ../../.phoxal-cli-checkout/target/debug/phoxal-cli --quiet check --env dev
