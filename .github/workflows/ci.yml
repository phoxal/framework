name: ci

on:
  pull_request:
  push:
    branches: [main]

# The workspace builds on a bare runner by design; a system package appears
# here only together with the crate that needs it, so a service/driver growing
# a native (-sys/C++) dependency stays visible. Current set:
#   libudev-dev - tool-joypad's gilrs gamepad backend (libudev-sys) on Linux.
jobs:
  ci:
    uses: phoxal/.github/.github/workflows/rust-ci.yml@main
    with:
      system-packages: libudev-dev
    secrets: inherit

  # Tier-2 musl targets are not covered by upstream guarantees. Keep this
  # focused on the four library crates so the guard stays cheap and does not
  # become the native-asset build matrix from the next slice.
  musl-library:
    name: musl library guard (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Install musl toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      # This package-only build also keeps the published Zenoh consumers honest.
      - name: Build library crates for musl
        run: >
          cargo build
          --target ${{ matrix.target }}
          -p phoxal-bus
          -p phoxal-api
          -p phoxal-macros
          -p phoxal
          --features phoxal/preview-v2,phoxal-api/preview-v2
          --lib

      - name: Build stable library crates for musl
        run: >
          cargo build
          --target ${{ matrix.target }}
          -p phoxal-bus
          -p phoxal-api
          -p phoxal-macros
          -p phoxal
          --no-default-features
          --lib

      - name: Test library crates for musl
        run: >
          cargo test
          --target ${{ matrix.target }}
          -p phoxal-bus
          -p phoxal-api
          -p phoxal-macros
          -p phoxal
          --features phoxal/preview-v2,phoxal-api/preview-v2
          --lib

  # Living authoring entry point: proves
  # `examples/hello-rover` is not just checked-in text but a robot.yaml +
  # user service that actually compiles, and that `examples/robot.schema.json`
  # has not drifted from the `Robot` model.
  #
  # A full `phoxal-cli check` run against the example is intentionally NOT done
  # here: it requires a sibling `phoxal-cli` checkout whose own dependency on
  # `phoxal`/`phoxal-api` currently resolves from framework `main` via git, so a
  # PR-branch CI cannot build a matched revision reliably (mismatched trait
  # bounds). That end-to-end check belongs in an integration context once the
  # framework is published and the CLI consumes released versions; see the
  # standing schema and validation documentation in the organization repo.
  # `ci`/`rust-ci.yml` above
  # covers the framework workspace. The hello-rover manifest remains the
  # schema-drift fixture after removal of its obsolete cruise service.
  examples:
    name: hello-rover example (schema guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run the robot.yaml schema drift guard
        run: cargo test -p phoxal --lib model::robot::schema_guard::schema_matches_model -- --exact

  feature-boundary:
    name: stable feature boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Verify stable Zenoh consumers outside workspace feature unification
        run: |
          cargo package -p phoxal-bus --allow-dirty
          # Verify the packaged phoxal crate against the same-release local
          # libraries. The registry still contains the previous API until the
          # release workflow publishes this workspace in dependency order.
          cargo package -p phoxal --allow-dirty \
            --config "patch.crates-io.phoxal-api.path='${GITHUB_WORKSPACE}/phoxal-api'" \
            --config "patch.crates-io.phoxal-bus.path='${GITHUB_WORKSPACE}/phoxal-bus'" \
            --config "patch.crates-io.phoxal-macros.path='${GITHUB_WORKSPACE}/phoxal-macros'"

      - name: Verify stable library boundaries
        run: |
          cargo test -p phoxal --lib --no-default-features
          cargo clippy -p phoxal --all-targets --no-default-features -- -D warnings
          cargo clippy -p phoxal-bus -p phoxal-api --all-targets --no-default-features -- -D warnings
