name: ci

on:
  pull_request:
  push:
    branches: [main]

# The workspace builds on a bare runner by design; a system package appears
# here only together with the crate that needs it, so a service/driver growing
# a native (-sys/C++) dependency stays visible. Current set:
#   libudev-dev - tool-joypad's gilrs gamepad backend (libudev-sys) on Linux.
jobs:
  ci:
    uses: phoxal/.github/.github/workflows/rust-ci.yml@main
    with:
      system-packages: libudev-dev
    secrets: inherit

  # Tier-2 musl targets are not covered by upstream guarantees. Keep this
  # focused on the four library crates so the guard stays cheap and does not
  # become the native-asset build matrix from the next slice.
  musl-library:
    name: musl library guard (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Install musl toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build library crates for musl
        run: >
          cargo build
          --target ${{ matrix.target }}
          -p phoxal-bus
          -p phoxal-api
          -p phoxal-macros
          -p phoxal
          --lib

      - name: Test library crates for musl
        run: >
          cargo test
          --target ${{ matrix.target }}
          -p phoxal-bus
          -p phoxal-api
          -p phoxal-macros
          -p phoxal
          --lib

  # Living authoring entry point: proves
  # `examples/hello-rover` is not just checked-in text but a robot.yaml +
  # user service that actually compiles, and that `examples/robot.schema.json`
  # has not drifted from the `Robot` model.
  #
  # A full `phoxal-cli check` run against the example is intentionally NOT done
  # here: it requires a sibling `phoxal-cli` checkout whose own dependency on
  # `phoxal`/`phoxal-api` currently resolves from framework `main` via git, so a
  # PR-branch CI cannot build a matched revision reliably (mismatched trait
  # bounds). That end-to-end check belongs in an integration context once the
  # framework is published and the CLI consumes released versions; see the
  # schema/validation plan under `organization/tmp`. `ci`/`rust-ci.yml` above
  # already builds/tests/lints `hello-rover-cruise` as an ordinary workspace
  # default-member.
  examples:
    name: hello-rover example (schema guard + user service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Compile the hello-rover example user service
        run: cargo build -p hello-rover-cruise

      - name: Run the robot.yaml schema drift guard
        run: cargo test -p phoxal --lib schema_guard
