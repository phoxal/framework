name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: sdk-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
  tests:
    name: clippy and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - run: cargo test --locked -p phoxal -p phoxal-build -p phoxal-macros --lib --all-features
      - run: cargo test --locked -p phoxal-build -p phoxal-macros --tests
      - run: cargo test --locked -p phoxal --test unit --test runtime_behavior_observers --all-features
      - run: cargo test --locked -p phoxal --test compile --features scenario
      - run: cargo test --locked -p phoxal-schema-proof-fixture --all-targets
      - run: cargo test --locked -p phoxal -p phoxal-build -p phoxal-macros --doc --all-features
      - run: cargo clippy --locked -p phoxal -p phoxal-build -p phoxal-macros --all-targets --all-features -- -D warnings
      - run: cargo doc --locked -p phoxal -p phoxal-build -p phoxal-macros --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
  warm-edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --locked -p standard-plus-custom --test warm_edit
