name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The workspace builds on a bare runner by design; a system package appears
# here only together with the crate that needs it, so a service/driver growing
# a native (-sys/C++) dependency stays visible. Current set:
#   libudev-dev - tool-joypad's gilrs gamepad backend (libudev-sys) on Linux.
# webots-rs links libController at build time, so the workspace cannot even be
# cargo checked without a real Webots installation; the reusable workflow
# installs it and exports WEBOTS_HOME before the clippy and test jobs build.
jobs:
  ci:
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release): release v')
    uses: phoxal/.github/.github/workflows/rust-ci.yml@main
    with:
      system-packages: libudev-dev
      webots-version: R2025a
    secrets: inherit

  # Executables are published as SOURCE now, so nothing at release time proves
  # they still compile for the targets a robot may build them on - the old
  # five-target release matrix used to be that proof. A version published to an
  # immutable registry cannot be fixed afterwards, only superseded, so the
  # coverage moves here, to pull-request time, where a regression is still free
  # to fix. `build`, not `check`: only a real build links, and linking is where
  # a missing native symbol, a wrong library architecture, or a broken linker
  # configuration actually shows up - exactly the failures that matter for a
  # package a robot must compile for its own target.
  #
  # The covered set is the targets robots actually build on. `host_target_triple`
  # maps linux to `unknown-linux-gnu` and never to musl, no robot project selects
  # a musl triple, and executables are reached only through the CLI for a robot's
  # own target - so musl belongs to the library guard below, which exists because
  # those four crates are public on crates.io, and not here. x86_64 linux-gnu is
  # covered by the main `ci` job's host build.
  #
  # Per-target exclusions mirror the `compile_error!` guards in the packages
  # themselves: the Webots controller links libController, which Cyberbotics
  # ships only for desktop hosts.
  executable-targets:
    name: executables on ${{ matrix.target }}
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release): release v')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            exclude-packages: phoxal-simulator-webots-controller
          - target: aarch64-apple-darwin
            runner: macos-14
            exclude-packages: ""
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      # The Webots controller is only checked where Webots itself exists, which
      # is the same rule its `compile_error!` guard encodes.
      - name: Install Webots
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location \
            https://github.com/cyberbotics/webots/releases/download/R2025a/webots-R2025a.dmg \
            --output "$RUNNER_TEMP/webots.dmg"
          mkdir "$RUNNER_TEMP/webots-volume"
          hdiutil attach "$RUNNER_TEMP/webots.dmg" \
            -nobrowse -quiet -mountpoint "$RUNNER_TEMP/webots-volume"
          echo "WEBOTS_HOME=$RUNNER_TEMP/webots-volume/Webots.app/Contents" >> "$GITHUB_ENV"

      - name: Build every executable this target supports
        shell: bash
        env:
          EXCLUDED: ${{ matrix.exclude-packages }}
        run: |
          set -euo pipefail
          args=()
          checked=0
          while read -r package; do
            skip=false
            for excluded in $EXCLUDED; do
              [[ "$package" == "$excluded" ]] && skip=true
            done
            if [[ "$skip" == true ]]; then
              echo "  excluded on ${{ matrix.target }}: $package"
              continue
            fi
            args+=("-p" "$package")
            checked=$((checked + 1))
          done < <(
            cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.publish == ["phoxal"]) | .name' | sort
          )
          echo "building $checked executable(s) for ${{ matrix.target }}"
          cargo build --locked --target "${{ matrix.target }}" "${args[@]}"

  # Tier-2 musl targets are not covered by upstream guarantees. Keep this
  # focused on the four library crates so the guard stays cheap and does not
  # become the native-asset build matrix from the next slice.
  musl-library:
    name: musl library guard (${{ matrix.target }})
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release): release v')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Install musl toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      # This package-only build also keeps the published Zenoh consumers honest.
      - name: Build library crates for musl
        run: >
          cargo build
          --target ${{ matrix.target }}
          -p phoxal-bus
          -p phoxal-api
          -p phoxal-macros
          -p phoxal
          --lib

      - name: Build minimal library crates for musl
        run: >
          cargo build
          --target ${{ matrix.target }}
          -p phoxal-bus
          -p phoxal-api
          -p phoxal-macros
          -p phoxal
          --no-default-features
          --lib

      - name: Test library crates for musl
        run: >
          cargo test
          --target ${{ matrix.target }}
          -p phoxal-bus
          -p phoxal-api
          -p phoxal-macros
          -p phoxal
          --lib

  feature-boundary:
    name: stable feature boundaries
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release): release v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Verify stable Zenoh consumers outside workspace feature unification
        run: |
          cargo package -p phoxal-bus --allow-dirty
          # Verify the packaged phoxal crate against the same-release local
          # libraries. The registry still contains the previous API until the
          # release workflow publishes this workspace in dependency order.
          cargo package -p phoxal --allow-dirty \
            --config "patch.crates-io.phoxal-api.path='${GITHUB_WORKSPACE}/phoxal-api'" \
            --config "patch.crates-io.phoxal-bus.path='${GITHUB_WORKSPACE}/phoxal-bus'" \
            --config "patch.crates-io.phoxal-macros.path='${GITHUB_WORKSPACE}/phoxal-macros'"

      - name: Verify stable library boundaries
        run: |
          cargo test -p phoxal --lib --no-default-features
          cargo clippy -p phoxal --all-targets --no-default-features -- -D warnings
          cargo clippy -p phoxal-bus -p phoxal-api --all-targets --no-default-features -- -D warnings
