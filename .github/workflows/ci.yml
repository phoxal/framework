name: ci

# Framework pull-request CI: formatting, strict clippy over every target,
# and the deterministic unit tests with locked dependency resolution.
#
# The end-to-end suites that drive the real toolchain (prepare/build/
# publish cycles, trybuild compile surfaces, warm-edit, host acquisition,
# and the supervisor-process composition legs) are gated behind each
# package's `e2e` feature and run in the `integration` workflow on main
# instead of on every PR; without the feature their test binaries compile
# empty, so this lane stays fast.
#
# Compiling any Phoxal composition requires its prepared contracts, so
# the build job first builds cargo-phoxal and prepares the workspace
# fixture compositions (tests/robot, tests/contracts/robot,
# tests/contracts/client, tests/runtime-authoring/consumer — whose
# robot.yaml supplies the countdown contracts it consumes). The
# excluded-by-tests packages:
#
# - tests/robot's native MuJoCo scenario needs a simulator installation;
#   it is compiled here and runs as the recorded native acceptance
#   command on a prepared host:
#
#     cargo build -p phoxal-supervisor --bin phoxal-supervisor &&
#     cargo phoxal test --simulator <simulator-binary> forward_turn_stop
#
# - tests/supervisor-runtime needs its supervisor binary built first
#   (two-step suite contract) and runs in its own job below.
#
# The always-open release-plz version PR (authored by the release App)
# contains only commits already merged to main and already checked here,
# so it is excluded instead of re-running the whole suite on every update.

on:
  pull_request:

# A merged PR has already passed these checks. Cancel obsolete PR heads.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    if: github.event.pull_request.user.login != 'app/phoxal-release-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache: false
      - run: cargo fmt --all -- --check

  build-and-test:
    name: clippy and tests
    if: github.event.pull_request.user.login != 'app/phoxal-release-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release script contract tests
        run: |
          bash .github/scripts/test-release-groups.sh
          bash .github/scripts/test-select-release-pr.sh
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: Build cargo-phoxal
        run: cargo build -p cargo-phoxal --locked
      - name: Prepare the fixture compositions
        run: |
          set -euo pipefail
          for fixture in tests/robot tests/contracts/robot tests/contracts/client tests/runtime-authoring/consumer; do
            (cd "$fixture" && "$GITHUB_WORKSPACE/target/debug/cargo-phoxal" prepare)
          done
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast --exclude phoxal-test-robot

  supervisor-acceptance:
    name: supervisor acceptance
    if: github.event.pull_request.user.login != 'app/phoxal-release-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build the supervisor binary (two-step suite contract)
        run: cargo build -p phoxal-supervisor --bin phoxal-supervisor --locked
      - name: Run the supervisor acceptance suite
        run: cargo test -p phoxal-supervisor-runtime-fixture --locked --no-fail-fast
