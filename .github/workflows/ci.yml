name: ci

on:
  pull_request:
  push:
    branches: [main]

# The workspace builds on a bare runner by design: no crate needs system
# packages, and pre-installing them would silently mask a service/driver
# growing a native (-sys/C++) dependency. Reintroduce a package only together
# with the crate that needs it.
jobs:
  ci:
    uses: phoxal/.github/.github/workflows/rust-ci.yml@main
    secrets: inherit

  # The official-set fixture pins the service set + bus topology; this test fails
  # if the wired topology drifts from the fixture.
  official-set-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Check official-set fixture topology
        run: cargo test -p phoxal --test official_set_topology -- --nocapture

      - name: Check preview feature sync
        run: cargo xtask api sync-features --check

      - name: Check promoted API shape freeze
        run: cargo xtask api freeze-shapes --check

      # Full package-output catalog generation builds all official release
      # binaries. PRs use metadata-only mode to gate discovery, schema ids,
      # coverage, provenance, and checksum integrity without that release cost.
      - name: Generate metadata-only catalog
        run: cargo xtask catalog generate --metadata-only

      - name: Check metadata-only catalog
        run: cargo xtask catalog check --metadata-only

      - name: Verify metadata-only catalog
        run: cargo xtask catalog verify target/xtask/catalog/phoxal-artifact-catalog.json

      - name: Check no-orphan promotion gate
        if: github.event_name == 'pull_request'
        run: cargo xtask api promotion-gate --base ${{ github.event.pull_request.base.sha }} --catalog target/xtask/catalog/phoxal-artifact-catalog.json

      - name: Publish preview impact report
        run: cargo xtask api preview-impact --catalog target/xtask/catalog/phoxal-artifact-catalog.json --json-out target/xtask/api-preview-impact.json --github-summary

      - uses: actions/upload-artifact@v4
        with:
          name: api-preview-impact
          path: target/xtask/api-preview-impact.json
