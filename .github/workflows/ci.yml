name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The workspace builds on a bare runner by design. Runnable crates own native
# build requirements in package.metadata.phoxal.build; workspace-policy keeps
# this bootstrap input synchronized with their declared union.
# webots-rs links libController at build time, so the workspace cannot even be
# cargo checked without a real Webots installation; the reusable workflow
# installs it and exports WEBOTS_HOME before the clippy and test jobs build.
jobs:
  ci:
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release): release v')
    uses: phoxal/.github/.github/workflows/rust-ci.yml@main
    with:
      webots-version: R2025a
    secrets: inherit

  # `examples/hello-rover` is a separate Cargo workspace pinned to a *published*
  # framework train, so `cargo check --workspace` never reaches it and it rots
  # silently without a job of its own. It is deliberately not a workspace
  # member - it must prove the authoring surface as an external consumer sees
  # it, resolved from the registry - so this job is the only thing that compiles
  # it. `--locked` makes the committed lockfile part of the proof.
  # It needs no Webots: the example depends on `phoxal` alone.
  hello-rover-example:
    name: examples/hello-rover
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release): release v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Check
        working-directory: examples/hello-rover
        run: cargo check --locked

  # `phoxal-bus`'s `router` feature is off by default, so `cargo test
  # --workspace` never compiles it. Only `phoxal-cli`'s supervisor turns it on,
  # which means without this job the embedded router would ship untested from
  # this repo and break in the consumer instead.
  bus-router-feature:
    name: phoxal-bus router feature
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release): release v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy -p phoxal-bus --features router --all-targets -- -D warnings

      - name: Test
        run: cargo test -p phoxal-bus --features router

      # cargo publish's release-time verify builds without features, so this
      # is the only place the router-enabled crate is packaged in isolation
      # as its one consumer (phoxal-cli's supervisor) receives it.
      - name: Package with router enabled
        run: |
          cargo package -p phoxal-bus --features router --allow-dirty \
            --config "patch.crates-io.phoxal-runtime-contract.path='${GITHUB_WORKSPACE}/phoxal-runtime-contract'"
