name: release-plz

# Build-snapshot release pipeline (design doc
# organization/tmp/ci-release-refactor/design.md §2, §4).
#
# release-plz owns ALL crate versioning - libraries and binaries alike (the
# latter via git_only, see release-plz.toml). There are no per-artifact
# "warehouse" releases and no mutable "stable" front-door release anymore; a CI
# run produces exactly one immutable `build-YYYYMMDD-<run_number>` release
# holding this run's freshly-built tarballs plus the assembled `catalog.json`,
# and marks it GitHub "latest" once the gate passes. The catalog is a FULL
# INDEX: each run appends the (package, version) pairs it built to the previous
# catalog (fetched from the current "latest" release), so a single catalog
# resolves any pinned version. See the design doc for the whole model.
#
# Three push-triggered jobs. `release-plz release` runs on every push (a
# version-based no-op except on the release merge), but the build-snapshot wave
# (jobs 2-3, and the plan/provenance/create-release steps of job 1) runs ONLY
# when the push is the merge of release-plz's `chore(release)` PR - the
# deliberate release act. A plain feature merge never triggers a build.
#   1. release    - release-plz publishes the 4 libs to crates.io + creates all
#                   tags (lib + binary git_only); then, IF this is the release
#                   merge, computes this run's build set (artifact versions not
#                   already in the latest catalog) and creates the empty
#                   `build-*` release.
#   2. build      - one matrix leg per binary target, packaging its artifacts
#                   sequentially into a shared target directory.
#      assets     - one cheap Linux job packages all target-independent bundles.
#   3. catalog    - assemble catalog.json from this run's facts + the previous
#                   catalog, run the structural gate, upload it to the `build-*`
#                   release, and mark that release "latest".
# Plus a schedule/dispatch `release-plz-pr` job that keeps the one workspace
# release PR (libs + binaries) open.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-train
  cancel-in-progress: false

jobs:
  release:
    name: release-plz release + build set
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.plan.outputs.released }}
      matrix: ${{ steps.plan.outputs.matrix }}
      assets: ${{ steps.plan.outputs.assets }}
      build_tag: ${{ steps.provenance.outputs.build_tag }}
      created_at: ${{ steps.provenance.outputs.created_at }}
    env:
      HAS_RELEASE_APP: ${{ secrets.RELEASE_APP_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install release-plz
        uses: taiki-e/install-action@v2
        with:
          tool: release-plz

      - name: Generate GitHub App token
        id: app-token
        if: env.HAS_RELEASE_APP == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Libraries publish to crates.io; every managed crate (libs + the 27
      # git_only binaries) gets its `{package}-v{version}` tag. No GitHub
      # releases are created here - the binaries land in the `build-*` snapshot
      # release below, the libs carry no artifact.
      - name: Run release-plz release
        run: |
          set -euo pipefail
          release-plz release
        env:
          GIT_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # The build-snapshot wave (build binaries + assemble catalog + mark latest)
      # runs ONLY when this push is the merge of release-plz's `chore(release)`
      # PR - the deliberate release act. A normal feature merge must NOT trigger
      # a build, even one that introduces an artifact identity not yet in the
      # catalog (a component rename did exactly that once and rebuilt the whole
      # component set off a non-release merge). release-plz's PR title is fixed
      # (`chore(release)`, see release-plz.toml `pr_name`); its squash-merge lands
      # a commit whose subject starts with `chore(release)`, and that is the
      # signal. `release-plz release` above still runs every push - it is a
      # version-based no-op except on the release merge - so library publishing
      # stays robust regardless of this gate.
      - name: Detect release-PR merge
        id: gate
        run: |
          set -euo pipefail
          subject="$(git log -1 --pretty=%s)"
          if [[ "$subject" == chore\(release\)* ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "release-plz PR merge detected: $subject"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "not a release merge ($subject); skipping the build-snapshot wave"
          fi

      # This run's identity: `build-YYYYMMDD-<zero-padded run_number>` and a
      # single UTC timestamp reused by every downstream job so the catalog's
      # provenance is internally consistent.
      - name: Compute build provenance
        id: provenance
        if: steps.gate.outputs.is_release == 'true'
        run: |
          set -euo pipefail
          build_tag="build-$(date -u +%Y%m%d)-$(printf '%07d' "${{ github.run_number }}")"
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "build_tag=$build_tag" >> "$GITHUB_OUTPUT"
          echo "created_at=$created_at" >> "$GITHUB_OUTPUT"

      # The full index to diff against + accumulate onto is whatever catalog the
      # current "latest" release carries. `gh release download` with no tag
      # targets the latest release; a missing release or missing asset (cold
      # start, design §4.3) leaves no file and the plan/generate steps below run
      # unfiltered.
      - name: Fetch previous catalog (latest release)
        if: steps.gate.outputs.is_release == 'true'
        run: |
          set -euo pipefail
          mkdir -p prev
          if gh release download --pattern catalog.json --dir prev --repo "${{ github.repository }}"; then
            echo "fetched previous catalog"
          else
            rm -f prev/catalog.json
            echo "no previous catalog (cold start)"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build set = the complete official artifact set. Planning fails if any
      # current version is already in the previous catalog: release_always
      # requires every artifact to bump and be repackaged every train.
      - name: Compute release plan
        id: plan
        if: steps.gate.outputs.is_release == 'true'
        run: |
          set -euo pipefail
          previous=()
          if [ -f prev/catalog.json ]; then
            previous=(--previous-catalog prev/catalog.json)
          fi
          cargo xtask release plan \
            --out target/xtask/release-plan.json \
            --github-output \
            "${previous[@]}"

      # Create the immutable snapshot release up front (NOT latest yet - the
      # catalog job marks it latest only after the gate passes). Carry the
      # previous catalog forward as a workflow artifact so the catalog job needs
      # no second network fetch.
      - name: Create build-snapshot release
        if: steps.plan.outputs.released == 'true'
        run: |
          set -euo pipefail
          gh release create "${{ steps.provenance.outputs.build_tag }}" \
            --repo "${{ github.repository }}" \
            --title "Phoxal build ${{ steps.provenance.outputs.build_tag }}" \
            --notes "Automated build-snapshot release. Artifacts + catalog.json for run ${{ github.run_id }}." \
            --target "${{ github.sha }}" \
            --latest=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.released == 'true'
        with:
          name: release-plan
          path: target/xtask/release-plan.json

      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.released == 'true' && hashFiles('prev/catalog.json') != ''
        with:
          name: previous-catalog
          path: prev/catalog.json

  build:
    name: build ${{ matrix.target }}
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.release.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Install cargo-auditable
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable

      # musl targets cross-compile on the matching-arch Linux runner and need
      # the musl toolchain (mirrors the `musl-library` guard in ci.yml).
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      # Every Linux row carries many packages, so install the joypad dependency
      # for the row instead of trying to predicate it on one matrix package.
      - name: Install joypad Linux dependency
        if: contains(matrix.target, 'linux')
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev

      - name: Package target artifacts
        env:
          PACKAGES: ${{ toJson(matrix.packages) }}
        run: |
          set -uo pipefail
          mkdir -p target/xtask/release
          : > target/xtask/release-failures
          while IFS= read -r package; do
            echo "::group::$package"
            if ! cargo xtask release package "$package" \
              --target "${{ matrix.target }}" \
              --out target/xtask/release; then
              echo "package: $package" >> target/xtask/release-failures
            fi
            echo "::endgroup::"
          done < <(jq -r '.[].package' <<< "$PACKAGES")

      # Upload every successfully packaged tarball + checksum to THIS run's
      # snapshot release. Missing/failed packages are recorded without stopping
      # the rest of the target row.
      - name: Upload to build-snapshot release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES: ${{ toJson(matrix.packages) }}
        run: |
          set -uo pipefail
          while IFS= read -r package; do
            echo "::group::$package"
            if ! cargo xtask release upload \
              --package "$package" \
              --target "${{ matrix.target }}" \
              --tag "${{ needs.release.outputs.build_tag }}" \
              --repo "${{ github.repository }}" \
              --package-dir target/xtask/release; then
              echo "upload: $package" >> target/xtask/release-failures
            fi
            echo "::endgroup::"
          done < <(jq -r '.[].package' <<< "$PACKAGES")

      # Hand the exact packaged bytes to the catalog job. One facts artifact
      # per target replaces the old per-package facts artifacts.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: facts-${{ matrix.target }}
          path: |
            target/xtask/release/*-${{ matrix.target }}.tar.zst
            target/xtask/release/*-${{ matrix.target }}.tar.zst.sha256
          if-no-files-found: error

      - name: Report target failures
        if: always()
        run: |
          if [ -s target/xtask/release-failures ]; then
            echo "The following package operations failed:"
            cat target/xtask/release-failures
            exit 1
          fi
          echo "All packages completed for ${{ matrix.target }}"

  assets:
    name: package target-independent assets
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # Component bundles only tar files; `release package` does not invoke a
      # Cargo artifact build for the target-independent scope.
      - name: Package asset bundles
        env:
          PACKAGES: ${{ needs.release.outputs.assets }}
        run: |
          set -uo pipefail
          mkdir -p target/xtask/release
          : > target/xtask/release-failures
          while IFS= read -r package; do
            echo "::group::$package"
            if ! cargo xtask release package "$package" \
              --target target-independent \
              --out target/xtask/release; then
              echo "package: $package" >> target/xtask/release-failures
            fi
            echo "::endgroup::"
          done < <(jq -r '.[].package' <<< "$PACKAGES")

      - name: Upload to build-snapshot release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES: ${{ needs.release.outputs.assets }}
        run: |
          set -uo pipefail
          while IFS= read -r package; do
            echo "::group::$package"
            if ! cargo xtask release upload \
              --package "$package" \
              --target target-independent \
              --tag "${{ needs.release.outputs.build_tag }}" \
              --repo "${{ github.repository }}" \
              --package-dir target/xtask/release; then
              echo "upload: $package" >> target/xtask/release-failures
            fi
            echo "::endgroup::"
          done < <(jq -r '.[].package' <<< "$PACKAGES")

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: facts-target-independent
          path: |
            target/xtask/release/*-target-independent.tar.zst
            target/xtask/release/*-target-independent.tar.zst.sha256
          if-no-files-found: error

      - name: Report asset failures
        if: always()
        run: |
          if [ -s target/xtask/release-failures ]; then
            echo "The following asset operations failed:"
            cat target/xtask/release-failures
            exit 1
          fi
          echo "All target-independent packages completed"

  catalog:
    name: assemble catalog + gate + mark latest
    needs:
      - release
      - build
      - assets
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: target/xtask

      # Optional - absent on a cold start, in which case the merge starts empty.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: previous-catalog
          path: prev

      - uses: actions/download-artifact@v4
        with:
          pattern: facts-*
          path: target/xtask/release
          merge-multiple: true

      # Assemble-from-facts: never builds, never runs a binary. Reads this run's
      # tarballs/checksums, verifies metadata-section equality across target
      # binaries, computes heads from those packaged sections, merges locations
      # onto the previous catalog keyed by (package, version), and forms Blob
      # URLs against this run's build-* tag.
      - name: Generate catalog
        run: |
          set -euo pipefail
          previous=()
          if [ -f prev/catalog.json ]; then
            previous=(--previous-catalog prev/catalog.json)
          fi
          cargo xtask catalog generate \
            --release-plan target/xtask/release-plan.json \
            --package-dir target/xtask/release \
            --out target/xtask/catalog/catalog.json \
            --repo "${{ github.repository }}" \
            --build-tag "${{ needs.release.outputs.build_tag }}" \
            --run-number "${{ github.run_number }}" \
            --run-id "${{ github.run_id }}" \
            --commit "${{ github.sha }}" \
            --created-at "${{ needs.release.outputs.created_at }}" \
            "${previous[@]}"

      - name: Check catalog (structural + coverage)
        run: >
          cargo xtask catalog check
          --catalog target/xtask/catalog/catalog.json

      # Bounded partial-upload guard: confirm every filename this run's catalog
      # entries expect actually landed in the build-* release (design §4.4).
      - name: Release gate
        run: >
          cargo xtask ci release-gate
          --catalog target/xtask/catalog/catalog.json
          --repo ${{ github.repository }}
          --verify-upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only now - gate green - does the catalog land and this release become
      # "latest". A failed gate above leaves the previous latest authoritative.
      - name: Publish catalog + mark latest
        run: |
          set -euo pipefail
          gh release upload "${{ needs.release.outputs.build_tag }}" \
            target/xtask/catalog/catalog.json \
            --repo "${{ github.repository }}" --clobber
          gh release edit "${{ needs.release.outputs.build_tag }}" \
            --repo "${{ github.repository }}" --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-plz-pr:
    name: release-plz PR
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_APP: ${{ secrets.RELEASE_APP_ID != '' }}
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks

      - name: Generate GitHub App token
        id: app-token
        if: env.HAS_RELEASE_APP == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # One workspace release PR now covers libraries AND binaries (binaries via
      # git_only in release-plz.toml). No separate artifact-version-bump PR.
      #
      # Token hardening (coherence-gate design doc §5): no `|| secrets.GITHUB_TOKEN`
      # fallback here. A PR created with the plain repo `GITHUB_TOKEN` triggers NO
      # downstream workflows (a hard GitHub restriction on Actions-authored
      # content), which would silently deadlock the release train once
      # `coherence-check.yml` becomes a required status on this PR - the PR would
      # sit forever with no check ever reporting. Losing both the App token and
      # `RELEASE_TOKEN` is a real misconfiguration and should fail this job loudly
      # instead. `RELEASE_TOKEN` (a PAT) stays as the fallback because a
      # PAT-created PR triggers workflows normally, same as the App token.
      - name: Run release-plz (release-pr)
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
