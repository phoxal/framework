name: release-plz

# Release-plz prepares a reviewable version PR when a maintainer starts a
# release train. Automatic runs cannot observe publication in the static
# registry and would create redundant follow-up bumps after every merge.
# Publication is performed through the reviewed `phoxal` registry path after
# the owner PR has been merged and its exact package archives are verified.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: framework-release-plz
  cancel-in-progress: false

jobs:
  release-pr:
    name: prepare independent release PR
    uses: phoxal/.github/.github/workflows/rust-release-plz-pr.yml@main
    secrets: inherit
