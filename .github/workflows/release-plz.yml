name: release-plz

# Release-plz keeps a reviewable version PR open after every merge to
# main. Each changed Cargo package owns its version, no unrelated
# package is pulled into that PR, and its diff is the current list of
# packages the next release train would publish. Planning is safe to
# run automatically because only the release train merges this PR, and
# the train publishes every version it merges through the reviewed
# `phoxal` registry path, verifying the exact package archives.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: framework-release-plz
  cancel-in-progress: false

jobs:
  release-pr:
    name: prepare independent release PR
    uses: phoxal/.github/.github/workflows/rust-release-plz-pr.yml@main
    secrets: inherit
