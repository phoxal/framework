name: release-plz

# Split release pipeline (plan #01, revised for release-pr performance).
#
# release-plz owns versions, changelogs, tags, and GitHub releases for the 4
# library crates only (see release-plz.toml's header for why artifact crates
# are out of its scope entirely: they set publish = false, so release-plz drops
# them before its own config even applies).
#
# Official artifact crates (services/drivers/tools/simulator) are owned by
# xtask instead:
#   - `cargo xtask release cut` creates the tag + a draft GitHub release for any
#     artifact whose current Cargo.toml version isn't tagged yet (idempotent -
#     same reconcile-on-every-push semantics `release_always` gave release-plz),
#     and emits a release-plz-JSON-compatible document;
#   - `cargo xtask release plan` consumes that document exactly like it used to
#     consume `release-plz release --output json`, so the native asset
#     packaging/upload/gate/publish/catalog steps below are unchanged;
#   - `cargo xtask release bump --changed` (in the release-plz-pr job) computes
#     artifact version bumps from git diff, cheaply, and lands them via a
#     separate scheduled PR.

on:
  push:
    branches: [main]
  # release-plz-pr now only processes the 4 library crates (artifacts are out of
  # its scope - see the header above), so it is no longer the ~100-minute job it
  # used to be. It still runs on a schedule + on demand rather than every push,
  # since it also opens/updates PRs, which isn't push-appropriate.
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-train
  cancel-in-progress: false

jobs:
  release-plz-release:
    name: release-plz release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.plan.outputs.released }}
      matrix: ${{ steps.plan.outputs.matrix }}
    env:
      HAS_RELEASE_APP: ${{ secrets.RELEASE_APP_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install release-plz
        uses: taiki-e/install-action@v2
        with:
          tool: release-plz

      - name: Generate GitHub App token
        id: app-token
        if: env.HAS_RELEASE_APP == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Libraries only: artifact crates set publish = false and never reach
      # release-plz's scope (see this file's header).
      - name: Run release-plz
        run: |
          set -euo pipefail
          release-plz release
        env:
          GIT_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Artifacts only: idempotent tag + draft-release reconciliation, cheap
      # (git tag/log only, no cargo package). Emits a release-plz-JSON-compatible
      # document so the plan step below needs no changes.
      - name: Cut official artifact releases
        run: |
          set -euo pipefail
          mkdir -p target/xtask
          cargo xtask release cut --repo ${{ github.repository }} --out target/xtask/release-plz.json
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build native release plan
        id: plan
        run: >
          cargo xtask release plan
          --release-plz-json target/xtask/release-plz.json
          --out target/xtask/release-plan.json
          --github-output

      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.released == 'true'
        with:
          name: release-plan
          path: target/xtask/release-plan.json

  native-assets:
    name: native asset (${{ matrix.package }} ${{ matrix.target }})
    needs: release-plz-release
    if: needs.release-plz-release.outputs.released == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.release-plz-release.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Install cargo-auditable
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable

      - name: Install joypad Linux dependency
        if: matrix.package == 'phoxal-tool-joypad' && contains(matrix.target, 'linux')
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev

      - name: Package native asset
        run: >
          cargo xtask release package ${{ matrix.package }}
          --target ${{ matrix.target }}
          --out target/xtask/release

      - name: Upload immutable release assets
        run: >
          cargo xtask release upload
          --package ${{ matrix.package }}
          --target ${{ matrix.target }}
          --tag ${{ matrix.tag }}
          --repo ${{ github.repository }}
          --package-dir target/xtask/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.package }}-${{ matrix.target }}
          path: target/xtask/release/${{ matrix.package }}-v${{ matrix.version }}-${{ matrix.target }}.*

  catalog-publish:
    name: catalog gate and publish
    needs:
      - release-plz-release
      - native-assets
    if: needs.release-plz-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      STABLE_CATALOG_URL: https://raw.githubusercontent.com/phoxal/framework/artifact-catalog-v0-stable/latest.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: target/xtask

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: target/xtask/release
          merge-multiple: true

      - name: Fetch previous stable catalog if present
        run: |
          set -euo pipefail
          if curl -fsSL "$STABLE_CATALOG_URL" -o target/xtask/previous-catalog.json; then
            echo "previous catalog fetched"
          else
            rm -f target/xtask/previous-catalog.json
            echo "no previous stable catalog found"
          fi

      - name: Generate catalog revision
        run: |
          set -euo pipefail
          previous=()
          if [ -f target/xtask/previous-catalog.json ]; then
            previous=(--previous-catalog target/xtask/previous-catalog.json)
          fi
          cargo xtask catalog generate \
            --release-plan target/xtask/release-plan.json \
            --package-dir target/xtask/release \
            --out target/xtask/catalog/phoxal-artifact-catalog.json \
            "${previous[@]}"

      - name: Check catalog revision
        run: |
          set -euo pipefail
          previous=()
          if [ -f target/xtask/previous-catalog.json ]; then
            previous=(--previous-catalog target/xtask/previous-catalog.json)
          fi
          cargo xtask catalog check \
            --catalog target/xtask/catalog/phoxal-artifact-catalog.json \
            --release-plan target/xtask/release-plan.json \
            --package-dir target/xtask/release \
            "${previous[@]}"

      - name: Final release gate
        run: |
          set -euo pipefail
          previous=()
          if [ -f target/xtask/previous-catalog.json ]; then
            previous=(--previous-catalog target/xtask/previous-catalog.json)
          fi
          cargo xtask ci release-gate \
            --catalog target/xtask/catalog/phoxal-artifact-catalog.json \
            --release-plan target/xtask/release-plan.json \
            --package-dir target/xtask/release \
            --verify-github \
            --repo ${{ github.repository }} \
            "${previous[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish artifact draft releases
        run: >
          cargo xtask release publish
          --plan target/xtask/release-plan.json
          --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish stable catalog pointer
        run: >
          cargo xtask catalog publish
          --catalog target/xtask/catalog/phoxal-artifact-catalog.json
          --repo ${{ github.repository }}

  release-plz-pr:
    name: release-plz PR
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_APP: ${{ secrets.RELEASE_APP_ID != '' }}
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks

      - name: Generate GitHub App token
        id: app-token
        if: env.HAS_RELEASE_APP == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Libraries only: artifact crates set publish = false and never reach
      # release-plz's scope (see this file's header).
      - name: Run release-plz (release-pr)
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Artifact crates are out of release-plz's scope entirely (see this file's
      # header), so their version bumps are computed here instead: cheap (git
      # diff only, no cargo package), safe to run on every scheduled/on-demand
      # invocation of this job.
      #
      # Deliberately NOT handled here: dependency-driven artifact staleness (a
      # library crate bumped but the artifact crate itself unchanged). That
      # belongs to the rebuild-cadence machinery from the workspace-and-ci plan,
      # not to this perf fix.
      - name: Compute changed artifact version bumps
        run: cargo xtask release bump --changed

      - name: Open or update the artifact version bump PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "no artifact version bumps; skipping PR"
            exit 0
          fi

          branch="chore/artifact-version-bumps"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git commit -am "chore(release): bump changed artifacts"
          git push --force origin "$branch"

          if gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -qx OPEN; then
            echo "PR for $branch already open; branch updated"
          else
            gh pr create \
              --head "$branch" \
              --title "chore(release): bump changed artifacts" \
              --body "Automated patch-version bumps for official artifact crates whose crate directory changed since their last release tag (computed by \`cargo xtask release bump --changed\`). See release-plz.toml's header comment for why artifact crates are bumped here instead of by release-plz."
          fi
