name: release-plz

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Re-run an unpublished prepared train from main
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: framework-train
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare release train
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.train.outputs.publish }}
      version: ${{ steps.train.outputs.version }}
      tag: ${{ steps.train.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Identify train publication
        id: train
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PUBLISH: ${{ inputs.publish }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "phoxal") | .version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          subject="$(git log -1 --pretty=%s)"
          if [[ "$EVENT_NAME" == "push" && "$subject" == "chore(release): release v"* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$DISPATCH_PUBLISH" == "true" ]]; then
            [[ "$DISPATCH_REF" == "refs/heads/main" ]] || {
              echo "manual publication must run from main" >&2
              exit 1
            }
            release_subject="chore(release): release $tag"
            release_commit="$(git log -1 --format=%H --fixed-strings --grep="$release_subject")"
            [[ -n "$release_commit" ]] || {
              echo "manual publication requires an exact $release_subject ancestor" >&2
              exit 1
            }
            git merge-base --is-ancestor "$release_commit" HEAD || {
              echo "prepared release commit $release_commit is not an ancestor of main" >&2
              exit 1
            }
            git rev-parse --quiet --verify "refs/tags/$tag" >/dev/null && {
              echo "tag $tag already exists; refusing to republish" >&2
              exit 1
            }
            git diff --quiet "$release_commit"..HEAD -- \
              Cargo.toml Cargo.lock phoxal phoxal-api phoxal-bus phoxal-macros || {
              echo "published crate inputs changed after $release_subject; prepare a new train" >&2
              exit 1
            }
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install source-verification dependencies
        if: steps.train.outputs.publish == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      - name: Verify source train
        if: steps.train.outputs.publish == 'true'
        run: cargo xtask release verify --tag "${{ steps.train.outputs.tag }}"

  build:
    name: package ${{ matrix.target }}
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev musl-tools
          cargo install cargo-auditable --locked
      - name: Install Webots runtime for Linux controller packaging
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location \
            https://github.com/cyberbotics/webots/releases/download/R2025a/webots-R2025a-x86-64.tar.bz2 \
            --output "$RUNNER_TEMP/webots.tar.bz2"
          tar -xjf "$RUNNER_TEMP/webots.tar.bz2" -C "$RUNNER_TEMP"
          echo "WEBOTS_HOME=$RUNNER_TEMP/webots" >> "$GITHUB_ENV"
      - name: Install macOS packaging dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-auditable --locked
          curl --fail --location \
            https://github.com/cyberbotics/webots/releases/download/R2025a/webots-R2025a.dmg \
            --output "$RUNNER_TEMP/webots.dmg"
          mkdir "$RUNNER_TEMP/webots-volume"
          hdiutil attach "$RUNNER_TEMP/webots.dmg" \
            -nobrowse -quiet -mountpoint "$RUNNER_TEMP/webots-volume"
          echo "WEBOTS_HOME=$RUNNER_TEMP/webots-volume/Webots.app/Contents" >> "$GITHUB_ENV"
      - run: cargo xtask release package --all --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@v6
        with:
          name: train-${{ matrix.target }}
          path: target/xtask/release/*
          if-no-files-found: error

  assets:
    name: package component assets
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo xtask release assets --all
      - uses: actions/upload-artifact@v6
        with:
          name: train-assets
          path: target/xtask/release/*
          if-no-files-found: error

  # GitHub-writing jobs mint a phoxal-release-bot App token
  # (actions/create-github-app-token): events produced with the workflow's own
  # GITHUB_TOKEN do not trigger other workflows, so a release PR created with
  # it never receives the required coherence gate and cannot be merged. The
  # `HAS_RELEASE_APP` guard keeps forks without the App secrets working on the
  # plain GITHUB_TOKEN fallback.
  stage-github:
    name: stage GitHub train
    needs: [prepare, build, assets]
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_APP: ${{ secrets.RELEASE_APP_ID != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/download-artifact@v7
        with:
          pattern: train-*
          path: target/xtask/release
          merge-multiple: true
      - name: Verify staged train and produce suite
        run: cargo xtask release suite --tag "${{ needs.prepare.outputs.tag }}"
      - name: Generate GitHub App token
        id: app-token
        if: env.HAS_RELEASE_APP == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Create or resume non-latest draft release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --json isDraft --jq '.isDraft')"
            [[ "$is_draft" == "true" ]] || {
              echo "::error::Release $tag is already published; refusing to replace immutable assets."
              exit 1
            }
          else
            gh release create "$tag" --draft --latest=false --title "$tag" --notes "Framework train $tag"
          fi
          for file in target/xtask/release/* target/xtask/suite.json; do
            gh release upload "$tag" "$file" --clobber
          done

  publish-crates:
    name: publish crates.io train
    needs: [prepare, stage-github]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: release-plz
      # No App token here: release-plz.toml disables git tags/releases, so this
      # job only publishes to crates.io and never writes GitHub state that must
      # trigger other workflows.
      - name: Publish dependency order with phoxal facade last
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: release-plz release

  complete:
    name: confirm registries and complete train
    needs: [prepare, publish-crates]
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_APP: ${{ secrets.RELEASE_APP_ID != '' }}
    steps:
      - name: Wait for exact crates.io train
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          for crate in phoxal-bus phoxal-macros phoxal-api phoxal; do
            found=false
            for _attempt in $(seq 1 30); do
              if curl --fail --silent \
                --user-agent "phoxal-release-verifier/1.0 (https://github.com/phoxal/framework)" \
                "https://crates.io/api/v1/crates/$crate/$version" >/dev/null; then
                found=true
                break
              fi
              sleep 10
            done
            [[ "$found" == true ]] || { echo "$crate $version is not observable" >&2; exit 1; }
          done
      - name: Generate GitHub App token
        id: app-token
        if: env.HAS_RELEASE_APP == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Mark GitHub train complete and latest
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ needs.prepare.outputs.tag }}" --draft=false --latest

  release-plz-pr:
    name: prepare grouped release PR
    needs: prepare
    if: needs.prepare.outputs.publish != 'true'
    uses: phoxal/.github/.github/workflows/rust-release-plz-pr.yml@main
    secrets: inherit
