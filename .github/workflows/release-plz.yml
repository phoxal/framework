name: release-plz

# Publishing a train is now two ordinary publications, in order:
#
#   1. release-plz publishes the four library crates to crates.io.
#   2. This workflow packages every executable with `cargo package` and adds the
#      `.crate` files to the static `phoxal` registry, which GitHub Pages then
#      serves.
#
# There is no cross-target build matrix, no per-runtime archive, no suite.json,
# and no mutable draft-release asset choreography: robots compile the source
# packages themselves (organization#951). A train is bounded by how long it
# takes to package source, not by how long it takes to compile 26 binaries for
# five targets.
#
# `registries.phoxal.index` comes from the committed `.cargo/config.toml`, so
# every cargo and release-plz invocation here picks it up - including the shared
# reusable release-PR workflow, which does not inherit this workflow's env.
# Without it release-plz does not degrade, it aborts.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Re-run an unpublished prepared train from main
        required: false
        default: false
        type: boolean
      resume_registry:
        description: >-
          Resume only the registry leg of an already-tagged train whose
          crates.io libraries are live. For when the registry job died and the
          Actions rerun window has passed.
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: framework-train
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare release train
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.train.outputs.publish }}
      crates: ${{ steps.train.outputs.crates }}
      version: ${{ steps.train.outputs.version }}
      tag: ${{ steps.train.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Identify train publication
        id: train
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PUBLISH: ${{ inputs.publish }}
          DISPATCH_RESUME: ${{ inputs.resume_registry }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "phoxal") | .version')"
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          subject="$(git log -1 --pretty=%s)"
          # `crates` says whether the crates.io leg still has work. A
          # registry-only resume leaves it alone: those versions are already
          # published and immutable.
          echo "crates=true" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DISPATCH_RESUME" == "true" ]]; then
            [[ "$DISPATCH_REF" == "refs/heads/main" ]] || {
              echo "registry resume must run from main" >&2
              exit 1
            }
            git rev-parse --quiet --verify "refs/tags/$tag" >/dev/null || {
              echo "registry resume needs an existing $tag; nothing was published yet" >&2
              exit 1
            }
            # Only a train whose libraries really are live may resume: that is
            # what makes re-running the registry leg alone coherent.
            for crate in phoxal-bus phoxal-macros phoxal-api phoxal; do
              curl --fail --silent \
                --user-agent "phoxal-release-verifier/1.0 (https://github.com/phoxal/framework)" \
                "https://crates.io/api/v1/crates/$crate/$version" >/dev/null || {
                  echo "$crate $version is not on crates.io; this train is not resumable" >&2
                  exit 1
                }
            done
            echo "resuming the registry leg for $tag"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "crates=false" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "push" && "$subject" == "chore(release): release v"* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$DISPATCH_PUBLISH" == "true" ]]; then
            [[ "$DISPATCH_REF" == "refs/heads/main" ]] || {
              echo "manual publication must run from main" >&2
              exit 1
            }
            release_subject="chore(release): release $tag"
            release_commit="$(git log -1 --format=%H --fixed-strings --grep="$release_subject")"
            [[ -n "$release_commit" ]] || {
              echo "manual publication requires an exact $release_subject ancestor" >&2
              exit 1
            }
            git merge-base --is-ancestor "$release_commit" HEAD || {
              echo "prepared release commit $release_commit is not an ancestor of main" >&2
              exit 1
            }
            git rev-parse --quiet --verify "refs/tags/$tag" >/dev/null && {
              echo "tag $tag already exists; refusing to republish" >&2
              exit 1
            }
            # Every publishable package matters now, not just the four
            # libraries: an executable changed after the release commit would
            # be published under a version that does not describe it. Markdown
            # is NOT excluded - `phoxal/README.md` and the changelogs are
            # inside published crates, so editing them changes crate bytes.
            git diff --quiet "$release_commit"..HEAD -- ':!.github' || {
              echo "package inputs changed after $release_subject; prepare a new train" >&2
              exit 1
            }
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish-crates:
    name: publish crates.io libraries
    needs: prepare
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.crates == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: release-plz
      # No App token: release-plz publishes to crates.io and creates the one
      # `v<train>` tag; it writes no GitHub state that must trigger another
      # workflow.
      - name: Publish dependency order with the phoxal facade last
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: release-plz release

      - name: Wait for the exact crates.io train
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          for crate in phoxal-bus phoxal-macros phoxal-api phoxal; do
            found=false
            for _attempt in $(seq 1 30); do
              if curl --fail --silent \
                --user-agent "phoxal-release-verifier/1.0 (https://github.com/phoxal/framework)" \
                "https://crates.io/api/v1/crates/$crate/$version" >/dev/null; then
                found=true
                break
              fi
              sleep 10
            done
            [[ "$found" == true ]] || { echo "$crate $version is not observable" >&2; exit 1; }
          done

  publish-registry:
    name: publish executables to the phoxal registry
    needs: [prepare, publish-crates]
    # `always()` so a registry-only resume runs with publish-crates skipped,
    # while a real failure of that job still stops this one.
    if: >-
      always() && needs.prepare.outputs.publish == 'true'
      && needs.publish-crates.result != 'failure'
      && needs.publish-crates.result != 'cancelled'
    runs-on: ubuntu-latest
    env:
      TRAIN: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # tool-joypad's gamepad backend needs libudev to build, and `cargo
      # package` verifies by building what it packaged.
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Package every executable
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(
            cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.publish == ["phoxal"]) | .name' \
              | sort
          )
          [[ ${#packages[@]} -gt 0 ]] || { echo "no executable packages found" >&2; exit 1; }
          echo "packaging ${#packages[@]} executables at ${TRAIN}"
          for package in "${packages[@]}"; do
            if [[ "$package" == "phoxal-simulator-webots-controller" ]]; then
              # The only package that cannot be verified here: it links Webots'
              # libController, and installing Webots to prove a bin-only crate
              # compiles is several hundred megabytes for a check CI already
              # performs on every pull request. What is given up is narrow -
              # that this specific `.crate` is self-contained - and the package
              # has sources only, no assets or generated files to omit.
              cargo package -p "$package" --no-verify
            else
              cargo package -p "$package"
            fi
          done

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: phoxal
          repositories: registry

      - name: Check out the registry
        uses: actions/checkout@v6
        with:
          repository: phoxal/registry
          token: ${{ steps.app-token.outputs.token }}
          path: registry
          # The registry's own append-only validator walks base..head, so this
          # checkout needs real history.
          fetch-depth: 0

      # Immutability is the registry's whole contract, so drop anything already
      # published rather than asking margo to overwrite it. A partly-published
      # train then resumes cleanly instead of failing.
      - name: Drop already-published versions
        shell: bash
        run: |
          set -euo pipefail
          skipped=0
          # margo stores an artifact as crates/<prefix>/<prefix>/<name>/<version>.crate,
          # so the published file is named for the VERSION, not the package. Glob
          # the prefix directories rather than reimplementing Cargo's prefix rule.
          while read -r package version; do
            local_crate="target/package/${package}-${version}.crate"
            [[ -f "$local_crate" ]] || { echo "::error::expected $local_crate"; exit 1; }
            published=""
            for candidate in registry/crates/*/*/"$package"/"$version".crate; do
              [[ -f "$candidate" ]] && { published="$candidate"; break; }
            done
            [[ -n "$published" ]] || continue

            # Same version already in the registry. Resume only if it is the
            # same artifact: identical content means an earlier run of THIS
            # train got that far. Different content means the version would
            # have to change to describe this build, and versions are
            # immutable - so stop rather than publish a contradiction.
            if [[ "$(sha256sum < "$local_crate")" == "$(sha256sum < "$published")" ]]; then
              echo "  already published, skipping: ${package} ${version}"
              rm "$local_crate"
              skipped=$((skipped + 1))
            else
              echo "::error::${package} ${version} is already published with different content."
              echo "::error::Published versions are immutable; cut a new patch train instead."
              exit 1
            fi
          done < <(
            cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.publish == ["phoxal"]) | "\(.name) \(.version)"'
          )
          remaining=$(find target/package -maxdepth 1 -name '*.crate' | wc -l | tr -d ' ')
          echo "publishing $remaining package(s), skipped $skipped already-published"
          echo "REMAINING=$remaining" >> "$GITHUB_ENV"

      - name: Add the packages to the registry
        if: env.REMAINING != '0'
        uses: integer32llc/margo-actions@12d1175e158c2b5640a34e99cf494d0fbebf41b8
        with:
          crates: target/package/*.crate
          registry: registry
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Commit the registry
        if: env.REMAINING != '0'
        working-directory: registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "phoxal-release-bot"
          git config user.email "release-bot@phoxal.com"
          echo "BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git add -A
          git commit -m "publish framework train v${TRAIN}"

      # Everything below runs BEFORE the push. The registry's immutability
      # workflow only triggers afterwards, and a malformed append would already
      # be permanent by then - so the same validator runs here, on the commit
      # that is about to be pushed, while it can still be thrown away.
      - name: Verify the append is valid before pushing
        if: env.REMAINING != '0'
        working-directory: registry
        shell: bash
        run: python3 .github/scripts/check_append_only.py "$BASE" HEAD

      - name: Verify every packaged version is in the index
        if: env.REMAINING != '0'
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          while read -r package version; do
            artifact=""
            for candidate in registry/crates/*/*/"$package"/"$version".crate; do
              [[ -f "$candidate" ]] && { artifact="$candidate"; break; }
            done
            if [[ -z "$artifact" ]]; then
              echo "::error::${package} ${version} is not in the registry after margo ran"
              missing=1
              continue
            fi
            index_file="$(find registry -mindepth 3 -maxdepth 3 -type f -name "$package" \
              -not -path 'registry/crates/*' -not -path 'registry/.git*' | head -1)"
            if [[ -z "$index_file" ]]; then
              echo "::error::${package} has no index file"
              missing=1
              continue
            fi
            expected="$(sha256sum "$artifact" | cut -d' ' -f1)"
            jq -e --arg v "$version" --arg c "$expected" \
              'select(.vers == $v and .cksum == $c)' "$index_file" >/dev/null || {
                echo "::error::${package} ${version} index record missing or checksum mismatch"
                missing=1
              }
          done < <(
            cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.publish == ["phoxal"]) | "\(.name) \(.version)"'
          )
          [[ "$missing" == "0" ]] || exit 1
          echo "every packaged version has a matching index record"

      - name: Deploy the registry
        if: env.REMAINING != '0'
        working-directory: registry
        shell: bash
        run: git push origin main

  release-plz-pr:
    name: prepare grouped release PR
    needs: prepare
    if: needs.prepare.outputs.publish != 'true'
    uses: phoxal/.github/.github/workflows/rust-release-plz-pr.yml@main
    secrets: inherit
