name: release-plz

# Release-plz prepares a reviewable version PR. Each changed Cargo package
# owns its version, and no unrelated package is pulled into that release PR.
# Publication is performed through the reviewed `phoxal` registry path after
# the owner PR has been merged and its exact package archives are verified.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: framework-release-plz
  cancel-in-progress: false

jobs:
  release-pr:
    name: prepare independent release PR
    uses: phoxal/.github/.github/workflows/rust-release-plz-pr.yml@main
    secrets: inherit
