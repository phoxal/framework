name: release-plz

# Crate release pipeline (plan #01), driven by release-plz.
#
# Two halves:
#   1. release-plz-pr      - on every main push, opens/updates the "chore(release):
#      release" PR that bumps only changed packages (library crates plus
#      generated git_only artifact entries).
#   2. release-plz-release - when a release PR's bump commit lands on main,
#      release-plz publishes bumped library crates to crates.io and tags every
#      bumped package `<crate>-v<version>` + a GitHub release.
#
# The 4 library crates inherit the workspace defaults and publish to crates.io.
# The service, driver, and tool crates are managed in release-plz.toml with
# release = true + git_only = true, so release-plz owns their versions, tags, and
# GitHub releases without cargo publish.
#
# release_always = false in release-plz.toml means `release-plz-release` only acts
# on commits that came from a release-plz PR, so an ordinary main push runs the
# release job as a no-op and only refreshes the release PR.

on:
  push:
    branches: [main]
  workflow_dispatch:

# contents: write       - push tags + create GitHub releases
# pull-requests: write  - open/update the release PR
permissions:
  contents: write
  pull-requests: write

# No workflow-level concurrency over release: release-plz warns that a cancelling
# concurrency group can SKIP a release. Concurrency is scoped to the release-pr
# job only (below).

jobs:
  # Publish bumped library crates to crates.io + git tag + GitHub release. Acts
  # only on release-plz bump commits (release_always = false), so a normal main
  # push runs this as a no-op.
  release-plz-release:
    name: release-plz release
    runs-on: ubuntu-latest
    # The `secrets` context is not allowed in step `if:`, so surface presence of
    # the app credential as an env flag the step can gate on.
    env:
      HAS_RELEASE_APP: ${{ secrets.RELEASE_APP_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # App token (preferred) so tags/releases are attributable to the release
      # app; falls back to RELEASE_TOKEN, then the default GITHUB_TOKEN.
      - name: Generate GitHub App token
        id: app-token
        if: env.HAS_RELEASE_APP == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Open/update the release PR on every main push. Runs independently of the
  # release half. Job-level concurrency only here, per the release-plz guidance.
  release-plz-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    # The `secrets` context is not allowed in step `if:`, so surface presence of
    # the app credential as an env flag the step can gate on.
    env:
      HAS_RELEASE_APP: ${{ secrets.RELEASE_APP_ID != '' }}
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks

      - name: Generate GitHub App token
        id: app-token
        if: env.HAS_RELEASE_APP == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-plz (release-pr)
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
