name: release-plz

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Re-run only while a prepared release commit remains at main HEAD
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: framework-train
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare release train
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.train.outputs.publish }}
      version: ${{ steps.train.outputs.version }}
      tag: ${{ steps.train.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Identify train publication
        id: train
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PUBLISH: ${{ inputs.publish }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "phoxal") | .version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          subject="$(git log -1 --pretty=%s)"
          if [[ "$EVENT_NAME" == "push" && "$subject" == chore\(release\)* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$DISPATCH_PUBLISH" == "true" ]]; then
            [[ "$DISPATCH_REF" == "refs/heads/main" ]] || {
              echo "manual publication must run from main" >&2
              exit 1
            }
            [[ "$subject" == chore\(release\)* ]] || {
              echo "manual publication requires a prepared chore(release) commit" >&2
              exit 1
            }
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install source-verification dependencies
        if: steps.train.outputs.publish == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      - name: Verify source train
        if: steps.train.outputs.publish == 'true'
        run: cargo xtask release verify --tag "${{ steps.train.outputs.tag }}"

  build:
    name: package ${{ matrix.target }}
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev musl-tools
          cargo install cargo-auditable --locked
      - name: Install macOS packaging dependencies
        if: runner.os == 'macOS'
        run: cargo install cargo-auditable --locked
      - run: cargo xtask release package --all --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@v6
        with:
          name: train-${{ matrix.target }}
          path: target/xtask/release/*
          if-no-files-found: error

  assets:
    name: package component assets
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo xtask release assets --all
      - uses: actions/upload-artifact@v6
        with:
          name: train-assets
          path: target/xtask/release/*
          if-no-files-found: error

  # GitHub-writing jobs mint a phoxal-release-bot App token
  # (actions/create-github-app-token): events produced with the workflow's own
  # GITHUB_TOKEN do not trigger other workflows, so a release PR created with
  # it never receives the required coherence gate and cannot be merged. The
  # `HAS_RELEASE_APP` guard keeps forks without the App secrets working on the
  # plain GITHUB_TOKEN fallback.
  stage-github:
    name: stage immutable GitHub train
    needs: [prepare, build, assets]
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_APP: ${{ secrets.RELEASE_APP_ID != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/download-artifact@v7
        with:
          pattern: train-*
          path: target/xtask/release
          merge-multiple: true
      - name: Install source-verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      - name: Verify source train
        run: cargo xtask release verify --tag "${{ needs.prepare.outputs.tag }}"
      - name: Verify staged train and produce suite
        run: cargo xtask release suite --tag "${{ needs.prepare.outputs.tag }}"
      - name: Generate GitHub App token
        id: app-token
        if: env.HAS_RELEASE_APP == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Create or resume non-latest draft release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --latest=false --title "$tag" --notes "Framework train $tag"
          fi
          mapfile -t existing_assets < <(
            gh release view "$tag" --json assets --jq '.assets[].name'
          )
          for file in target/xtask/release/* target/xtask/suite.json; do
            name="${file##*/}"
            if printf '%s\n' "${existing_assets[@]}" | grep --fixed-strings --line-regexp --quiet -- "$name"; then
              echo "skipping existing release asset $name"
            else
              gh release upload "$tag" "$file"
            fi
          done

  publish-crates:
    name: publish crates.io train
    needs: [prepare, stage-github]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: release-plz
      # No App token here: release-plz.toml disables git tags/releases, so this
      # job only publishes to crates.io and never writes GitHub state that must
      # trigger other workflows.
      - name: Publish dependency order with phoxal facade last
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: release-plz release

  complete:
    name: confirm registries and complete train
    needs: [prepare, publish-crates]
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_APP: ${{ secrets.RELEASE_APP_ID != '' }}
    steps:
      - name: Wait for exact crates.io train
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          for crate in phoxal-bus phoxal-macros phoxal-api phoxal; do
            found=false
            for attempt in $(seq 1 30); do
              if curl --fail --silent \
                --user-agent "phoxal-release-verifier/1.0 (https://github.com/phoxal/framework)" \
                "https://crates.io/api/v1/crates/$crate/$version" >/dev/null; then
                found=true
                break
              fi
              sleep 10
            done
            [[ "$found" == true ]] || { echo "$crate $version is not observable" >&2; exit 1; }
          done
      - name: Generate GitHub App token
        id: app-token
        if: env.HAS_RELEASE_APP == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Mark GitHub train complete and latest
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ needs.prepare.outputs.tag }}" --draft=false --latest

  release-plz-pr:
    name: prepare grouped release PR
    needs: prepare
    if: needs.prepare.outputs.publish != 'true'
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_APP: ${{ secrets.RELEASE_APP_ID != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: release-plz
      # The release PR must be authored with the App token: authored with the
      # workflow's GITHUB_TOKEN it triggers no `pull_request` workflows, so the
      # required coherence gate never appears and the PR stays unmergeable. On
      # the canonical repository a missing App is therefore a loud failure, not
      # a silent fallback; the GITHUB_TOKEN fallback remains for forks.
      - name: Require the release App on the canonical repository
        if: github.repository == 'phoxal/framework' && env.HAS_RELEASE_APP != 'true'
        run: |
          echo "phoxal/framework must author release PRs with the phoxal-release-bot App;" >&2
          echo "RELEASE_APP_ID/RELEASE_APP_PRIVATE_KEY are missing or not visible to this repo." >&2
          exit 1
      - name: Generate GitHub App token
        id: app-token
        if: env.HAS_RELEASE_APP == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Prepare one grouped train version
        env:
          GIT_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: release-plz release-pr
