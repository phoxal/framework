name: release

# Maintainer-started release entry point. The run carries one exact
# release identity end to end: the version PR it prepared (or the open
# one it deliberately resumed), that PR's merged source revision, the
# exact archives submitted from it, and the published manifest its
# consumer verification resolves against. An unrelated newer index
# entry or movement of main cannot change what this run publishes or
# certifies.
#
# Restartable: reruns resume from the observed registry state — an
# already-published matching version is complete, a conflicting archive
# is an error. Pass skip-version-pr when versions are already bumped
# and merged; the run then publishes from current main and records that
# revision as the release identity.

on:
  workflow_dispatch:
    inputs:
      skip-version-pr:
        description: Versions are already bumped and merged; publish directly.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: framework-release
  cancel-in-progress: false

env:
  REGISTRY_INDEX: https://phoxal.github.io/registry

jobs:
  version-pr:
    name: prepare and merge the version PR
    if: ${{ !inputs.skip-version-pr }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      merge-sha: ${{ steps.merge.outputs.merge-sha }}
      pr-url: ${{ steps.merge.outputs.pr-url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: release-plz
      - name: Generate the release App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Select the release version PR
        id: prepare
        env:
          GIT_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          bash .github/scripts/select-release-pr.sh
          cat "$RUNNER_TEMP/selector-output" >> "$GITHUB_OUTPUT"
      - name: Enable auto-merge on the selected PR and wait
        id: merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          url="${{ steps.prepare.outputs.pr-url }}"
          # Bind the merge to the exact head the selector validated.
          head="${{ steps.prepare.outputs.pr-head }}"
          gh pr merge "$url" --repo "$GITHUB_REPOSITORY" --auto --squash \
            --match-head-commit "$head"
          for _ in $(seq 1 120); do
            state="$(gh pr view "$url" --json state --jq .state)"
            if [ "$state" = "MERGED" ]; then
              sha="$(gh pr view "$url" --json mergeCommit --jq .mergeCommit.oid)"
              {
                echo "merge-sha=$sha"
                echo "pr-url=$url"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo "version PR $url did not merge within 60 minutes" >&2
          exit 1

  publish:
    name: publish dependency-ready groups from the release revision
    needs: version-pr
    if: ${{ always() && (needs.version-pr.result == 'success' || inputs.skip-version-pr) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release-sha: ${{ steps.identity.outputs.release-sha }}
    steps:
      - name: Resolve the exact release revision
        id: identity
        run: |
          if [ "${{ inputs.skip-version-pr }}" = "true" ]; then
            sha="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" HEAD | cut -f1)"
          else
            sha="${{ needs.version-pr.outputs.merge-sha }}"
          fi
          [ -n "$sha" ] || { echo "no release revision recorded" >&2; exit 1; }
          echo "release-sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          # The exact approved release revision, never moving main.
          ref: ${{ steps.identity.outputs.release-sha }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Generate the release App token (registry submissions)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # The App must be installed on phoxal/registry with contents and
          # pull-request write so submissions and registry merging work.
          permission-contents: write
          permission-pull-requests: write
          repositories: phoxal/registry
      - name: Build cargo-phoxal from the release revision
        run: cargo build -p cargo-phoxal --locked
      - name: Submit, admit, and verify each dependency-ready group
        env:
          PHOXAL_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash .github/scripts/release-groups.sh
      - name: Upload the published manifest
        uses: actions/upload-artifact@v4
        with:
          name: published-manifest
          path: published-manifest.json
          if-no-files-found: error

  consumer-verify:
    name: verify a consumer against this exact release
    needs: publish
    if: ${{ always() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Download the published manifest
        uses: actions/download-artifact@v4
        with:
          name: published-manifest
      - name: Install the exact published CLI
        run: |
          set -euo pipefail
          mkdir -p ~/.cargo
          printf '[registries.phoxal]\nindex = "sparse+%s/"\n' "$REGISTRY_INDEX" \
            >> ~/.cargo/config.toml
          version="$(python3 -c "import json; entries = json.load(open('published-manifest.json'))['published']; print(next(e['version'] for e in entries if e['name'] == 'cargo-phoxal'))")"
          echo "installing cargo-phoxal $version from this release"
          cargo install cargo-phoxal --registry phoxal --version "$version" \
            --locked --root "$RUNNER_TEMP/cli"
      - name: Compose and verify a real robot from this release
        run: |
          set -euo pipefail
          # A scratch robot of its own: building inside the framework
          # workspace would collide with its manifest.
          robot="$RUNNER_TEMP/consumer-robot"
          mkdir -p "$robot/src" "$robot/.cargo"
          cd "$robot"
          printf '[registries.phoxal]\nindex = "sparse+%s/"\n' "$REGISTRY_INDEX" \
            > .cargo/config.toml
          cat > build.rs <<'RS'
          fn main() -> Result<(), phoxal::build::Error> {
              phoxal::build::api(phoxal::build::BuildApiConfig::default())
          }
          RS
          cat > src/main.rs <<'RS'
          //! Release consumer robot: proves the published packages compose.
          phoxal::api!();

          mod conversions;
          mod runtime;

          fn main() -> phoxal::Result<()> {
              phoxal::runtime::run(runtime::Brain)
          }
          RS
          cat > src/runtime.rs <<'RS'
          //! A brain whose mission intents are leased setpoint outputs
          //! bound to the selected Motion service's generated ports.
          use phoxal::runtime::{InitContext, Runtime, StepContext};

          #[phoxal::runtime::inputs]
          pub struct Inputs {}

          #[phoxal::runtime::outputs]
          #[derive(Default)]
          pub struct Outputs {}

          #[derive(Clone, Copy, Debug, Default)]
          pub struct Brain;

          #[phoxal::runtime(period_ms = 20, timeout_ms = 100, init_timeout_ms = 1_000)]
          impl Runtime for Brain {
              type Config = ();
              type State = ();
              type Inputs = Inputs;
              type Outputs = Outputs;

              fn init(&self, _ctx: &InitContext, _config: ()) -> phoxal::Result<()> {
                  Ok(())
              }

              fn step(
                  &self,
                  _ctx: &StepContext,
                  state: (),
                  _inputs: &Inputs,
              ) -> phoxal::Result<((), Outputs)> {
                  Ok((state, Outputs::default()))
              }
          }

          #[phoxal::runtime::outputs]
          impl Brain {
              #[phoxal::runtime::outputs::setpoint(
                  port = crate::api::motion::MANUAL.setpoint_port(),
                  max_bytes = 256,
                  valid_for_ms = 100
              )]
              fn manual(&self, _state: &()) -> Option<crate::api::motion::MotionIntent> {
                  None
              }

              #[phoxal::runtime::outputs::setpoint(
                  port = crate::api::motion::AUTONOMOUS.setpoint_port(),
                  max_bytes = 256,
                  valid_for_ms = 100
              )]
              fn autonomous(&self, _state: &()) -> Option<crate::api::motion::MotionIntent> {
                  None
              }
          }
          RS
          cat > src/conversions.rs <<'RS'
          //! Robot-owned conversions between published payloads and the
          //! selected services' private typed expectations.
          use crate::api::motion;
          use crate::api::safety;
          use crate::api::world;
          use crate::api::types::phoxal::motion::v1::ControlMode as PublishedControlMode;
          use crate::api::types::phoxal::private::phoxal_2dservice_2dmotion::phoxal_5fservice_5fmotion::contract as motion_expectation;
          use crate::api::types::phoxal::private::phoxal_2dservice_2dsafety::phoxal_5fservice_5fsafety::contract::ControlMode as ExpectedControlMode;
          use crate::api::types::phoxal::safety::v1 as safety_published;

          impl From<world::WorldBelief> for safety::WorldBelief {
              fn from(source: world::WorldBelief) -> safety::WorldBelief {
                  safety::WorldBelief {
                      frame_id: source.frame_id,
                      x_m: source.x_m,
                      y_m: source.y_m,
                      yaw_rad: source.yaw_rad,
                      confidence: source.confidence,
                      revision: source.revision,
                      available: source.available,
                      oldest_capture_time_nanos: source.oldest_capture_time_nanos,
                  }
              }
          }

          impl From<world::WorldRevision> for safety::WorldRevision {
              fn from(source: world::WorldRevision) -> safety::WorldRevision {
                  safety::WorldRevision {
                      revision: source.revision,
                      available: source.available,
                      oldest_capture_time_nanos: source.oldest_capture_time_nanos,
                  }
              }
          }

          impl From<motion::MotionStatus> for safety::MotionStatus {
              fn from(source: motion::MotionStatus) -> safety::MotionStatus {
                  safety::MotionStatus {
                      mode: match source.mode {
                          PublishedControlMode::Unspecified => ExpectedControlMode::Unspecified,
                          PublishedControlMode::Disarmed => ExpectedControlMode::Disarmed,
                          PublishedControlMode::Manual => ExpectedControlMode::Manual,
                          PublishedControlMode::Autonomous => ExpectedControlMode::Autonomous,
                      },
                      emergency_latched: source.emergency_latched,
                      selected_owner_id: source.selected_owner_id,
                      protective_state_clear: source.protective_state_clear,
                      stopped: source.stopped,
                  }
              }
          }

          impl From<safety::MotionConstraints> for motion::MotionConstraints {
              fn from(source: safety::MotionConstraints) -> motion::MotionConstraints {
                  motion::MotionConstraints {
                      sequence: source.sequence,
                      permission: match source.permission {
                          safety_published::Permission::Unspecified => {
                              motion_expectation::Permission::Unspecified
                          }
                          safety_published::Permission::Clear => {
                              motion_expectation::Permission::Clear
                          }
                          safety_published::Permission::Limited => {
                              motion_expectation::Permission::Limited
                          }
                          safety_published::Permission::Stopped => {
                              motion_expectation::Permission::Stopped
                          }
                      },
                      constraints: source
                          .constraints
                          .into_iter()
                          .map(|constraint| motion_expectation::Constraint {
                              reason: match constraint.reason {
                                  safety_published::ConstraintReason::Unspecified => {
                                      motion_expectation::ConstraintReason::Unspecified
                                  }
                                  safety_published::ConstraintReason::WorldUnavailable => {
                                      motion_expectation::ConstraintReason::WorldUnavailable
                                  }
                                  safety_published::ConstraintReason::LocalizationUncertain => {
                                      motion_expectation::ConstraintReason::LocalizationUncertain
                                  }
                                  safety_published::ConstraintReason::MapUnavailable => {
                                      motion_expectation::ConstraintReason::MapUnavailable
                                  }
                                  safety_published::ConstraintReason::MapBlocked => {
                                      motion_expectation::ConstraintReason::MapBlocked
                                  }
                                  safety_published::ConstraintReason::RangeUnavailable => {
                                      motion_expectation::ConstraintReason::RangeUnavailable
                                  }
                                  safety_published::ConstraintReason::RangeFault => {
                                      motion_expectation::ConstraintReason::RangeFault
                                  }
                                  safety_published::ConstraintReason::ObstacleProximity => {
                                      motion_expectation::ConstraintReason::ObstacleProximity
                                  }
                                  safety_published::ConstraintReason::MotionUnavailable => {
                                      motion_expectation::ConstraintReason::MotionUnavailable
                                  }
                                  safety_published::ConstraintReason::MotionFault => {
                                      motion_expectation::ConstraintReason::MotionFault
                                  }
                              },
                              max_linear_speed_mps: constraint.max_linear_speed_mps,
                              max_angular_speed_radps: constraint.max_angular_speed_radps,
                              observed_value: constraint.observed_value,
                          })
                          .collect(),
                      valid_from_nanos: source.valid_from_nanos,
                      expires_at_nanos: source.expires_at_nanos,
                      oldest_capture_time_nanos: source.oldest_capture_time_nanos,
                  }
              }
          }
          RS
          cat > model.xml <<'RS'
          <mujoco model="release-consumer-robot">
            <worldbody>
              <body name="root" pos="0 0 0">
                <site name="left_wheel_mount" pos="0 0 0"/>
                <site name="front_tof_mount" pos="0 0 1"/>
              </body>
            </worldbody>
          </mujoco>
          RS
          MANIFEST="$GITHUB_WORKSPACE/published-manifest.json" python3 - <<'PY'
          import json
          import os
          entries = {e["name"]: e["version"] for e in
                     json.load(open(os.environ["MANIFEST"]))["published"]}
          services = ["phoxal-service-kinematics", "phoxal-service-world",
                      "phoxal-service-safety", "phoxal-service-motion"]
          components = ["phoxal-component-ddsm115", "phoxal-component-vl53l1x"]
          wanted = ["phoxal", "phoxal-supervisor", "cargo-phoxal"] + services + components
          missing = [name for name in wanted if name not in entries]
          if missing:
              raise SystemExit(f"this release did not publish {missing}")
          phoxal_version = entries["phoxal"]
          open("Cargo.toml", "w").write(
              "[package]\nname = \"release-consumer-robot\"\nversion = \"0.0.0\"\n"
              "edition = \"2024\"\n\n"
              "[dependencies]\n"
              f'phoxal = {{ registry = "phoxal", version = "={phoxal_version}", '
              'default-features = false, features = ["runtime"] }\n'
              f'phoxal-supervisor = {{ registry = "phoxal", '
              f'version = "={entries["phoxal-supervisor"]}" }}\n\n'
              "[build-dependencies]\n"
              f'phoxal = {{ registry = "phoxal", version = "={phoxal_version}", '
              'default-features = false, features = ["build"] }\n'
          )
          def service(name):
              return (f"    {name.split('phoxal-service-')[1]}:\n"
                      f"      source: {{ package: {{ name: {name}, "
                      f"version: {entries[name]} }} }}\n")
          def component(name, instance, mount, driver):
              return (f"    {instance}:\n"
                      f"      source: {{ package: {{ name: {name}, "
                      f"version: {entries[name]} }} }}\n"
                      f"      mount_site: {mount}\n"
                      f"      driver:\n        connection:\n{driver}")
          ddsm = component(
              "phoxal-component-ddsm115", "left_drive", "left_wheel_mount",
              "          type: serial\n          port: /dev/null\n          baud: 115200\n")
          tof = component(
              "phoxal-component-vl53l1x", "front_tof", "front_tof_mount",
              "          type: i2c\n          bus: 1\n          address: 41\n")
          open("robot.yaml", "w").write(
              "schema: phoxal/robot/v0\n"
              "robot:\n"
              "  id: release-consumer-robot\n"
              "  model: model.xml\n"
              "  components:\n" + ddsm + tof +
              "brain: { binary: release-consumer-robot }\n"
              "services:\n"
              + "".join(service(name) for name in services)
              + "connections:\n"
              "  left_drive.actuator: motion.actuators\n"
              "  kinematics.encoders: left_drive.encoder\n"
              "  safety.ranges: front_tof.range\n"
              "  world.pose: kinematics.odometry\n"
              "  safety.world: world.belief\n"
              "  safety.world_revision: world.revision\n"
              "  safety.motion: motion.status\n"
              "  motion.safety: safety.constraints\n"
              "  motion.measurements: kinematics.odometry\n"
              "  motion.manual: brain.manual\n"
              "  motion.autonomous: brain.autonomous\n"
          )
          PY
          echo "composed robot.yaml:"; cat robot.yaml
          "$RUNNER_TEMP/cli/bin/cargo-phoxal" prepare
          "$RUNNER_TEMP/cli/bin/cargo-phoxal" check
          # The scratch project starts without a lockfile; the pinned
          # `=` versions and registry selections bind resolution to
          # this release's manifest.
          cargo build
          echo "resolved phoxal dependency graph:"
          cargo tree --prefix none | grep -E "phoxal" | sort -u
          if cargo tree --prefix none | grep -q "path+file"; then
              echo "local path overlay leaked into the consumer graph" >&2
              exit 1
          fi
      - name: Record the certified release identity
        run: |
          {
            echo "### Release consumer verification"
            echo "Release revision: \`${{ needs.publish.outputs.release-sha }}\`"
            echo "Published manifest:"
            python3 -c "import json; entries = json.load(open('published-manifest.json'))['published']; [print('- ' + e['name'] + ' ' + e['version'] + ' sha256 ' + e['sha256']) for e in entries]"
            echo "The consumer robot composed the published kinematics, world,"
            echo "safety, and motion services at the versions above with a"
            echo "setpoint-output brain and robot-owned conversions; the"
            echo "published CLI prepared and checked its compiled contracts"
            echo "and the brain built against the generated API, with no"
            echo "local overlays."
          } >> "$GITHUB_STEP_SUMMARY"
