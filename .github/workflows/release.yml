name: release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  plan:
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          # Caller-owned gate + version. The release-prep branch
          # (release/vX.Y.Z) carries the intended version; the reusable
          # release workflow verifies it against Cargo.toml on the merged commit
          # before tagging/publishing.
          echo "version=${HEAD_REF#release/v}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - asset
          - drive
          - explore
          - follow
          - frame
          - joint
          - localize
          - map
          - mission
          - motion
          - odometry
          - perception
          - plan
          - power
          - presence
          - safety
          - video
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            short: amd64
            triple: x86_64-unknown-linux-gnu
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            short: arm64
            triple: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:buildx-stable-1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push per-platform image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.runtime
          platforms: ${{ matrix.platform }}
          build-args: |
            RUNTIME_NAME=${{ matrix.runtime }}
          tags: ghcr.io/phoxal/runtime-${{ matrix.runtime }}:${{ needs.plan.outputs.version }}-${{ matrix.short }}
          push: true
          cache-from: type=gha,scope=runtime-${{ matrix.runtime }}-${{ matrix.short }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.runtime }}-${{ matrix.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/phoxal/framework
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=phoxal-runtime-${{ matrix.runtime }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      # Reuse the binary we just compiled into the image instead of building it
      # again natively - `docker cp` reads the container filesystem without
      # running it, so no recompile. macOS is handled separately below.
      - name: Extract release binary from image
        run: |
          set -euo pipefail
          v=${{ needs.plan.outputs.version }}
          image=ghcr.io/phoxal/runtime-${{ matrix.runtime }}:${v}-${{ matrix.short }}
          bin=phoxal-runtime-${{ matrix.runtime }}
          mkdir -p dist
          cid=$(docker create "${image}")
          docker cp "${cid}:/usr/local/bin/runtime" "${bin}"
          docker rm "${cid}" >/dev/null
          tar -czf "dist/${bin}-${v}-${{ matrix.triple }}.tar.gz" "${bin}"

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-binaries-${{ matrix.runtime }}-${{ matrix.short }}
          path: dist/*.tar.gz

  # Only macOS needs a native build - Docker can't target Darwin, so the macOS
  # tarball can't be extracted from the runtime images. The two Linux tarballs
  # are extracted from those images in the `build` job above.
  build-macos-binaries:
    needs: plan
    runs-on: macos-14
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ env.TARGET }}

      - name: Build release binaries
        run: |
          set -euo pipefail
          runtimes=(asset drive explore follow frame joint localize map mission motion odometry perception plan power presence safety video)
          args=()
          for r in "${runtimes[@]}"; do
            args+=(--bin "phoxal-runtime-${r}")
          done
          cargo build --release --target "${TARGET}" "${args[@]}"

      - name: Package each runtime
        run: |
          set -euo pipefail
          mkdir -p dist
          for r in asset drive explore follow frame joint localize map mission motion odometry perception plan power presence safety video; do
            bin=target/${TARGET}/release/phoxal-runtime-${r}
            tar -czf "dist/phoxal-runtime-${r}-${{ needs.plan.outputs.version }}-${TARGET}.tar.gz" \
              -C "$(dirname "$bin")" "$(basename "$bin")"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-binaries-${{ env.TARGET }}
          path: dist/*.tar.gz

  # The Webots controller + supervisor are HOST-NATIVE binaries: they link the
  # Webots controller libraries and run next to a host Webots GUI, so unlike the
  # 17 platform runtimes they are not distroless images and cannot be extracted
  # from one. They live in this workspace (so they build against the in-tree
  # `phoxal` and inherit this version), and ship in the same release on the same
  # version train. Targets are host-only: no linux/arm64 — Cyberbotics publishes
  # no Linux ARM Webots build, so webots-rs would have nothing to link against.
  build-simulator:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-apple-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    env:
      WEBOTS_VERSION: R2025a
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          # No build cache for this job: a restored `target/` could carry a
          # prior stub-linked `webots-rs` and stop its build script from
          # rerunning, which would defeat the link assertion below.
          cache: false

      # Install Webots under $HOME (not /opt): actions/cache restores as the
      # runner user, so a user-owned path round-trips cleanly; /opt would need
      # sudo on restore.
      - name: Cache Webots SDK (Linux)
        if: runner.os == 'Linux'
        id: cache-webots
        uses: actions/cache@v4
        with:
          path: ~/webots
          key: webots-${{ env.WEBOTS_VERSION }}-${{ matrix.target }}

      - name: Install Webots SDK (Linux)
        if: runner.os == 'Linux' && steps.cache-webots.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wget ca-certificates bzip2 libgl1 libglu1-mesa libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1
          tmp=$(mktemp -d)
          wget -q -O "${tmp}/webots.tar.bz2" \
            "https://github.com/cyberbotics/webots/releases/download/${WEBOTS_VERSION}/webots-${WEBOTS_VERSION}-x86-64.tar.bz2"
          # tarball unpacks to a top-level `webots/` dir → $HOME/webots
          tar -xjf "${tmp}/webots.tar.bz2" -C "${HOME}"
          rm -rf "${tmp}"

      - name: Configure WEBOTS_HOME (Linux)
        if: runner.os == 'Linux'
        run: |
          # webots-rs build script reads WEBOTS_HOME to locate libController et al.
          echo "WEBOTS_HOME=${HOME}/webots" >> "$GITHUB_ENV"
          echo "${HOME}/webots/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=${HOME}/webots/lib/controller${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      # NOTE: the previous (separate-repo) simulator release built the macOS
      # tarball WITHOUT installing Webots, so its Darwin binaries were almost
      # certainly stub-linked. We install Webots here and the link assertion
      # below makes a stub fallback a hard failure. The exact dmg layout /
      # WEBOTS_HOME the webots-rs build script wants on Darwin needs one real
      # CI run to confirm.
      - name: Install Webots (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          curl -fsSL -o "${tmp}/webots.dmg" \
            "https://github.com/cyberbotics/webots/releases/download/${WEBOTS_VERSION}/webots-${WEBOTS_VERSION}.dmg"
          hdiutil attach -nobrowse -mountpoint "${tmp}/mnt" "${tmp}/webots.dmg"
          cp -R "${tmp}/mnt/Webots.app" /Applications/
          hdiutil detach "${tmp}/mnt" || true
          rm -rf "${tmp}"
          echo "WEBOTS_HOME=/Applications/Webots.app" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=/Applications/Webots.app/Contents/lib/controller${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Build controller + supervisor
        run: |
          set -euo pipefail
          cargo build --release --target "${{ matrix.target }}" \
            --bin phoxal-simulator-webots-controller \
            --bin phoxal-simulator-webots-supervisor

      - name: Assert Webots was really linked (refuse to ship a stub build)
        run: |
          set -euo pipefail
          # webots-rs links a real Webots runtime by emitting
          # `cargo:rustc-link-lib=Controller`, so a real build produces a binary
          # with a libController dynamic dependency; a stub fallback (no Webots
          # found) links nothing. We can't grep the build script's cargo:warning
          # — Cargo hides build-script warnings from registry deps — so inspect
          # the actual linkage. A stub-linked controller compiles fine but cannot
          # drive a real Webots, so never publish one.
          bin="target/${{ matrix.target }}/release/phoxal-simulator-webots-controller"
          if [ "${{ runner.os }}" = "macOS" ]; then
            deps=$(otool -L "$bin")
          else
            deps=$(readelf -d "$bin" | grep NEEDED || true)
          fi
          echo "$deps"
          if echo "$deps" | grep -qi "Controller"; then
            echo "OK: controller links libController — real Webots runtime for ${{ matrix.target }}."
          else
            echo "::error::controller binary does NOT link libController — webots-rs stub-linked for ${{ matrix.target }} (Webots SDK not found at build time). Refusing to publish a stub-linked simulator binary."
            echo "WEBOTS_HOME=${WEBOTS_HOME:-unset}; controller lib dir:"
            ls -la "${WEBOTS_HOME:-/nonexistent}/lib/controller" 2>&1 || true
            exit 1
          fi

      - name: Package
        run: |
          set -euo pipefail
          v=${{ needs.plan.outputs.version }}
          t=${{ matrix.target }}
          mkdir -p dist/package
          cp "target/${t}/release/phoxal-simulator-webots-controller" \
             "dist/package/phoxal-simulator-webots-controller-${t}"
          cp "target/${t}/release/phoxal-simulator-webots-supervisor" \
             "dist/package/phoxal-simulator-webots-supervisor-${t}"
          tar -czf "dist/phoxal-simulator-${v}-${t}.tar.gz" \
            -C dist/package \
            "phoxal-simulator-webots-controller-${t}" \
            "phoxal-simulator-webots-supervisor-${t}"

      - uses: actions/upload-artifact@v4
        with:
          name: simulator-binaries-${{ matrix.target }}
          path: dist/*.tar.gz

  manifest:
    needs: [plan, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - asset
          - drive
          - explore
          - follow
          - frame
          - joint
          - localize
          - map
          - mission
          - motion
          - odometry
          - perception
          - plan
          - power
          - presence
          - safety
          - video
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          set -euo pipefail
          v=${{ needs.plan.outputs.version }}
          name=ghcr.io/phoxal/runtime-${{ matrix.runtime }}
          docker buildx imagetools create -t "${name}:${v}" \
            "${name}:${v}-amd64" "${name}:${v}-arm64"
          docker buildx imagetools create -t "${name}:latest" \
            "${name}:${v}-amd64" "${name}:${v}-arm64"

  # Repo-specific release notes: augment CHANGELOG.md with the runtime image +
  # binary lists, then hand it to the shared release workflow as an artifact.
  notes:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Create release notes
        run: |
          set -euo pipefail
          v=${{ needs.plan.outputs.version }}
          binary_targets="x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin"
          cp CHANGELOG.md release-notes.md
          {
            echo ""
            echo "## Runtime images @ v${v}"
            for r in asset drive explore follow frame joint localize map mission motion odometry perception plan power presence safety video; do
              echo "- \`ghcr.io/phoxal/runtime-${r}:${v}\`"
            done
            echo ""
            echo "## Runtime binaries @ v${v}"
            echo ""
            echo "Each runtime is also published as a standalone binary for systemd-style deployment:"
            for r in asset drive explore follow frame joint localize map mission motion odometry perception plan power presence safety video; do
              for target in ${binary_targets}; do
                echo "- \`phoxal-runtime-${r}-${v}-${target}.tar.gz\`"
              done
            done
            echo ""
            echo "## Simulator (Webots) binaries @ v${v}"
            echo ""
            echo "Host-native Webots controller + supervisor, version-matched to the runtimes (no Linux ARM — Cyberbotics ships no Linux ARM Webots build):"
            for target in x86_64-unknown-linux-gnu aarch64-apple-darwin; do
              echo "- \`phoxal-simulator-${v}-${target}.tar.gz\`"
            done
          } >> release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  # Shared release seam: verify version, create the vX.Y.Z tag (git push here),
  # and create-or-update the GitHub Release from the uploaded artifacts.
  publish:
    needs: [plan, manifest, build, build-macos-binaries, build-simulator, notes]
    uses: phoxal/.github/.github/workflows/rust-github-release.yml@main
    secrets: inherit
    with:
      version: ${{ needs.plan.outputs.version }}
      notes-file: dist/release-notes.md
      asset-pattern: dist/*.tar.gz
      tag-via: push

  # Publish the `phoxal` library crate to crates.io at the release version.
  # Runs after the release is verified + tagged (the `publish` job). The runtime
  # binaries (publish = false) ship as GHCR images above, not as crates.
  publish-crate:
    needs: [plan, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install native build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake nasm pkg-config

      - name: Publish phoxal to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p phoxal
