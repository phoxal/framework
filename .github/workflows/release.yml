name: release

# Triggered by merging a `release/vX.Y.Z` PR into main (the convention the
# release-prep workflow produces). The merged head ref carries the intended
# version; the `tag` job verifies it against Cargo.toml before tagging, then:
#   - the library crates (`phoxal` + `phoxal-api` + `phoxal-bus` + `phoxal-macros`) are published to crates.io;
#   - each official runtime is published as an API-version-scoped multi-arch GHCR
#     image (`ghcr.io/phoxal/runtime-<name>:<api_version>-stable` and the immutable
#     `:<api_version>-v<version>`), the pull targets `phoxal-cli` resolves.
#
# Image tags are an API-version-scoped lookup convention (api-version-availability):
# the tag's api_version is the runtime's compiled-in API version, and `phoxal-cli
# check` re-proves it by running `emit-apis` on the resolved image. Artifact
# (semver) versions stay independent of the shared api_version axis.
#
# NOTE: per-target standalone binary tarballs, the Webots simulator, and the joypad
# tool (all removed in the greenfield rewrite) are not published here. Re-adding the
# binary tarballs is future release-engineering work.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  packages: write
  # `build-images` exports a Docker layer cache via `cache-to: type=gha`, which
  # needs the Actions cache write scope. Without it GitHub denies the cache write
  # ("token has no writable scopes") and `docker buildx` treats that as fatal.
  actions: write

jobs:
  plan:
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          # The release-prep branch (release/vX.Y.Z) carries the intended version.
          echo "version=${HEAD_REF#release/v}" >> "$GITHUB_OUTPUT"

  # Tag the release ONLY after every pre-release gate passes (preflight -> tag
  # -> publish). `build-images` builds + validates the publishable artifacts
  # (emit-apis per arch) before the tag exists, so a failing gate can never
  # leave a pushed `vX.Y.Z` tag behind. Publishing (crates.io + the multi-arch
  # GHCR manifests) then hangs off `tag`.
  tag:
    needs: [plan, catalog-drift, official-set-fixture, build-images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Verify version matches Cargo.toml and create the tag
        run: |
          set -euo pipefail
          v="${{ needs.plan.outputs.version }}"
          cargo_v=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "${v}" != "${cargo_v}" ]; then
            echo "::error::release ref v${v} does not match workspace version ${cargo_v}"
            exit 1
          fi
          if git rev-parse "v${v}" >/dev/null 2>&1; then
            existing=$(git rev-list -n1 "v${v}")
            if [ "${existing}" != "${{ github.event.pull_request.merge_commit_sha }}" ]; then
              echo "::error::tag v${v} already exists at ${existing}, not the merge commit ${{ github.event.pull_request.merge_commit_sha }}"
              exit 1
            fi
            echo "tag v${v} already points at the merge commit; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${v}" -m "v${v}"
          git push origin "v${v}"

  catalog-drift:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: actions/checkout@v4
        with:
          repository: phoxal/phoxal-cli
          path: phoxal-cli

      - name: Check official runtime catalog drift
        run: scripts/check-catalog-drift.sh phoxal-cli/src/catalog.rs

  official-set-fixture:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install native build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake nasm pkg-config

      - name: Check official-set fixture topology
        run: cargo test -p phoxal --test official_set_topology -- --nocapture

  # Publish the library crates to crates.io. The runtime crates are `publish =
  # false` (they ship as deployables, not libraries); only `phoxal` and its
  # `phoxal-api` / `phoxal-bus` / `phoxal-macros` dependencies are published. Order
  # matters: `phoxal` depends on all three by version, and `phoxal-api` depends on
  # `phoxal-bus` / `phoxal-macros`, so each must land on the index before any crate
  # that resolves it.
  publish-crate:
    needs: [plan, tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install native build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake nasm pkg-config

      # Idempotent publish: skip a crate whose exact version is already on the
      # index, so re-running the job after a partial failure (e.g. phoxal-macros
      # uploaded but phoxal failed) does not abort on "crate already exists".
      - name: Publish library crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          v="${{ needs.plan.outputs.version }}"

          already_published() {
            # Sparse-index lookup (crate names here are >= 4 chars → ab/cd/name).
            local crate="$1" prefix="${1:0:2}/${1:2:2}"
            curl -fsSL -A "phoxal-release-ci (https://github.com/phoxal/framework)" \
              "https://index.crates.io/${prefix}/${crate}" 2>/dev/null \
              | grep -q "\"vers\":\"${v}\""
          }

          publish() {
            local crate="$1"
            if already_published "${crate}"; then
              echo "${crate} ${v} already on crates.io; skipping."
            else
              # `cargo publish` polls the index until the new version is queryable
              # before returning, so the next crate can resolve it by version.
              cargo publish -p "${crate}"
            fi
          }

          # Order matters: phoxal depends on phoxal-api, phoxal-bus, and
          # phoxal-macros by version, and phoxal-api depends on phoxal-bus and
          # phoxal-macros, so each must land on the index before any crate that
          # resolves it. phoxal-bus and phoxal-macros depend on neither each other
          # nor any phoxal crate, so they go first; then phoxal-api; then phoxal.
          publish phoxal-bus
          publish phoxal-macros
          publish phoxal-api
          publish phoxal

  # Build each official runtime as a per-architecture image and push it under an
  # intermediate `<api>-v<version>-<arch>` tag. The `manifest` job then stitches the
  # two arches into the API-scoped multi-arch tags. The (runtime -> api_version) map
  # is a tagging convention; `phoxal-cli check` re-proves it via `emit-apis`.
  # A pre-release gate: build every official runtime image per arch and validate
  # its `emit-apis` document. Runs BEFORE `tag` so a bad artifact blocks tagging.
  # Only intermediate `<api>-v<version>-<arch>` tags are pushed here; the public
  # release manifests are stitched by `manifest` after the tag exists.
  build-images:
    needs: [plan, catalog-drift, official-set-fixture]
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - { name: asset, api: y2026_1 }
          - { name: battery, api: y2026_1 }
          - { name: drive, api: y2026_1 }
          - { name: explore, api: y2026_1 }
          - { name: follow, api: y2026_1 }
          - { name: frame, api: y2026_1 }
          - { name: joint, api: y2026_1 }
          - { name: localize, api: y2026_1 }
          - { name: map, api: y2026_1 }
          - { name: mission, api: y2026_1 }
          - { name: motion, api: y2026_1 }
          - { name: odometry, api: y2026_1 }
          - { name: perception, api: y2026_1 }
          - { name: plan, api: y2026_1 }
          - { name: power, api: y2026_1 }
          - { name: presence, api: y2026_1 }
          - { name: safety, api: y2026_1 }
          - { name: video, api: y2026_1 }
        platform:
          - { docker: linux/amd64, runner: ubuntu-latest, short: amd64 }
          - { docker: linux/arm64, runner: ubuntu-24.04-arm, short: arm64 }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:buildx-stable-1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push per-arch runtime image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.runtime
          platforms: ${{ matrix.platform.docker }}
          build-args: |
            RUNTIME_NAME=${{ matrix.runtime.name }}
          tags: ghcr.io/phoxal/runtime-${{ matrix.runtime.name }}:${{ matrix.runtime.api }}-v${{ needs.plan.outputs.version }}-${{ matrix.platform.short }}
          push: true
          cache-from: type=gha,scope=runtime-${{ matrix.runtime.name }}-${{ matrix.platform.short }}
          # `ignore-error=true` keeps a cache-export hiccup (denied scope, quota,
          # transient GHA cache outage) from failing the image build + push.
          cache-to: type=gha,mode=max,ignore-error=true,scope=runtime-${{ matrix.runtime.name }}-${{ matrix.platform.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/phoxal/framework
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=phoxal-runtime-${{ matrix.runtime.name }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Verify emit-apis for per-arch image
        run: |
          set -euo pipefail
          v="${{ needs.plan.outputs.version }}"
          api="${{ matrix.runtime.api }}"
          arch="${{ matrix.platform.short }}"
          name="${{ matrix.runtime.name }}"
          ref="ghcr.io/phoxal/runtime-${name}:${api}-v${v}-${arch}"
          out="emit-apis-${name}-${arch}.json"
          docker run --rm "${ref}" emit-apis > "${out}"
          # Validate the whole frozen document (D50/D57), not just api_version:
          # schema id, artifact identity, the bus_abi constant, and that every
          # required contract agrees with the runtime's api_version. A drift here
          # blocks tagging (this job is a pre-release gate).
          EXPECTED_API="${api}" EXPECTED_NAME="${name}" OUT="${out}" \
          SORTED="emit-apis-${name}-${arch}.sorted.json" python3 - <<'PY'
          import json
          import os
          import sys

          out = os.environ["OUT"]
          expected_api = os.environ["EXPECTED_API"]
          expected_name = os.environ["EXPECTED_NAME"]
          errors = []

          with open(out, "r", encoding="utf-8") as fh:
              metadata = json.load(fh)

          schema = metadata.get("schema")
          if schema != "phoxal.emit-apis/v0":
              errors.append(f"schema is {schema!r}, expected 'phoxal.emit-apis/v0'")

          artifact = metadata.get("artifact") or {}
          if artifact.get("id") != expected_name:
              errors.append(
                  f"artifact.id is {artifact.get('id')!r}, expected {expected_name!r}"
              )

          api_version = metadata.get("api_version")
          if api_version != expected_api:
              errors.append(
                  f"api_version is {api_version!r}, expected {expected_api!r}"
              )

          bus_abi = metadata.get("bus_abi")
          if bus_abi != "phoxal-bus/v0":
              errors.append(f"bus_abi is {bus_abi!r}, expected 'phoxal-bus/v0'")

          contracts = metadata.get("required_contracts")
          if not isinstance(contracts, list) or not contracts:
              errors.append("required_contracts must be a non-empty list")
          else:
              for i, contract in enumerate(contracts):
                  cav = contract.get("api_version")
                  if cav != api_version:
                      errors.append(
                          f"required_contracts[{i}] api_version {cav!r} "
                          f"!= runtime api_version {api_version!r}"
                      )

          config_schema = metadata.get("config_schema")
          if not isinstance(config_schema, dict):
              errors.append("config_schema must be a JSON object")

          if errors:
              for err in errors:
                  print(f"::error::{out}: {err}")
              sys.exit(1)

          with open(os.environ["SORTED"], "w", encoding="utf-8") as fh:
              json.dump(metadata, fh, sort_keys=True, separators=(",", ":"))
              fh.write("\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: emit-apis-${{ matrix.runtime.name }}-${{ matrix.platform.short }}
          path: |
            emit-apis-${{ matrix.runtime.name }}-${{ matrix.platform.short }}.json
            emit-apis-${{ matrix.runtime.name }}-${{ matrix.platform.short }}.sorted.json

  # Stitch the per-arch images into the two API-scoped multi-arch tag classes:
  # the immutable `:<api>-v<version>` and the moving `:<api>-stable` channel.
  manifest:
    needs: [plan, tag, build-images]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - { name: asset, api: y2026_1 }
          - { name: battery, api: y2026_1 }
          - { name: drive, api: y2026_1 }
          - { name: explore, api: y2026_1 }
          - { name: follow, api: y2026_1 }
          - { name: frame, api: y2026_1 }
          - { name: joint, api: y2026_1 }
          - { name: localize, api: y2026_1 }
          - { name: map, api: y2026_1 }
          - { name: mission, api: y2026_1 }
          - { name: motion, api: y2026_1 }
          - { name: odometry, api: y2026_1 }
          - { name: perception, api: y2026_1 }
          - { name: plan, api: y2026_1 }
          - { name: power, api: y2026_1 }
          - { name: presence, api: y2026_1 }
          - { name: safety, api: y2026_1 }
          - { name: video, api: y2026_1 }
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: emit-apis-${{ matrix.runtime.name }}-*
          path: emit-apis
          merge-multiple: true

      - name: Verify emit-apis metadata is arch-independent
        run: |
          set -euo pipefail
          name="${{ matrix.runtime.name }}"
          diff -u \
            "emit-apis/emit-apis-${name}-amd64.sorted.json" \
            "emit-apis/emit-apis-${name}-arm64.sorted.json"

      - name: Create API-scoped multi-arch manifests
        run: |
          set -euo pipefail
          v="${{ needs.plan.outputs.version }}"
          api="${{ matrix.runtime.api }}"
          name="ghcr.io/phoxal/runtime-${{ matrix.runtime.name }}"
          amd64="${name}:${api}-v${v}-amd64"
          arm64="${name}:${api}-v${v}-arm64"
          # Immutable artifact tag (api_version + this artifact's version).
          docker buildx imagetools create -t "${name}:${api}-v${v}" "${amd64}" "${arm64}"
          # Moving stable channel for this api_version.
          docker buildx imagetools create -t "${name}:${api}-stable" "${amd64}" "${arm64}"

      - name: Inspect API-scoped multi-arch manifest
        run: |
          set -euo pipefail
          v="${{ needs.plan.outputs.version }}"
          api="${{ matrix.runtime.api }}"
          name="ghcr.io/phoxal/runtime-${{ matrix.runtime.name }}"
          docker buildx imagetools inspect "${name}:${api}-v${v}"
