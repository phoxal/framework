name: Frozen API version guard

# Blocks a PR (in particular release-plz's `chore(release)` PR) if a released
# (non-`preview`) `version vN { … }` span in `phoxal-api/src/lib.rs`
# changed since the commit recorded in crates.io's published phoxal-api crate.
# A released contract type is immutable; a changed contract is minted fresh in
# the active preview version instead.
#
# SECURITY - why this is not a "Pwn Request":
# `pull_request_target` runs with the BASE repo's workflow + the elevated
# base-repo `GITHUB_TOKEN`, and fires on release-plz's bot PR regardless of
# author (the reason it is used instead of `pull_request`). The danger with
# that trigger is executing PR-head code (build.rs, proc-macros, the xtask
# binary itself) under that token - on a public repo that leaks the token.
# This job avoids it entirely: it does NOT check out the PR head. The default
# checkout is the trusted BASE ref, so the `cargo xtask` that compiles and runs
# is the base repo's own code. The PR's candidate `phoxal-api/src/lib.rs` is
# fetched and read ONLY as text (`git show <head-sha>:…`, via `--head-sha`) -
# never checked out over the working tree, never fed to rustc. `pr-title-check`
# gets away with `pull_request_target` because it only reads PR *metadata*;
# this job earns the same trigger by only reading PR *file content as data*.
#
on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  contents: read

jobs:
  frozen-version-check:
    runs-on: ubuntu-latest
    steps:
      # Default checkout: the trusted BASE ref (NOT the PR head). Full history
      # makes the registry crate's recorded source commit available to git show.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Shares the xtask-only build cache with release-plz.yml's
      # release/assets/catalog jobs. This job runs on every PR in the
      # base-branch cache scope, so it also keeps that cache warm for the
      # release wave.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: xtask

      # Make the PR head commit available locally so `git show <head-sha>:…` can
      # read the candidate file as text. This fetches the object only - it does
      # NOT check it out or run anything from it.
      - name: Fetch PR head commit (read-only)
        run: git fetch --no-tags origin ${{ github.event.pull_request.head.sha }}

      - name: Check frozen API versions are unchanged
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -er '.packages[] | select(.name == "phoxal-api") | .version')"
          baseline_sha="$(
            curl --proto '=https' --tlsv1.2 -fsSL \
              "https://static.crates.io/crates/phoxal-api/phoxal-api-${version}.crate" \
              | tar -xzOf - "phoxal-api-${version}/.cargo_vcs_info.json" \
              | jq -er '.git.sha1'
          )"
          cargo xtask api frozen-version-check \
            --baseline-sha "$baseline_sha" \
            --head-sha "$HEAD_SHA"
