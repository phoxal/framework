name: Coherence gate

# Deployment coherence gate for the release PR. Blocks release-plz's
# `chore(release)` PR when the would-be-released whole official set is
# incoherent: a contract moved to a new API version on one side while its
# counterpart was not ("pub/sub - per-participant overlap" and
# "serve/ask - every ask matched").
#
# TRIGGER - why plain `pull_request`, not `pull_request_target`:
# this gate must BUILD PR-head code (proc-macros, build scripts) to extract
# each changed crate's `#[derive(phoxal::Api)]` metadata section, and
# `pull_request_target` runs with the elevated base-repo `GITHUB_TOKEN` next to
# untrusted head code - not safe for a job that builds that code. Plain
# `pull_request` carries no such elevated token, so building head code here is
# safe. It DOES fire on release-plz's bot PR: that PR is created with the
# phoxal GitHub App's token (the shared `rust-release-plz-pr.yml` authoring
# workflow delegated from `release-plz.yml`), which is verified sufficient to
# trigger `pull_request` workflows - the existing `pr-title-check` check already
# fires on those app-authored PRs today.
#
# SCOPE - enforced only on the release PR: the gate protects the RELEASE, not
# every feature branch. A feature PR may be temporarily incoherent mid-migration
# (a rolling contract-version move spans several PRs), so only release-plz's
# tooling-controlled `release-plz-*` branch pays the cost of a full workspace
# host build; every other PR exits 0 immediately without building anything.
#
# NOTE for repo admins: this workflow only makes the check appear on PRs - it
# does not itself make the check REQUIRED. Add "Coherence gate / coherence-check"
# to the `chore(release)`-affecting branch protection's required-status-checks
# list by hand (GitHub has no API/workflow surface to self-register a required
# check); until that's done, this job runs and reports but a failure will not
# block the merge button.

on:
  pull_request:

# The workspace builds on a bare runner by design; a system package appears
# here only together with the crate that needs it. tool-joypad's gilrs gamepad
# backend (libudev-sys) is why `coherence-check` needs libudev-dev to host-build
# the whole official set (mirrors `ci.yml`'s `rust-ci.yml` system-packages).
jobs:
  coherence-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether this is the release PR
        id: release-pr
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REF" == release-plz-* ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "release PR detected - coherence will be enforced"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "not the release PR - coherence is enforced at release only; skipping"
          fi

      - uses: actions/checkout@v6
        if: steps.release-pr.outputs.is_release == 'true'

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: steps.release-pr.outputs.is_release == 'true'

      - name: Install joypad Linux dependency
        if: steps.release-pr.outputs.is_release == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev

      - name: Run coherence check over the whole official set
        if: steps.release-pr.outputs.is_release == 'true'
        run: cargo xtask coherence-check
