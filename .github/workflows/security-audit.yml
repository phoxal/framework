# Audits Cargo.lock against the RUSTSEC advisory database.
#
# The daily schedule is the important trigger: advisories are published
# independently of pushes, so a lockfile that was clean yesterday can be
# vulnerable today without any commit landing.
#
# Ignored advisories live in .cargo/audit.toml; each entry must carry a
# justification and a removal condition.
name: security-audit

on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - .cargo/audit.toml
      - .github/workflows/security-audit.yml
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - .cargo/audit.toml
      - .github/workflows/security-audit.yml
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Cargo.lock against RUSTSEC advisories
        # Yanked transitive versions cannot be ignored individually by
        # cargo-audit. The current spin/stabby entries come from zenoh 1.9 and
        # have no advisory; all advisory classes remain warnings-as-errors.
        run: cargo audit --deny warnings --no-yanked

      - name: Verify the exact yanked transitive allowlist
        # cargo-audit can disable yanked checks only as a class, so compare its
        # machine report against the three Zenoh 1.9 transitives reviewed here.
        # Any newly yanked crate or version fails until it is investigated.
        run: |
          cargo audit --json |
            jq -e '
              [.warnings.yanked[].package | "\(.name)@\(.version)"] | sort
              == ["spin@0.10.0", "spin@0.9.8", "stabby@72.1.1"]
            '
