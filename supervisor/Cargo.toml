[package]
name = "phoxal-supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["phoxal"]
description = "The Phoxal Framework execution supervisor."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

# The durable headless execution observer. It takes one compiled bundle root and
# nothing else: no mode flags, no driver flags, and no subcommands - `phoxal`
# builds and launches, `phoxal-supervisor` runs the router and reports what it
# sees.
[[bin]]
name = "phoxal-supervisor"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
# The `supervisor` profile compiles `phoxal::supervisor::host` - the whole
# behavior of this executable - plus the embedded Zenoh router it runs. This is
# the only package in the workspace that enables it, and it takes the exact
# train: the supervisor and the library it is the body of are one artifact split
# across two packages.
#
# No participant profile: this process is not a participant, and nothing here
# authors on that surface. The workspace dependency carries
# `default-features = false`, so naming `supervisor` is the whole selection.
phoxal = { workspace = true, features = ["supervisor"] }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
