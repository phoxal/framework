[package]
name = "phoxal-supervisor"
version = "0.68.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["phoxal"]
description = "The Phoxal Framework execution supervisor."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[package.metadata.phoxal]
kind = "application"

[lib]
path = "src/lib.rs"

# The durable headless execution observer. It takes one compiled bundle root and
# nothing else: no mode flags, no driver flags, and no subcommands - `phoxal`
# builds and launches, `phoxal-supervisor` runs the router and reports what it
# sees.
[[bin]]
name = "phoxal-supervisor"
path = "src/main.rs"

[dependencies]
phoxal = { workspace = true, features = ["runtime", "scenario", "session"] }
anyhow.workspace = true
getrandom.workspace = true
clap.workspace = true
ctrlc.workspace = true
libc.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
zenoh = { workspace = true, features = ["unstable"] }

[dev-dependencies]
serial_test.workspace = true

[lints]
workspace = true

[features]
test-fixtures = []

[[bin]]
name = "supervisor-test-runtime"
path = "tests/fixtures/runtime_process.rs"
required-features = ["test-fixtures"]

[[test]]
name = "runtime_process"
path = "tests/runtime_process.rs"
required-features = ["test-fixtures"]

[[test]]
name = "public_session"
path = "tests/public_session.rs"
required-features = ["test-fixtures"]
