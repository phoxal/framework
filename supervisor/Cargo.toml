[package]
name = "phoxal-supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["phoxal"]
description = "The Phoxal Framework execution supervisor."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

# The durable headless execution supervisor. It takes one finalized bundle root
# and nothing else: no mode flags, no driver flags, and no
# subcommands - `phoxal` builds, `phoxal-supervisor` validates and executes.
[[bin]]
name = "phoxal-supervisor"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
# `termination`: SIGTERM and SIGHUP alongside SIGINT, so every "stop" signal
# reaches the one orderly shutdown path.
ctrlc = { workspace = true }
libc = { workspace = true }
phoxal-bundle = { workspace = true }
# `router` opens the embedded Zenoh router in this process.
# The supervisor is the only crate in the workspace that enables it.
phoxal-bus = { workspace = true, features = ["router"] }
phoxal-model = { workspace = true }
phoxal-protocol = { workspace = true }
phoxal-runtime-contract = { workspace = true }
serde = { workspace = true }
system_shutdown = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
