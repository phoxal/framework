[package]
name = "phoxal-manifest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
description = "Phoxal authored manifest readers and project compiler."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
name = "phoxal_manifest"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
phoxal-model = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
urdf-rs = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
jsonschema = { workspace = true, default-features = false }
tempfile = { workspace = true }
