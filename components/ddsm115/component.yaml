schema: phoxal/component/v0
model: { file: model.xml, root_body: mount }
capabilities:
  motor:
    kind: motor
    command: velocity
    # Waveshare DDSM115 published specs:
    # - locked-rotor torque: 2.0 Nm
    # - no-load speed: 200 rpm
    max_torque_nm: 2.0
    max_velocity_radps: 20.943951
    gear_ratio: 1.0
    target:
      kind: actuator
      id: motor
    joint: motor_joint
  encoder:
    kind: encoder
    publish_rate_hz: 50.0
    gear_ratio: 1.0
    encoder_type: incremental
    counts_per_revolution: 4096
    target:
      kind: joint
      id: motor_joint

inputs:
  actuator:
    delivery: latest
    lease:
      valid_for_ms: 100
    max_bytes: 1024
    required: true
    type: phoxal.motion.v1.ActuatorSetpoint

outputs:
  encoder:
    delivery: queue
    max_bytes: 8192
    max_items: 16
    type: phoxal.robotics.v1.EncoderSample
