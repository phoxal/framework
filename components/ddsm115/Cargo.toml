[package]
name = "phoxal-component-ddsm115"
version = "0.68.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["phoxal"]
description = "Phoxal official driver: ddsm115 - wheel hub motor."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
include = ["build.rs", "src/**", "proto/**", "Cargo.toml", "component.yaml", "model.xml", "assets/**"]

[package.metadata.phoxal]
kind = "component"

[lib]
name = "phoxal_component_ddsm115"
path = "src/lib.rs"

[[bin]]
name = "phoxal-component-ddsm115"
path = "src/main.rs"

[dependencies]
phoxal = { workspace = true, features = ["participant"] }
anyhow = { workspace = true }
phoxal-motion = { workspace = true }
phoxal-port = { workspace = true }
phoxal-robotics = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }

[build-dependencies]
phoxal-build = { workspace = true }
phoxal-robotics = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
