[package]
name = "phoxal-component-ddsm115"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["phoxal"]
description = "Phoxal official driver: ddsm115 - wheel hub motor."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "phoxal-component-ddsm115"
path = "src/main.rs"

[dependencies]
phoxal = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
# Tests use only the explicit caller-owned harness; shipped binaries do not
# enable this bypass feature.
phoxal = { workspace = true, features = ["test-harness"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
