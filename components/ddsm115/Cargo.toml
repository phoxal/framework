[package]
name = "phoxal-component-ddsm115"
version = "0.0.0-dev.9"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["phoxal"]
description = "Phoxal official driver: ddsm115 - wheel hub motor."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
include = ["src/**", "build.rs", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "component.yaml", "model.xml", "assets/**"]

[[bin]]
name = "phoxal-component-ddsm115"
path = "src/main.rs"

[build-dependencies]
phoxal = { workspace = true, default-features = false, features = ["build"] }

[dependencies]
phoxal = { workspace = true, default-features = false, features = ["runtime"] }
anyhow.workspace = true
serde.workspace = true

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
