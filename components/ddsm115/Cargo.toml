[package]
name = "phoxal-component-ddsm115"
version = "0.0.0-dev.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["phoxal"]
description = "Phoxal official driver: ddsm115 - wheel hub motor."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
include = ["generated/**", "src/**", "proto/**", "Cargo.toml", "component.yaml", "model.xml", "assets/**"]

[lib]
name = "phoxal_component_ddsm115"
path = "generated/lib.rs"

[[bin]]
name = "phoxal-component-ddsm115"
path = "src/main.rs"
required-features = ["runtime"]

[features]
default = []
runtime = ["phoxal/runtime", "dep:anyhow", "dep:serde", "dep:phoxal-service-motion"]

[dependencies]
phoxal = { workspace = true, default-features = false, features = ["contract", "robotics"] }
anyhow = { workspace = true, optional = true }
phoxal-service-motion = { workspace = true, optional = true }
prost = { workspace = true }
serde = { workspace = true, optional = true }

[package.metadata.phoxal.contract]
protos = ["proto/phoxal/component/ddsm115/v1/ddsm115.proto"]
includes = ["proto"]
generated = "generated"
dependencies = [
    { dependency = "phoxal", proto_package = ".phoxal.robotics.v1", rust_path = "::phoxal::robotics" },
]

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
