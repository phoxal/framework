syntax = "proto3";

package phoxal.component.zed_f9p.v1;

import "google/protobuf/empty.proto";
import "phoxal/port.proto";

message GnssSample {
  double latitude_deg = 1;
  double longitude_deg = 2;
  double altitude_m = 3;
  repeated double position_covariance = 4;
}

service ZedF9p {
  rpc Gnss(google.protobuf.Empty) returns (stream GnssSample) {
    option (phoxal.port.kind) = SAMPLE;
  }
}
