syntax = "proto3";

package phoxal.component.bno085.v1;

import "google/protobuf/empty.proto";
import "phoxal/port.proto";

message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message Quaternion {
  double w = 1;
  double x = 2;
  double y = 3;
  double z = 4;
}

message AccelerometerSample {
  Vector3 linear_acceleration_mps2 = 1;
}

message GyroscopeSample {
  Vector3 angular_velocity_radps = 1;
}

message ImuSample {
  optional Quaternion orientation = 1;
  Vector3 angular_velocity_radps = 2;
  Vector3 linear_acceleration_mps2 = 3;
  string sensor_frame_id = 4;
}

service Bno085 {
  rpc Imu(google.protobuf.Empty) returns (stream ImuSample) {
    option (phoxal.port.kind) = SAMPLE;
  }

  rpc Accelerometer(google.protobuf.Empty) returns (stream AccelerometerSample) {
    option (phoxal.port.kind) = SAMPLE;
  }

  rpc Gyroscope(google.protobuf.Empty) returns (stream GyroscopeSample) {
    option (phoxal.port.kind) = SAMPLE;
  }
}
