syntax = "proto3";

package phoxal.component.bno085.v1;

import "google/protobuf/empty.proto";
import "phoxal/api.proto";
import "phoxal/component/bno085/v1/types.proto";

service Bno085 {
  rpc Imu(google.protobuf.Empty) returns (stream ImuSample) {
  }

  rpc Accelerometer(google.protobuf.Empty) returns (stream AccelerometerSample) {
  }

  rpc Gyroscope(google.protobuf.Empty) returns (stream GyroscopeSample) {
  }
}
