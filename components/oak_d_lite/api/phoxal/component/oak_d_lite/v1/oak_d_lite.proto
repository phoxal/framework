syntax = "proto3";

package phoxal.component.oak_d_lite.v1;

import "google/protobuf/empty.proto";
import "phoxal/api.proto";
import "phoxal/component/oak_d_lite/v1/types.proto";

service OakDLite {
  rpc LeftMono(google.protobuf.Empty) returns (stream CameraFrame) {
  }

  rpc Rgb(google.protobuf.Empty) returns (stream CameraFrame) {
  }

  rpc RightMono(google.protobuf.Empty) returns (stream CameraFrame) {
  }

  rpc Depth(google.protobuf.Empty) returns (stream DepthFrame) {
  }

  rpc Imu(google.protobuf.Empty) returns (stream ImuSample) {
  }

  rpc Accelerometer(google.protobuf.Empty) returns (stream AccelerometerSample) {
  }

  rpc Gyroscope(google.protobuf.Empty) returns (stream GyroscopeSample) {
  }
}
