schema: phoxal/component/v0
model: { file: model.xml, root_body: mount }
capabilities:
  left_mono:
    kind: camera
    mode: mono
    publish_rate_hz: 30.0
    width_px: 640
    height_px: 400
    field_of_view_rad: 1.272271
    target:
      kind: camera
      id: left_mono
  rgb:
    kind: camera
    mode: rgb
    publish_rate_hz: 30.0
    width_px: 640
    height_px: 480
    field_of_view_rad: 1.204277
    target:
      kind: camera
      id: rgb
  right_mono:
    kind: camera
    mode: mono
    publish_rate_hz: 30.0
    width_px: 640
    height_px: 400
    field_of_view_rad: 1.272271
    target:
      kind: camera
      id: right_mono
  depth:
    kind: depth
    publish_rate_hz: 30.0
    width_px: 640
    height_px: 400
    field_of_view_rad: 1.272271
    # Luxonis documents ~40 cm MinZ for 400P passive stereo and ~12 m ideal
    # long-range depth on OAK-D Lite.
    min_range_m: 0.4
    max_range_m: 12.0
    target:
      kind: camera
      id: depth
  imu:
    kind: imu
    publish_rate_hz: 100.0
    target:
      kind: site
      id: imu_site
    signals:
      orientation: imu_orientation
      acceleration: accelerometer
      angular_velocity: gyroscope
  accelerometer:
    kind: accelerometer
    publish_rate_hz: 100.0
    target:
      kind: site
      id: imu_site
    signals:
      acceleration: accelerometer
  gyroscope:
    kind: gyroscope
    publish_rate_hz: 100.0
    target:
      kind: site
      id: imu_site
    signals:
      angular_velocity: gyroscope

outputs:
  accelerometer:
    delivery: queue
    max_bytes: 8192
    max_items: 16
    type: phoxal.component.oak_d_lite.v1.AccelerometerSample
  depth:
    delivery: queue
    max_bytes: 8388608
    max_items: 4
    type: phoxal.component.oak_d_lite.v1.DepthFrame
  gyroscope:
    delivery: queue
    max_bytes: 8192
    max_items: 16
    type: phoxal.component.oak_d_lite.v1.GyroscopeSample
  imu:
    delivery: queue
    max_bytes: 16384
    max_items: 16
    type: phoxal.component.oak_d_lite.v1.ImuSample
  left_mono:
    delivery: queue
    max_bytes: 8388608
    max_items: 4
    type: phoxal.component.oak_d_lite.v1.CameraFrame
  rgb:
    delivery: queue
    max_bytes: 8388608
    max_items: 4
    type: phoxal.component.oak_d_lite.v1.CameraFrame
  right_mono:
    delivery: queue
    max_bytes: 8388608
    max_items: 4
    type: phoxal.component.oak_d_lite.v1.CameraFrame
