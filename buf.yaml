version: v2

modules:
  - path: crates/build/proto
    lint:
      use:
        - STANDARD
      except:
        - ENUM_VALUE_PREFIX
        - PACKAGE_DIRECTORY_MATCH
        - PACKAGE_VERSION_SUFFIX
  - path: crates/robotics/proto
  - path: phoxal/proto
  - path: contracts/motion/proto
    lint:
      use:
        - STANDARD
      except:
        - RPC_REQUEST_RESPONSE_UNIQUE
        - RPC_REQUEST_STANDARD_NAME
        - RPC_RESPONSE_STANDARD_NAME
        - SERVICE_SUFFIX
  - path: contracts/navigation/proto
    lint:
      use:
        - STANDARD
      except:
        - RPC_REQUEST_RESPONSE_UNIQUE
        - RPC_REQUEST_STANDARD_NAME
        - RPC_RESPONSE_STANDARD_NAME
        - SERVICE_SUFFIX

lint:
  use:
    - STANDARD
  disallow_comment_ignores: true

breaking:
  use:
    - FILE
