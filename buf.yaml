version: v2

modules:
  - path: crates/build/proto
    lint:
      use:
        - STANDARD
      except:
        - ENUM_VALUE_PREFIX
        - PACKAGE_DIRECTORY_MATCH
        - PACKAGE_VERSION_SUFFIX
