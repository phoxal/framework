[package]
name = "phoxal-macros"
version = "0.19.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Published to crates.io: `phoxal` depends on it by version, so it must be a real
# published crate (a path-only dependency cannot be published).
publish = true
description = "Proc-macros for the phoxal framework: phoxal_api_tree!, #[derive(Runtime)], #[phoxal::runtime]."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
heck = { workspace = true }

[lints]
workspace = true
