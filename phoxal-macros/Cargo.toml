[package]
name = "phoxal-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Published to crates.io: `phoxal` depends on it by version, so it must be a real
# published crate (a path-only dependency cannot be published).
publish = true
description = "Proc-macros for the phoxal framework API tree and participant authoring model."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
serde_derive_internals = { workspace = true }
# `visit-mut` on top of the workspace's `full`/`extra-traits`: only this crate
# needs the mutable AST visitor (`api_tree`'s `RevisionPathRewriter`, which
# rewrites inherited body paths into the child revision's own module).
syn = { workspace = true, features = ["visit-mut"] }
heck = { workspace = true }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
trybuild = { workspace = true }

[lints]
workspace = true
