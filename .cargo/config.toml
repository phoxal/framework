# The static registry this workspace's published packages use.
# Committed here rather than passed per
# invocation because everything that touches this workspace needs it:
# release-plz aborts outright without it ("registry index was not found in any
# configuration"), including inside the shared reusable release-PR workflow,
# which does not inherit the caller's environment.
#
# Robot projects need no equivalent: `cargo phoxal` supplies this index to the
# Cargo metadata, build, test, update, and packaging operations it owns, so a
# robot workspace stays free of registry configuration.
[registries.phoxal]
index = "sparse+https://phoxal.github.io/registry/"

# Keep local build warnings visible as errors while the API changes.
[build]
rustflags = ["-D", "warnings"]
